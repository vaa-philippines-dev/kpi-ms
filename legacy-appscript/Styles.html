<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,300&family=DM+Mono:wght@400;500&display=swap');

/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0b0d11;
  --bg-card:      rgba(255,255,255,0.04);
  --bg-surface:   rgba(255,255,255,0.06);
  --bg-hover:     rgba(255,255,255,0.08);
  --bg-elevated:  rgba(255,255,255,0.03);
  --bg-input:     #141720;
  --bg-header:    #1b1f2c;
  --bg-modal:     #111318;
  --bg-sidebar:   #0e1018;
  --bg-topbar:    rgba(11,13,17,0.85);
  --accent:       #00d4ff;
  --accent-2:     #a855f7;
  --accent-3:     #f472b6;
  --accent-glow:  rgba(0,212,255,0.18);
  --accent-dim:   rgba(0,212,255,0.10);
  --accent-light: #40e0ff;
  --success:    #10d48e;
  --warning:    #f5a623;
  --danger:     #ff4d6a;
  --info:       #4d9fff;
  --on-target:  #10d48e;
  --at-risk:    #f5a623;
  --critical:   #ff4d6a;
  --text-primary:   #f0f2f8;
  --text-secondary: #7b859a;
  --text-muted:     #44505f;
  --border:       rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.04);
  --border-glow:  rgba(0,212,255,0.30);
  --sidebar-w:          248px;
  --sidebar-collapsed:  64px;
  --topbar-h:           60px;
  --radius:    14px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --shadow-sm:   0 2px 8px rgba(0,0,0,0.3);
  --shadow:      0 8px 32px rgba(0,0,0,0.45);
  --shadow-glow: 0 0 24px rgba(0,212,255,0.12);
  --shadow-card: 0 1px 0 rgba(255,255,255,0.05) inset, 0 8px 32px rgba(0,0,0,0.4);
  --transition: 0.18s ease;
  --transition-md: 0.25s ease;
}

/* ═══════════════════════════════════════════════════════════════
   LIGHT THEME — toggled via body.light-theme (see AppCore.html toggleTheme())
   Overrides the same variable names used throughout the app, so every
   existing component (cards, tables, badges, etc.) picks it up automatically.
═══════════════════════════════════════════════════════════════ */
body.light-theme {
  --bg-deep:      #f4f5f8;
  --bg-card:      rgba(0,0,0,0.028);
  --bg-surface:   rgba(0,0,0,0.045);
  --bg-hover:     rgba(0,0,0,0.065);
  --bg-elevated:  rgba(0,0,0,0.03);
  --bg-input:     #ffffff;
  --bg-header:    #e7ebf3;
  --bg-modal:     #ffffff;
  --bg-sidebar:   #eaf1fc;
  --bg-topbar:    rgba(255,255,255,0.88);
  --accent-glow:  rgba(0,132,255,0.14);
  --accent-dim:   rgba(0,132,255,0.08);
  --text-primary:   #1a1d29;
  --text-secondary: #5b6577;
  --text-muted:     #94a0b2;
  --border:       rgba(0,0,0,0.10);
  --border-light: rgba(0,0,0,0.06);
  --border-glow:  rgba(0,132,255,0.25);
  --shadow-sm:   0 2px 8px rgba(20,25,40,0.06);
  --shadow:      0 8px 32px rgba(20,25,40,0.09);
  --shadow-glow: 0 0 24px rgba(0,132,255,0.10);
  --shadow-card: 0 1px 0 rgba(255,255,255,0.7) inset, 0 8px 24px rgba(20,25,40,0.06);
}
body.light-theme .card,
body.light-theme .top-bar,
body.light-theme .sidebar { backdrop-filter: blur(8px) saturate(1.05); -webkit-backdrop-filter: blur(8px) saturate(1.05); }
body.light-theme ::-webkit-scrollbar-track { background: rgba(0,0,0,0.04); }
body.light-theme ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); }

/* Theme toggle control (sidebar footer) */
.theme-toggle-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-surface); color: var(--text-secondary); cursor: pointer;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.theme-toggle-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }
.theme-toggle-btn .ttb-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.theme-toggle-btn .ttb-label { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

html, body {
  height: 100%;
  min-width: 1024px;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 12px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 12px; }
.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════════ */

.splash-screen {
  position: fixed; inset: 0;
  background: var(--bg-deep);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.splash-content { text-align: center; }
.splash-logo { margin-bottom: 20px; }
.splash-content h2 {
  color: var(--text-primary);
  font-size: 20px; font-weight: 700;
  margin-bottom: 28px; letter-spacing: -0.02em;
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.app-shell { display: flex; height: 100vh; overflow: hidden; position: relative; z-index: 1; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width var(--transition-md) cubic-bezier(0.4,0,0.2,1);
  flex-shrink: 0; z-index: 100;
  position: relative;
}
.sidebar::after {
  content: '';
  position: absolute; top: 0; right: -1px;
  width: 1px; height: 100%;
  background: linear-gradient(to bottom, transparent 0%, var(--accent) 40%, var(--accent-2) 70%, transparent 100%);
  opacity: 0.2;
}
.sidebar.collapsed { width: var(--sidebar-collapsed); }
.sidebar.collapsed .logo-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .user-details,
.sidebar.collapsed .btn-logout span { display: none; }
.sidebar.collapsed .sidebar-nav a { justify-content: center; padding: 11px; }
.sidebar.collapsed .nav-icon { margin: 0; }
.sidebar.collapsed .theme-toggle-btn .ttb-label { display: none; }
.sidebar.collapsed .theme-toggle-btn { justify-content: center; padding: 8px; }

.sidebar-header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 14px;
  border-bottom: 1px solid var(--border);
  min-height: var(--topbar-h);
}
.logo-text {
  font-size: 14px; font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; flex: 1;
  letter-spacing: -0.02em;
}
.sidebar-toggle {
  color: var(--text-muted);
  padding: 6px; border-radius: var(--radius-xs);
  transition: all var(--transition);
  flex-shrink: 0;
}
.sidebar-toggle:hover { color: var(--accent); background: var(--accent-dim); }

.sidebar-nav { flex: 1; padding: 10px 0; overflow-y: auto; overflow-x: hidden; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  margin: 1px 8px;
  transition: all var(--transition);
  white-space: nowrap;
  font-size: 12px; font-weight: 500;
  position: relative;
}
.sidebar-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-nav a.active { background: var(--accent-dim); color: var(--accent); }
.sidebar-nav a.active::before {
  content: '';
  position: absolute; left: -8px; top: 20%; bottom: 20%;
  width: 2.5px; border-radius: 0 2px 2px 0;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.sidebar-nav a.active .nav-icon svg { stroke: var(--accent); }
.nav-icon { flex-shrink: 0; display: flex; align-items: center; }
.nav-section {
  padding: 16px 20px 6px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted);
}
.sidebar.collapsed .nav-section { display: none; }

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; flex-shrink: 0;
  color: #fff;
  box-shadow: 0 0 12px rgba(0,212,255,0.2);
}
.user-details { flex: 1; overflow: hidden; }
.user-name { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-role { display: block; font-size: 11px; color: var(--text-muted); }
.btn-logout { color: var(--text-muted); padding: 6px; border-radius: var(--radius-xs); transition: all var(--transition); flex-shrink: 0; }
.btn-logout:hover { color: var(--danger); background: rgba(255,77,106,0.08); }

/* ── MAIN CONTENT ── */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.top-bar {
  height: var(--topbar-h);
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; flex-shrink: 0;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.page-title-wrap { display: flex; align-items: center; gap: 12px; }
.mobile-toggle { display: none; color: var(--text-secondary); }
.page-title { font-size: 17px; font-weight: 700; letter-spacing: -0.025em; color: var(--text-primary); }
.week-badge {
  background: var(--accent-dim);
  color: var(--accent);
  padding: 4px 12px; border-radius: 20px;
  font-size: 11.5px; font-weight: 600;
  border: 1px solid rgba(0,212,255,0.15);
}

/* Topbar right-side elements */
.top-bar-actions {
  display: flex; align-items: center; gap: 10px;
}
.topbar-icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  transition: all var(--transition);
  flex-shrink: 0;
}
.topbar-icon-btn:hover { color: var(--accent); background: var(--accent-dim); }
.topbar-icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
.topbar-divider {
  width: 1px; height: 28px;
  background: var(--border);
  flex-shrink: 0;
}
.topbar-user {
  display: flex; align-items: center; gap: 9px;
  cursor: default;
}
.topbar-logout {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--radius-xs);
  transition: all var(--transition);
  flex-shrink: 0;
}
.page-content {
  flex: 1; overflow-y: auto; padding: 24px;
  background:
    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(168,85,247,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 10% 80%, rgba(0,212,255,0.03) 0%, transparent 50%);
}

/* ═══════════════════════════════════════════════════════════════
   COMPONENTS
═══════════════════════════════════════════════════════════════ */

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: border-color var(--transition);
}
.card:hover { border-color: rgba(255,255,255,0.12); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.card-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.card-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 20px 18px;
  position: relative; overflow: hidden;
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  cursor: default;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.stat-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events: none;
}
.stat-card::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px; border-radius: var(--radius) var(--radius) 0 0;
}
.stat-card.on-target::after { background: linear-gradient(90deg, var(--on-target), transparent); }
.stat-card.at-risk::after   { background: linear-gradient(90deg, var(--at-risk), transparent); }
.stat-card.critical::after  { background: linear-gradient(90deg, var(--critical), transparent); }
.stat-card.total::after     { background: linear-gradient(90deg, var(--info), transparent); }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow), var(--shadow-glow); }
.stat-card:hover.on-target  { border-color: rgba(16,212,142,0.3); }
.stat-card:hover.at-risk    { border-color: rgba(245,166,35,0.3); }
.stat-card:hover.critical   { border-color: rgba(255,77,106,0.3); }
.stat-card:hover.total      { border-color: rgba(77,159,255,0.3); }
.stat-card .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; margin-bottom: 8px; }
.stat-card .stat-value { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.stat-card .stat-icon { position: absolute; right: 16px; top: 14px; opacity: 0.08; }
.stat-card.on-target .stat-value { color: var(--on-target); }
.stat-card.at-risk .stat-value   { color: var(--at-risk); }
.stat-card.critical .stat-value  { color: var(--critical); }
.stat-card.total .stat-value     { color: var(--info); }
.stat-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; font-weight: 400; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: rgba(255,255,255,0.02);
  color: var(--text-muted);
  font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 10px 14px; text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border-light); transition: background var(--transition); }
tbody tr:hover { background: var(--bg-hover); }
tbody td { padding: 10px 14px; vertical-align: middle; color: var(--text-primary); font-size: 12px; }
tbody tr:last-child { border-bottom: none; }
.table-empty { text-align: center; color: var(--text-muted); padding: 48px 20px; font-size: 13px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  font-family: 'DM Mono', monospace;
}
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.badge-success, .badge-on-target { background: rgba(16,212,142,0.10); color: var(--on-target); border: 1px solid rgba(16,212,142,0.2); }
.badge-warning, .badge-at-risk   { background: rgba(245,166,35,0.10); color: var(--at-risk);   border: 1px solid rgba(245,166,35,0.2); }
.badge-danger,  .badge-critical  { background: rgba(255,77,106,0.10); color: var(--critical);  border: 1px solid rgba(255,77,106,0.2); }
.badge-info   { background: rgba(77,159,255,0.10); color: var(--info);    border: 1px solid rgba(77,159,255,0.2); }
.badge-muted  { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  transition: all var(--transition);
  white-space: nowrap; letter-spacing: -0.01em;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, #0099cc 100%);
  color: #0b0d11;
  box-shadow: 0 0 20px rgba(0,212,255,0.18);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 32px rgba(0,212,255,0.32); filter: brightness(1.08); }
.btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: rgba(255,77,106,0.08); color: var(--danger); border: 1px solid rgba(255,77,106,0.25); }
.btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 16px rgba(255,77,106,0.3); }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); color: var(--text-muted); transition: all var(--transition); }
.btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-icon.danger:hover { color: var(--danger); }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.07em; }
.form-control {
  width: 100%; padding: 9px 13px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}
.form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }
.form-control::placeholder { color: var(--text-muted); }
select.form-control option { background: var(--bg-input); color: var(--text-primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.form-error { color: var(--danger); font-size: 12px; margin-top: 4px; }
.form-hint { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
.checkbox-wrap { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.checkbox-wrap input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

.kpi-target-input, .kpi-actual-input {
  width: 80px; padding: 5px 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text-primary);
  text-align: center;
  font-family: 'DM Mono', monospace; font-size: 13px;
  transition: border-color var(--transition);
}
.kpi-target-input:focus, .kpi-actual-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(0,212,255,0.1); }

.auth-screen {
  min-height: 100vh;
  min-width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,212,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 90% 90%, rgba(168,85,247,0.05) 0%, transparent 60%),
    var(--bg-deep);
}
#auth-screen {
  display: block;
  width: 100%;
  min-width: 480px;
  height: 100vh;
  overflow: auto;
  background: var(--bg-deep);
}
.auth-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 44px 40px;
  width: 100%; min-width: 360px; max-width: 420px;
  box-shadow: var(--shadow), 0 0 80px rgba(0,212,255,0.04);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  position: relative; overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
}
.auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
.auth-logo h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.auth-logo span { color: var(--accent); }
.auth-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.03em; }
.auth-subtitle { color: var(--text-secondary); margin-bottom: 28px; font-size: 13.5px; }
.auth-footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 11.5px; text-align: center; }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--bg-modal);
  border: 1px solid var(--border);
  border-radius: 18px;
  width: calc(66.66vw); max-width: calc(66.66vw); max-height: 90vh;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--shadow), 0 0 60px rgba(0,0,0,0.5);
  animation: modal-in 0.22s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
}
.modal-box::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
}
.modal-box.modal-lg  { max-width: 800px; width: 800px; }
.modal-box.modal-xl  { max-width: 1000px; width: 1000px; }
.modal-box.modal-xxl { max-width: 1200px; width: 1200px; }
.modal-box.modal-fs  { max-width: calc(100vw - 48px); width: calc(100vw - 48px); }
@keyframes modal-in { from { opacity: 0; transform: scale(0.94) translateY(8px); } }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-header h3 { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; }
.modal-close { font-size: 20px; color: var(--text-muted); line-height: 1; padding: 4px 7px; border-radius: var(--radius-xs); transition: all var(--transition); }
.modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }

.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-modal); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 16px;
  min-width: 288px; display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow); animation: toast-in 0.25s cubic-bezier(0.34,1.56,0.64,1);
  font-size: 13px;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error   { border-left: 3px solid var(--danger); }
.toast.warning { border-left: 3px solid var(--warning); }
.toast.info    { border-left: 3px solid var(--info); }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } }

.tabs { display: flex; gap: 2px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 3px; border-radius: var(--radius-sm); width: fit-content; margin-bottom: 20px; }
.tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all var(--transition); }
.tab.active { background: var(--accent); color: #0b0d11; }
.tab:hover:not(.active) { color: var(--text-primary); background: var(--bg-hover); }

.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filter-bar input, .filter-bar select { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; color: var(--text-primary); outline: none; font-size: 13px; transition: border-color var(--transition); }
.filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,0.08); }

.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

.status-on-target { color: var(--on-target); }
.status-at-risk   { color: var(--at-risk); }
.status-critical  { color: var(--critical); }
.status-no-data   { color: var(--text-muted); }

.perf-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
.perf-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
.perf-bar-fill.on-target { background: linear-gradient(90deg, var(--on-target), #0af5a0); }
.perf-bar-fill.at-risk   { background: linear-gradient(90deg, var(--at-risk), #ffd166); }
.perf-bar-fill.critical  { background: linear-gradient(90deg, var(--critical), #ff8fa3); }

.conn-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  cursor: pointer; position: relative; overflow: hidden;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.conn-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 50%); pointer-events: none; }
.conn-card:hover { border-color: rgba(0,212,255,0.25); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 20px rgba(0,212,255,0.05); }
.conn-card.flagged { border-left: 3px solid var(--warning); }
.conn-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.conn-card-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.conn-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.conn-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-light); font-size: 12px; color: var(--text-muted); }

.chart-container { position: relative; height: 220px; }
.chart-bar-group { display: flex; align-items: flex-end; gap: 5px; height: 100%; padding-bottom: 24px; }
.chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
.chart-bar { width: 100%; border-radius: 5px 5px 0 0; transition: height 0.6s cubic-bezier(0.4,0,0.2,1), filter var(--transition); min-width: 18px; }
.chart-bar:hover { filter: brightness(1.25); }
.chart-bar-label { font-size: 10px; color: var(--text-muted); text-align: center; font-family: 'DM Mono', monospace; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
.chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.donut-legend { display: flex; flex-direction: column; gap: 10px; }
.donut-legend-item { display: flex; align-items: center; gap: 10px; }
.donut-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.donut-legend-label { font-size: 12px; color: var(--text-secondary); }
.donut-legend-val { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-left: auto; min-width: 28px; text-align: right; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state svg { opacity: 0.2; margin-bottom: 16px; }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
.empty-state p { font-size: 13px; }

.loading-overlay { display: flex; align-items: center; justify-content: center; padding: 60px; }
.inline-spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════ */
.text-accent    { color: var(--accent); }
.text-muted     { color: var(--text-muted); }
.text-secondary { color: var(--text-secondary); }
.text-success   { color: var(--success); }
.text-danger    { color: var(--danger); }
.text-warning   { color: var(--warning); }
.fw-700    { font-weight: 700; }
.mono      { font-family: 'DM Mono', monospace; }
.mt-4      { margin-top: 4px; }
.mt-8      { margin-top: 8px; }
.mt-16     { margin-top: 16px; }
.mt-24     { margin-top: 24px; }
.mb-16     { margin-bottom: 16px; }
.mb-24     { margin-bottom: 24px; }
.gap-8     { gap: 8px; }
.flex      { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.items-center    { align-items: center; }
.justify-between { justify-content: space-between; }
.flag-icon       { color: var(--warning); }
.divider   { height: 1px; background: var(--border); margin: 16px 0; }
.pill { background: rgba(255,255,255,0.05); color: var(--text-muted); padding: 2px 9px; border-radius: 20px; font-size: 11px; border: 1px solid var(--border); }

/* ═══════════════════════════════════════════════════════════════
   IMPORT UI
═══════════════════════════════════════════════════════════════ */

/* Stepper */
.import-stepper {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.import-step {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.import-step-num {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  background: var(--bg-hover); color: var(--text-muted);
  border: 1.5px solid var(--border);
  transition: all var(--transition);
}
.import-step-label {
  font-size: 12.5px; font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
}
.import-step.active .import-step-num  { background: var(--accent); color: #0b0d11; border-color: var(--accent); box-shadow: 0 0 10px rgba(0,212,255,0.3); }
.import-step.active .import-step-label { color: var(--text-primary); }
.import-step.done .import-step-num    { background: var(--success); color: #0b0d11; border-color: var(--success); }
.import-step.done .import-step-label  { color: var(--text-secondary); }
.import-step-line {
  flex: 1; height: 1.5px;
  background: var(--border); margin: 0 10px;
  min-width: 20px;
}
.import-step-line.done { background: var(--success); }

/* Column map hint */
.import-col-map {
  background: rgba(0,212,255,0.04);
  border: 1px solid rgba(0,212,255,0.12);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 16px;
}
.import-col-map-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--text-secondary);
  margin-bottom: 10px; font-weight: 500;
}
.import-col-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.import-col-pill {
  font-size: 11px; font-weight: 600;
  font-family: 'DM Mono', monospace;
  padding: 3px 10px; border-radius: 4px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.import-col-pill.required {
  background: rgba(0,212,255,0.08);
  border-color: rgba(0,212,255,0.2);
  color: var(--accent);
}

/* Upload zone */
.import-upload-zone {
  flex: 0 0 200px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 20px 16px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  cursor: pointer; text-align: center;
  transition: all var(--transition);
  color: var(--text-muted);
  background: var(--bg-elevated);
}
.import-upload-zone:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.import-upload-zone.loaded { border-color: var(--success); background: rgba(16,212,142,0.06); color: var(--success); border-style: solid; }
.import-upload-text { font-size: 12.5px; font-weight: 600; }
.import-upload-hint { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

/* Or divider */
.import-divider-or {
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; padding: 0 4px;
}
.import-divider-or span {
  font-size: 11px; color: var(--text-muted);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em;
  background: var(--bg-deep);
  padding: 4px;
}

/* Paste area */
.import-paste-area {
  resize: vertical; min-height: 110px;
  font-family: 'DM Mono', monospace;
  font-size: 12px; line-height: 1.6;
}

/* Summary bar */
.import-summary-bar {
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.import-summary-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px 20px; border-radius: var(--radius);
  min-width: 100px; flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.import-summary-item.total   { border-color: rgba(77,159,255,0.2); background: rgba(77,159,255,0.06); }
.import-summary-item.success { border-color: rgba(16,212,142,0.2); background: rgba(16,212,142,0.06); }
.import-summary-item.error   { border-color: rgba(255,77,106,0.2); background: rgba(255,77,106,0.06); }
.import-summary-num {
  font-size: 32px; font-weight: 800; line-height: 1;
  letter-spacing: -0.03em; font-family: 'DM Mono', monospace;
}
.import-summary-item.total .import-summary-num   { color: var(--info); }
.import-summary-item.success .import-summary-num { color: var(--success); }
.import-summary-item.error .import-summary-num   { color: var(--danger); }
.import-summary-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

/* Preview table */
.import-preview-table { width: 100%; border-collapse: collapse; }
.import-preview-table thead th {
  background: rgba(255,255,255,0.02);
  color: var(--text-muted);
  font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.07em;
  padding: 8px 12px; text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; position: sticky; top: 0; z-index: 1;
}
.import-preview-table tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--border-light); }
.import-preview-table tbody tr:last-child td { border-bottom: none; }
.import-row-error > td { background: rgba(255,77,106,0.04); }
.import-row-error-detail > td { padding: 0; background: rgba(255,77,106,0.04); border-bottom: 1px solid rgba(255,77,106,0.1); }
.import-row-errors { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 12px 9px; }
.import-row-error-msg { font-size: 11.5px; color: var(--danger); font-weight: 500; }

/* Note bars */
.import-note-bar {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 12.5px; margin: 12px 0;
}
.import-note-bar.warning { background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.2); color: var(--warning); }
.import-note-bar.success { background: rgba(16,212,142,0.08); border: 1px solid rgba(16,212,142,0.2); color: var(--success); }
.import-note-bar strong { color: inherit; }

/* Error bar */
.import-error-bar {
  background: rgba(255,77,106,0.08);
  border: 1px solid rgba(255,77,106,0.2);
  color: var(--danger);
  border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 13px;
  margin-bottom: 12px;
}

/* ── KPI SERVICE GROUPS ── */
.kpi-dept-section { margin-bottom: 28px; }
.kpi-dept-section-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.kpi-dept-section-name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); }
.kpi-dept-section-count {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 10px;
}
.kpi-svc-group {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
  backdrop-filter: blur(8px); transition: border-color var(--transition);
}
.kpi-svc-group:hover { border-color: rgba(255,255,255,0.12); }
.kpi-svc-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; cursor: pointer; user-select: none;
  transition: background var(--transition);
}
.kpi-svc-group-header:hover { background: var(--bg-hover); }
.kpi-svc-group-left { display: flex; align-items: center; gap: 10px; }
.kpi-svc-chevron { color: var(--text-muted); transition: transform 0.2s ease; flex-shrink: 0; }
.kpi-svc-group-name { font-size: 13.5px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.kpi-svc-count-badge {
  font-size: 11px; font-weight: 700; font-family: 'DM Mono', monospace;
  color: var(--accent); background: var(--accent-dim);
  border: 1px solid rgba(0,212,255,0.15); padding: 1px 8px; border-radius: 10px;
}
.kpi-svc-group-actions { display: flex; gap: 6px; align-items: center; }
.kpi-svc-group-body { border-top: 1px solid var(--border); }
.kpi-svc-table { width: 100%; border-collapse: collapse; }
.kpi-svc-table thead th {
  background: rgba(255,255,255,0.02); color: var(--text-muted);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 8px 14px; text-align: left;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.kpi-svc-table tbody tr { border-bottom: 1px solid var(--border-light); transition: background var(--transition); }
.kpi-svc-table tbody tr:hover { background: var(--bg-hover); }
.kpi-svc-table tbody td { padding: 10px 14px; vertical-align: middle; }
.kpi-svc-table tbody tr:last-child { border-bottom: none; }

/* ── BULK KPI TABLE ── */
.bulk-kpi-table { width: 100%; border-collapse: collapse; min-width: 900px; }
.bulk-kpi-table thead th {
  background: rgba(255,255,255,0.03); color: var(--text-muted);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 8px 10px; text-align: left;
  border-bottom: 1px solid var(--border); white-space: nowrap;
  position: sticky; top: 0; z-index: 1;
}
.bulk-kpi-table tbody tr { border-bottom: 1px solid var(--border-light); }
.bulk-kpi-table tbody tr:last-child { border-bottom: none; }
.bulk-kpi-table tbody td { padding: 6px 8px; vertical-align: top; }
.bulk-kpi-table .form-control { padding: 5px 8px; font-size: 13px; }

/* ═══════════════════════════════════════════════════════════════
   KPI VIEW TOGGLE
.kpi-view-toggle {
  display: flex;
  align-items: center;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.kpi-vtoggle-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  color: var(--text-muted);
  transition: all 0.15s ease;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.kpi-vtoggle-btn svg { opacity: 0.7; transition: opacity 0.15s; }
.kpi-vtoggle-btn:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,0.06); }
.kpi-vtoggle-btn:hover:not(.active) svg { opacity: 1; }
.kpi-vtoggle-btn.active {
  background: white;
  color: #0b0d11;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
.kpi-vtoggle-btn.active svg { opacity: 1; }

/* ── DEPT CARD GRID ── */
.kpi-dept-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 1200px) { .kpi-dept-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 900px)  { .kpi-dept-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 580px)  { .kpi-dept-grid { grid-template-columns: 1fr; } }
.kpi-dept-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(8px);
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  position: relative; overflow: hidden;
}
.kpi-dept-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  opacity: 0.6;
}
.kpi-dept-card:hover {
  border-color: rgba(0,212,255,0.2);
  transform: translateY(-2px);
  box-shadow: var(--shadow), 0 0 20px rgba(0,212,255,0.05);
