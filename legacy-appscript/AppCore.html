<script>
var State = {
user: null,
currentPage: null,
cache: {},
sidebarCollapsed: false
};

function startApp() {
  if (typeof VAA_LOG !== "undefined") VAA_LOG.info("CORE", "startApp()");
applyTheme(getSavedTheme());
var loading = document.getElementById('app-loading');
var auth    = document.getElementById('auth-screen');
if (loading) loading.classList.add('hidden');
if (auth)    auth.classList.remove('hidden');
try { updateWeekBadge(); } catch(e) {}
}

// ── Light / Dark theme ─────────────────────────────────────────────────
function getSavedTheme() {
  try { return localStorage.getItem('vaa_theme') || 'dark'; } catch(e) { return 'dark'; }
}
function applyTheme(theme) {
  var isLight = theme === 'light';
  document.body.classList.toggle('light-theme', isLight);
  _updateThemeToggleBtn(isLight);
}
function toggleTheme() {
  var isLight = document.body.classList.contains('light-theme');
  var next = isLight ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('vaa_theme', next); } catch(e) {}
}
function _updateThemeToggleBtn(isLight) {
  var btn = document.getElementById('theme-toggle-btn');
  if (!btn) return;
  var icon = isLight
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  btn.innerHTML = '<span class="ttb-icon">'+icon+'</span><span class="ttb-label">'+(isLight?'Light Mode':'Dark Mode')+'</span>';
  btn.title = 'Switch to ' + (isLight ? 'dark' : 'light') + ' mode';
}

if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', startApp);
} else {
startApp();
}

function updateWeekBadge() {
var now = new Date();
var day = now.getDay();
var diff = now.getDate() - day + (day === 0 ? -6 : 1);
var mon = new Date(now); mon.setDate(diff);
// week badge removed from topbar
}

// handleLogin and handleChangePwd are defined in Auth.html (loaded before AppCore)
// so they are already available when the form's onsubmit fires.

function logout() {
State.user = null;
State.cache = {};
document.getElementById('main-app').classList.add('hidden');
document.getElementById('auth-screen').classList.remove('hidden');
document.getElementById('login-form-wrap').classList.remove('hidden');
document.getElementById('change-pwd-wrap').classList.add('hidden');
document.getElementById('login-form').reset();
document.getElementById('auth-error').classList.add('hidden');
}

function initApp() {
  if (typeof VAA_LOG !== "undefined") VAA_LOG.info("CORE", "initApp() role=" + (State.user && State.user.role));
document.getElementById('auth-screen').classList.add('hidden');
document.getElementById('main-app').classList.remove('hidden');
var u = State.user;
document.getElementById('user-name').textContent = u.firstName + ' ' + u.lastName;
document.getElementById('user-role').textContent = u.role;
document.getElementById('user-avatar').textContent = (u.firstName || 'U')[0].toUpperCase();
buildSidebar();
navigateTo(getDefaultPage());
}

function getDefaultPage() {
var role = State.user.role;
if (role === 'Administrator') return 'admin-dashboard';
if (role === 'Manager') return 'manager-dashboard';
if (role === 'Team Leader') return 'tl-dashboard';
if (role === 'CS Specialist') return 'cs-dashboard';
return 'va-dashboard';
}

function buildSidebar() {
var role = State.user.role;
var nav = document.getElementById('sidebar-nav');
var navItems = getNavItems(role);
nav.innerHTML = navItems.map(item => {
if (item.type === 'section') return `<div class="nav-section">${item.label}</div>`;
return `<a href="#" onclick="navigateTo('${item.page}');return false;" id="nav-${item.page}">
<span class="nav-icon">${item.icon}</span>
<span class="nav-label">${item.label}</span>
</a>`;
}).join('');
}

function toggleSidebar() {
var sb = document.getElementById('sidebar');
if (window.innerWidth <= 768) {
sb.classList.toggle('open');
} else {
sb.classList.toggle('collapsed');
State.sidebarCollapsed = !State.sidebarCollapsed;
}
}

function refreshCurrentPage() {
var btn = document.getElementById('refresh-btn');
if (btn) btn.classList.add('spinning');
var page = State.currentPage;
var pageMap2 = {
'admin-dashboard':'renderAdminDashboard','manager-dashboard':'renderManagerDashboard',
'tl-dashboard':'renderTLDashboard','cs-dashboard':'renderCSDashboard',
'va-dashboard':'renderVADashboard','va-connections':'renderConnections',
'va-vaconnections':'renderVAConnections','submit-report':'renderSubmitReport',
'analytics':'renderAnalytics','my-team':'renderMyTeam','submissions':'renderSubmissions','lifetime':'renderLifetimeReport','customer-overview':'renderCustomerOverview','users':'renderUsers','va-kpi-sheet':'renderVAKPISheet',
'departments':'renderDepartments','kpi-master':'renderKPIMaster','login-activity':'renderLoginActivity',
'settings':'renderSysSettings','interventions':'renderInterventions',
'teams':'renderTeams','kpi-config':'renderKPIConfig','customers-admin':'renderCustomersAdmin'
};
var fn = window[pageMap2[page]];
if (typeof fn === 'function') {
fn();
setTimeout(function(){ if (btn) btn.classList.remove('spinning'); }, 600);
} else {
if (btn) btn.classList.remove('spinning');
}
}

function navigateTo(page) {
  if (typeof VAA_LOG !== "undefined") VAA_LOG.info("NAV", "navigateTo(" + page + ")");
State.currentPage = page;
document.querySelectorAll('#sidebar-nav a').forEach(a => a.classList.remove('active'));
var activeNav = document.getElementById('nav-' + page);
if (activeNav) activeNav.classList.add('active');
var pageTitles = {
'admin-dashboard':'Dashboard','manager-dashboard':'Dashboard','tl-dashboard':'Team Dashboard',
'cs-dashboard':'Analytics Dashboard','va-dashboard':'My Dashboard','va-connections':'VA Connections',
'va-vaconnections':'My VA Connections','my-team':'My Team','submit-report':'Submit KPI Report','analytics':'Performance Analytics','va-kpi-sheet':'VA KPI Sheet',
'users':'User Management','departments':'Departments & Services','kpi-master':'KPI Library','login-activity':'Login Activity',
'sys-settings':'System Settings','submissions':'Submission Tracker','lifetime':'Lifetime Value','customer-overview':'Customer Overview','interventions':'Interventions','teams':'Team Management',
'kpi-config':'KPI Configuration','customers-admin':'Customers'
};
document.getElementById('page-title').textContent = pageTitles[page] || page;
var content = document.getElementById('page-content');
content.innerHTML = '<div class="loading-overlay"><div class="inline-spinner"></div></div>';
var pageMap = {
'admin-dashboard':   'renderAdminDashboard',
'manager-dashboard': 'renderManagerDashboard',
'tl-dashboard':      'renderTLDashboard',
'cs-dashboard':      'renderCSDashboard',
'va-dashboard':      'renderVADashboard',
'va-connections':    'renderConnections',
'my-team':           'renderMyTeam',
'va-vaconnections':  'renderVAConnections',
'submit-report':     'renderSubmitReport',
'analytics':         'renderAnalytics',
'va-kpi-sheet':      'renderVAKPISheet',
'submissions':       'renderSubmissions',
'reports':           'renderReports',
'lifetime':          'renderLifetimeReport',
'customer-overview': 'renderCustomerOverview',
'users':             'renderUsers',
'login-activity':    'renderLoginActivity',
'departments':       'renderDepartments',
'kpi-master':        'renderKPIMaster',
'sys-settings':      'renderSysSettings',
'customers-admin':   'renderCustomersAdmin',
'interventions':     'renderInterventions',
'teams':             'renderTeams',
'kpi-config':        'renderKPIConfig'
};
var fnName = pageMap[page];
var renderer = fnName ? window[fnName] : null;
if (typeof renderer === 'function') {
  renderer();
  gpShowBar(page);
} else {
  // Retry once after scripts finish loading (handles include order race)
  setTimeout(function() {
    var r2 = fnName ? window[fnName] : null;
    if (typeof r2 === 'function') {
      r2();
      gpShowBar(page);
    } else {
      // Second retry at 3s for slow-loading includes
      setTimeout(function() {
        var r3 = fnName ? window[fnName] : null;
        if (typeof r3 === 'function') { r3(); gpShowBar(page); }
        else {
          if (typeof VAA_LOG !== 'undefined') VAA_LOG.error('NAV', 'Page not found: ' + page + ' fn=' + fnName);
          content.innerHTML = '<div class="empty-state"><h3>Page not found</h3><p style="color:var(--text-muted);font-size:12px;">Route: <code>'+page+'</code></p></div>';
        }
      }, 2000);
    }
  }, 800);
}
}
/* ─── Reusable DataTable Component ─────────────────────────── */
/*
  Usage:
  renderDataTable({
    containerId: 'my-table',          // id of target element
    columns: [
      { key:'ClientName', label:'Client', sortable:true, filterable:true },
      { key:'Status', label:'Status', sortable:true, filterable:'select',
        render: function(v,row){ return '<span class="badge">'+v+'</span>'; } }
    ],
    data: [...],                       // array of objects
    defaultLimit: 10,                  // optional, default 10
    limitOptions: [10,25,50,100],      // optional
    emptyMessage: 'No records found.',
    tableClass: '',                    // extra class for <table>
  })
  Returns a DataTable controller: { refresh(), filter() }
*/
function renderDataTable(opts) {
  if (typeof VAA_LOG !== "undefined") VAA_LOG.debug("DT", "renderDataTable: containerId=" + opts.containerId + " rows=" + (opts.data||[]).length);
  var container = document.getElementById(opts.containerId);
  if (!container) return;

  var data        = opts.data || [];
  var columns     = opts.columns || [];
  var limitOpts   = opts.limitOptions || [10, 25, 50, 100];
  var limit       = opts.defaultLimit || 10;
  var emptyMsg    = opts.emptyMessage || 'No records found.';
  var tableClass  = opts.tableClass || '';

  var sortKey     = opts.defaultSort ? opts.defaultSort.key : null;
  var sortDir     = opts.defaultSort ? (opts.defaultSort.dir || 'asc') : 'asc';
  var page        = 1;
  var globalQ     = '';
  var colFilters  = {};
  var filteredData = data.slice();

  // ── Build HTML scaffold ──
  container.innerHTML = '<div class="dt-wrapper">'
    + '<div class="dt-toolbar">'
    + '<input class="form-control dt-search" placeholder="Search all columns\u2026" id="dt-global-'+opts.containerId+'" style="min-width:170px;">'
    + '<div id="dt-sel-filters-'+opts.containerId+'" style="display:contents;"></div>'
    + '<div style="display:flex;align-items:center;gap:6px;margin-left:auto;">'
    + '<label style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">Rows:</label>'
    + '<select class="form-control" id="dt-limits-'+opts.containerId+'" style="width:72px;font-size:13px;padding:3px 6px;height:30px;">'
    + limitOpts.map(function(n){ return '<option value="'+n+'"'+(n===limit?' selected':'')+'>'+n+'</option>'; }).join('')
    + '</select></div></div>'
    + '<div class="table-wrap"><table class="'+tableClass+'" id="dt-table-'+opts.containerId+'">'
    + '<thead><tr id="dt-thead-'+opts.containerId+'"></tr></thead>'
    + '<tbody id="dt-tbody-'+opts.containerId+'"></tbody>'
    + '</table></div>'
    + '<div class="dt-footer">'
    + '<span id="dt-info-'+opts.containerId+'"></span>'
    + '<div class="dt-page-btns" id="dt-pages-'+opts.containerId+'"></div>'
    + '</div></div>';

  // ── Build select filters via DOM (safe \u2014 avoids innerHTML injection issues) ──
  var selFilterWrap = document.getElementById('dt-sel-filters-'+opts.containerId);
  columns.forEach(function(col) {
    if (col.filterable !== 'select') return;
    var sel = document.createElement('select');
    sel.className = 'form-control';
    sel.setAttribute('data-col', col.key);
    sel.style.width    = 'auto';
    sel.style.fontSize = '13px';
    sel.style.height   = '32px';
    sel.style.padding  = '2px 8px';
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = col.filterPlaceholder || 'All';
    sel.appendChild(blank);
    if (Array.isArray(col.filterOptions)) {
      // Explicit {value,label} pairs — for boolean/coded columns where the raw
      // stored value (e.g. true/false) isn't a readable label on its own.
      col.filterOptions.forEach(function(o){
        var opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        sel.appendChild(opt);
      });
    } else {
      // Default: auto-derive distinct values straight from the data
      var vals = Array.from(new Set(data.map(function(r){ return r[col.key]||''; }))).filter(Boolean).sort();
      vals.forEach(function(v){
        var opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      });
    }
    sel.addEventListener('change', function(){
      colFilters[col.key] = this.value.toLowerCase();
      page = 1; _render();
    });
    if (selFilterWrap) selFilterWrap.appendChild(sel);
  });



  // ── Build header ──
  var theadRow = document.getElementById('dt-thead-'+opts.containerId);
  columns.forEach(function(col) {
    var th = document.createElement('th');
    th.style.cursor = col.sortable ? 'pointer' : 'default';
    th.setAttribute('data-key', col.key);
    var sortIcon = col.sortable
      ? '<span class="dt-sort-icon"><svg width="8" height="5" viewBox="0 0 8 5"><path d="M4 0L8 5H0Z" fill="currentColor"/></svg>'
        + '<svg width="8" height="5" viewBox="0 0 8 5"><path d="M4 5L0 0H8Z" fill="currentColor"/></svg></span>'
      : '';
    th.innerHTML = col.label + sortIcon;
    if (col.sortable) {
      th.addEventListener('click', function() {
        if (sortKey === col.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortKey = col.key; sortDir = 'asc'; }
        document.querySelectorAll('#dt-thead-'+opts.containerId+' th').forEach(function(t){
          t.classList.remove('dt-sorted-asc','dt-sorted-desc');
        });
        th.classList.add('dt-sorted-'+sortDir);
        page = 1; _render();
      });
    }
    if (opts.defaultSort && opts.defaultSort.key === col.key) {
      th.classList.add('dt-sorted-'+sortDir);
    }
    theadRow.appendChild(th);
  });

  // ── (select filters wired above via DOM) ──


  // ── Global search ──
  document.getElementById('dt-global-'+opts.containerId).addEventListener('input', function(){
    globalQ = this.value.toLowerCase(); page = 1; _render();
  });

  // ── Limit dropdown ──
  document.getElementById('dt-limits-'+opts.containerId).addEventListener('change', function(){
    limit = parseInt(this.value);
    page = 1; _render();
  });

  function _applyFilters() {
    filteredData = data.filter(function(row) {
      // Global search
      if (globalQ) {
        var rowText = columns.map(function(c){ return String(row[c.key]||''); }).join(' ').toLowerCase();
        if (!rowText.includes(globalQ)) return false;
      }
      // Column filters
      for (var k in colFilters) {
        if (!colFilters[k]) continue;
        // Boolean-valued cells: compare against the literal 'true'/'false' string
        // the filter sends, instead of String(false||'') which silently becomes ''
        // and can never match the filter value 'false'.
        var cellVal = row[k];
        var cellStr = (cellVal === true || cellVal === false) ? String(cellVal) : String(cellVal||'');
        if (!cellStr.toLowerCase().includes(colFilters[k])) return false;
      }
      return true;
    });
    if (sortKey) {
      filteredData.sort(function(a,b){
        var av = String(a[sortKey]||''), bv = String(b[sortKey]||'');
        var n = parseFloat(av), m = parseFloat(bv);
        var cmp = (!isNaN(n) && !isNaN(m)) ? n - m : av.localeCompare(bv);
        return sortDir === 'asc' ? cmp : -cmp;
      });
    }
  }

  function _render() {
    _applyFilters();
    // Fire onFilter callback with current filtered data
    if (typeof opts.onFilter === 'function') {
      try { opts.onFilter(filteredData); } catch(e) {}
    }
    var tbody  = document.getElementById('dt-tbody-'+opts.containerId);
    var info   = document.getElementById('dt-info-'+opts.containerId);
    var pagesEl= document.getElementById('dt-pages-'+opts.containerId);
    var total  = filteredData.length;
    var pages  = Math.max(1, Math.ceil(total / limit));
    if (page > pages) page = pages;
    var start  = (page-1)*limit, end = Math.min(start+limit, total);
    var pageSlice = filteredData.slice(start, end);

    // Empty / loading
    if (!pageSlice.length) {
      tbody.innerHTML = '<tr><td colspan="'+columns.length+'" class="dt-empty">'+emptyMsg+'</td></tr>';
    } else {
      var _rowClick = opts.rowClick || null;
      var _rowStyle = opts.rowStyle || '';
      // Cache the full row objects for this page so click handlers get the ENTIRE
      // row (not just a hand-picked subset) — different tables need different fields
      // (e.g. _connId/_week for connection rows, ClientName for client-summary rows).
      window._dtRowsCache = window._dtRowsCache || {};
      window._dtRowsCache[opts.containerId] = pageSlice;
      tbody.innerHTML = pageSlice.map(function(row, rIdx) {
        var trStyle = _rowStyle ? ' style="'+_rowStyle+'"' : '';
        var trClick = '';
        if (_rowClick) {
          window._dtClickFns = window._dtClickFns || {};
          window._dtClickFns[opts.containerId] = _rowClick;
          trClick = ' onclick="if(window._dtClickFns[\''+opts.containerId+'\'])window._dtClickFns[\''+opts.containerId+'\'](window._dtRowsCache[\''+opts.containerId+'\']['+rIdx+'])"';
        }
        return '<tr'+trStyle+trClick+'>' + columns.map(function(col) {
          var val = row[col.key];
          var cell = col.render ? col.render(val, row) : (val === null || val === undefined ? '\u2014' : String(val));
          return '<td>'+cell+'</td>';
        }).join('') + '</tr>';
      }).join('');
    }

    // Info
    info.textContent = total ? 'Showing '+(start+1)+'\u2013'+end+' of '+total : 'No results';

    // Pagination
    pagesEl.innerHTML = '';
    if (pages <= 1) return;
    var addBtn = function(label, p, disabled, active) {
      var b = document.createElement('button');
      b.className = 'btn btn-secondary btn-sm' + (active?' active':'');
      b.textContent = label; b.disabled = disabled;
      b.addEventListener('click', function(){ page = p; _render(); });
      pagesEl.appendChild(b);
    };
    addBtn('‹', page-1, page===1);
    var pageNums = [];
    for (var pi=1; pi<=pages; pi++) {
      if (pi===1||pi===pages||Math.abs(pi-page)<=1) pageNums.push(pi);
      else if (pageNums[pageNums.length-1]!=='\u2026') pageNums.push('\u2026');
    }
    pageNums.forEach(function(pi) {
      if (pi==='\u2026') { var s=document.createElement('span'); s.textContent='\u2026'; s.style.padding='0 4px'; pagesEl.appendChild(s); }
      else addBtn(pi, pi, false, pi===page);
    });
    addBtn('›', page+1, page===pages);
  }

  _render();
  return {
    refresh: function(newData) { data = newData; page=1; _render(); },
    getData: function() { return filteredData; }
  };
}

function getMondayStr(date) {
  var d = new Date(date || new Date());
  var day = d.getDay();
  d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
  var yr = d.getFullYear();
  var mo = String(d.getMonth()+1).padStart(2,'0');
  var dy = String(d.getDate()).padStart(2,'0');
  return yr + '-' + mo + '-' + dy;
}

function localDateStr(date) {
  var d = (date instanceof Date) ? date : new Date(date);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function set(id, html) {

function gsr(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var _t0 = Date.now();
  return new Promise(function(resolve) {
    var call = google.script.run
      .withSuccessHandler(function(res) {
        if (typeof VAA_LOG !== 'undefined') VAA_LOG.debug('GAS', '\u2190 ' + fn + ' OK (' + (Date.now()-_t0) + 'ms)');
        resolve(res || { success: true });
      })
      .withFailureHandler(function(err) {
        if (typeof VAA_LOG !== 'undefined') VAA_LOG.error('GAS', '\u2190 ' + fn + ' FAIL', err);
        resolve({ success: false, message: err ? err.message : 'Unknown error' });
      });
    call[fn].apply(call, args);
  });
}

// Global Period Selector — shared across Submissions, Performance,
// Reports, Lifetime Value, Customer Overview
// ═══════════════════════════════════════════════════════════════════
var _GP_PAGES = ['submissions','analytics','va-kpi-sheet','lifetime','customer-overview','admin-dashboard','mgr-dashboard','tl-dashboard'];

window._globalPeriod = {
  period:    'weekly',
  periodKey: null   // set on first use
};

// Shared "smart default week" rule: Mon/Tue/Wed default to LAST week (this
// week's data is barely started), Thu onward default to THIS week. Used by
// the global period bar and any dashboard that needs a sensible default
// without the period bar's own state (e.g. before it's initialized).
function smartDefaultWeek() {
  var now = new Date();
  var dow = now.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
  var isMonToWed = (dow >= 1 && dow <= 3);
  var ref = new Date(now);
  if (isMonToWed) ref.setDate(ref.getDate() - 7);
  return getMondayStr(ref);
}

function gpInit() {
  if (!window._globalPeriod.periodKey) {
    window._globalPeriod.periodKey = smartDefaultWeek();
  }
  gpLoadPeriods().then(function() {
    gpRenderBar();
  });
}

function gpLoadPeriods() {
  return gsr('getAvailableSubmissionPeriods', window._globalPeriod.period === 'monthly')
    .then(function(r) {
      var periods = (r && r.data) || [];
      var cur = window._globalPeriod.period === 'monthly'
        ? (function(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); })()
        : getMondayStr(new Date());
      if (!periods.length || periods[0] !== cur) periods.unshift(cur);
      window._gpPeriods = periods;
    });
}

function gpRenderBar() {
  var gp  = window._globalPeriod;
  var sel = document.getElementById('gp-period-select');
  if (!sel) return;
  var periods = window._gpPeriods || [gp.periodKey];
  // Ensure current periodKey is in list
  if (gp.periodKey && periods.indexOf(gp.periodKey) < 0) periods = [gp.periodKey].concat(periods);
  // Rebuild options
  sel.innerHTML = periods.map(function(p) {
    return '<option value="'+p+'" style="color:#111;background:#fff;">'+gpLabel(p,gp.period)+'</option>';
  }).join('');
  // Explicitly set selected value — don't rely on `selected` attr after innerHTML reset
  // After rebuilding innerHTML, explicitly set the selected index
  var targetKey = gp.periodKey || periods[0] || '';
  var foundIdx = -1;
  for (var ri = 0; ri < sel.options.length; ri++) {
    if (sel.options[ri].value === targetKey) { foundIdx = ri; break; }
  }
  sel.selectedIndex = foundIdx >= 0 ? foundIdx : 0;
  if (foundIdx >= 0) sel.value = targetKey;
  // Update toggle buttons
  var bw = document.getElementById('gp-btn-weekly');
  var bm = document.getElementById('gp-btn-monthly');
  if (bw) { bw.style.background=gp.period==='weekly'?'var(--primary)':'transparent'; bw.style.color=gp.period==='weekly'?'#fff':'#9ca3af'; }
  if (bm) { bm.style.background=gp.period==='monthly'?'var(--primary)':'transparent'; bm.style.color=gp.period==='monthly'?'#fff':'#9ca3af'; }
  // Update next button
  var nb = document.getElementById('gp-nav-next');
  if (nb) nb.disabled = gpIsAtCurrent();
}

function gpLabel(key, period) {
  if (!key) return '';
  try {
    if (period === 'monthly') {
      var d = new Date(key.slice(0,7)+'-01T00:00:00');
      return isNaN(d.getTime()) ? key : d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    }
    var safeKey = key.slice(0,10);
    var s = new Date(safeKey+'T00:00:00');
    if (isNaN(s.getTime())) return safeKey;
    if (s.getDay() !== 1) { var diff=s.getDay()===0?-6:1-s.getDay(); s.setDate(s.getDate()+diff); }
    var e = new Date(s.getTime()); e.setDate(e.getDate()+6);
    var fmt = function(dt){ return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
    return fmt(s)+' \u2013 '+fmt(e);
  } catch(ex) { return key; }
}

function gpIsAtCurrent() {
  var gp = window._globalPeriod;
  var now = new Date();
  var cur = gp.period==='monthly'
    ? now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')
    : getMondayStr(now);
  return (gp.periodKey||'') >= cur;
}

function gpSetPeriod(period) {
  window._globalPeriod.period = period;
  var now = new Date();
  window._globalPeriod.periodKey = period==='monthly'
    ? now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')
    : getMondayStr(now);
  gpLoadPeriods().then(function() { gpRenderBar(); gpNotify(); });
}

function gpNav(dir) {
  var gp  = window._globalPeriod;
  var key = gp.periodKey;
  if (!key) key = getMondayStr(new Date());

  if (gp.period === 'monthly') {
    var parts = key.split('-');
    var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1+dir, 1);
    key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  } else {
    // Parse as local midnight, step exactly 7 days
    var yr = parseInt(key.slice(0,4)), mo = parseInt(key.slice(5,7))-1, dy = parseInt(key.slice(8,10));
    var d2 = new Date(yr, mo, dy + dir*7);
    // Snap to Monday
    var wd = d2.getDay();
    if (wd !== 1) d2.setDate(d2.getDate() + (wd === 0 ? -6 : 1 - wd));
    var y2=d2.getFullYear(), m2=String(d2.getMonth()+1).padStart(2,'0'), d2s=String(d2.getDate()).padStart(2,'0');
    key = y2+'-'+m2+'-'+d2s;
  }

  // Clamp to current period
  var now = new Date();
  var cur = gp.period==='monthly'
    ? now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')
    : getMondayStr(now);
  if (key > cur) key = cur;

  // Add to periods list without duplicates, keep sorted descending
  if (!window._gpPeriods) window._gpPeriods = [];
  if (window._gpPeriods.indexOf(key) < 0) {
    window._gpPeriods.push(key);
    window._gpPeriods.sort().reverse();
  }

  gp.periodKey = key;
  gpSyncSelect();
  gpNotify();
}

function gpPickPeriod(key) {
  if (!key) return;
  window._globalPeriod.periodKey = window._globalPeriod.period==='monthly' ? key.slice(0,7) : key.slice(0,10);
  gpSyncSelect();
  gpNotify();
}

// Update dropdown value and nav buttons WITHOUT rebuilding innerHTML
function gpSyncSelect() {
  var gp  = window._globalPeriod;
  var sel = document.getElementById('gp-period-select');
  if (sel && gp.periodKey) {
    // Check if key exists as an option
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === gp.periodKey) { sel.selectedIndex = i; found = true; break; }
    }
    if (!found) {
      // Add the new option at the right sorted position and select it
      var newOpt = document.createElement('option');
      newOpt.value = gp.periodKey;
      newOpt.style.cssText = 'color:#111;background:#fff;';
      newOpt.textContent = gpLabel(gp.periodKey, gp.period);
      // Insert before the first option with a smaller key (descending order)
      var inserted = false;
      for (var j = 0; j < sel.options.length; j++) {
        if (sel.options[j].value < gp.periodKey) {
          sel.insertBefore(newOpt, sel.options[j]);
          inserted = true;
          break;
        }
      }
      if (!inserted) sel.appendChild(newOpt);
      sel.value = gp.periodKey;
    }
  }
  var nb = document.getElementById('gp-nav-next');
  if (nb) nb.disabled = gpIsAtCurrent();
}

function gpToday() {
  var now = new Date();
  window._globalPeriod.periodKey = window._globalPeriod.period==='monthly'
    ? now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')
    : getMondayStr(now);
  gpRenderBar();
  gpNotify();
}

// Notify the current page to reload with new period
function gpNotify() {
  var page = State.currentPage;
  if (!page) return;
  // Each module listens for this and reloads
  if (typeof window._gpListeners === 'object' && window._gpListeners[page]) {
    window._gpListeners[page]();
  }
}

// Show/hide the bar based on current page
function gpShowBar(page) {
  var bar = document.getElementById('global-period-bar');
  if (!bar) return;
  var show = _GP_PAGES.indexOf(page) >= 0;
  bar.style.display = show ? 'flex' : 'none';
  if (show) { gpInit(); }
}

</script>
