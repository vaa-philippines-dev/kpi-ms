<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>VAA Philippines — KPI Management Portal</title>
  <?!= include('Styles'); ?>
</head>
<body>

  <!-- Hard fallback: always show login within 2s no matter what -->
  <script>
    setTimeout(function() {
      var l = document.getElementById('app-loading');
      var a = document.getElementById('auth-screen');
      if (l && !l.classList.contains('hidden')) l.classList.add('hidden');
      if (a && a.classList.contains('hidden')) a.classList.remove('hidden');
    }, 2000);
  </script>

  <!-- Splash -->
  <div id="app-loading" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="52" height="52" rx="14" fill="#1e4d8c"/>
          <rect width="52" height="52" rx="14" fill="url(#lg-sp)"/>
          <rect x="7" y="34" width="11" height="13" rx="5.5" fill="#6baed6"/>
          <rect x="21" y="24" width="11" height="23" rx="5.5" fill="#f6b73c"/>
          <rect x="35" y="13" width="11" height="34" rx="5.5" fill="#f6b73c"/>
          <rect x="35" y="13" width="11" height="11" rx="5.5" fill="#e09820"/>
          <defs>
            <linearGradient id="lg-sp" x1="0" y1="0" x2="0" y2="52" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#2d6abf" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#0f2d5e" stop-opacity="0.6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <p style="font-size:12px;color:#7b859a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">VAA Philippines</p>
      <h2>KPI Management Portal</h2>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Auth Screen -->
  <div id="auth-screen" class="hidden">
    <?!= include('Auth'); ?>
  </div>

  <!-- Main App -->
  <div id="main-app" class="hidden">
    <div class="app-shell">

      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="logo-mark">
            <svg width="30" height="30" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="52" height="52" rx="13" fill="#1e4d8c"/>
              <rect width="52" height="52" rx="13" fill="url(#lg-sb)"/>
              <!-- Bar 1: short, steel blue -->
              <rect x="7" y="34" width="11" height="13" rx="5.5" fill="#6baed6"/>
              <!-- Bar 2: medium, amber -->
              <rect x="21" y="24" width="11" height="23" rx="5.5" fill="#f6b73c"/>
              <!-- Bar 3: tall, amber -->
              <rect x="35" y="13" width="11" height="34" rx="5.5" fill="#f6b73c"/>
              <!-- Bar 3 top cap darker -->
              <rect x="35" y="13" width="11" height="11" rx="5.5" fill="#e09820"/>
              <defs>
                <linearGradient id="lg-sb" x1="0" y1="0" x2="0" y2="52" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#2d6abf" stop-opacity="0.6"/>
                  <stop offset="100%" stop-color="#0f2d5e" stop-opacity="0.6"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="logo-text">KPI Portal</span>
          <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
        <div class="sidebar-footer" style="padding:8px 12px;min-height:0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;">
          <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch to light mode">
            <span class="ttb-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
            <span class="ttb-label">Dark Mode</span>
          </button>
          <span style="font-size:10px;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;">v1.0</span>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="top-bar">
          <div class="page-title-wrap">
            <button class="mobile-toggle" onclick="toggleSidebar()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <h1 id="page-title" class="page-title">Dashboard</h1>
          </div>
          <div id="global-period-bar" style="display:none;align-items:center;gap:6px;flex:1;justify-content:center;">
            <!-- Toggle -->
            <div id="gp-toggle" style="display:flex;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden;">
              <button id="gp-btn-weekly" onclick="gpSetPeriod('weekly')"
                style="border:none;border-radius:0;font-size:11px;font-weight:600;padding:4px 12px;cursor:pointer;background:var(--primary);color:#fff;">Weekly</button>
              <button id="gp-btn-monthly" onclick="gpSetPeriod('monthly')"
                style="border:none;border-radius:0;font-size:11px;font-weight:600;padding:4px 12px;cursor:pointer;background:transparent;color:#9ca3af;">Monthly</button>
            </div>
            <!-- Prev -->
            <button class="btn btn-secondary" style="padding:4px 8px;height:28px;" onclick="gpNav(-1)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <!-- Period dropdown -->
            <select id="gp-period-select" style="height:28px;font-size:11px;font-weight:600;width:220px;color:var(--text);background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-xs);padding:0 8px;cursor:pointer;" onchange="gpPickPeriod(this.value)">
            </select>
            <!-- Next -->
            <button class="btn btn-secondary" id="gp-nav-next" style="padding:4px 8px;height:28px;" onclick="gpNav(1)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button class="btn btn-secondary" style="font-size:11px;padding:4px 8px;height:28px;" onclick="gpToday()">Today</button>
          </div>
          <div class="top-bar-actions">
            <button class="topbar-icon-btn" id="refresh-btn" onclick="refreshCurrentPage()" title="Refresh">
              <svg id="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
            <div class="topbar-divider"></div>
            <div class="topbar-user">
              <div class="user-avatar" id="user-avatar">A</div>
              <div class="user-details">
                <span id="user-name" class="user-name">Loading...</span>
                <span id="user-role" class="user-role">...</span>
              </div>
            </div>
            <button class="btn-logout topbar-logout" onclick="logout()" title="Sign out">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </button>
          </div>
        </header>
        <div id="page-content" class="page-content"></div>
      </main>

    </div>
  </div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <?!= include('AppCore'); ?>
  <?!= include('AppDashboards'); ?>
  <?!= include('AppVAConnections'); ?>
  <?!= include('AppKPIConfig'); ?>
  <?!= include('AppUsers'); ?>
  <?!= include('AppKPI'); ?>
  <?!= include('AppSubmissions'); ?>
  <?!= include('AppSettings'); ?>
  <?!= include('AppVAKPISheet'); ?>
</body>
</html>
