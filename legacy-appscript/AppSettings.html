<script>
// ── Shared: single source of truth for intervention type dropdown options ──
// Defined at top-level script scope so it's globally available immediately,
// not nested inside any function (which would defer its existence until that
// function actually ran — causing "getIntvTypeOptions is not defined" elsewhere).
var INTERVENTION_TYPES_FALLBACK = ['Coaching','Warning','Escalation','Feedback','Performance Review','Other'];
function getIntvTypeOptions(selectedValue) {
  var types = (window._interventionTypes && window._interventionTypes.length) ? window._interventionTypes : INTERVENTION_TYPES_FALLBACK;
  return types.map(function(t){
    return '<option value="'+t+'"'+(selectedValue===t?' selected':'')+'>'+t+'</option>';
  }).join('');
}

function renderInterventions() {
  VAA_LOG && VAA_LOG.info("INTV", "renderInterventions()");
gsr('getVAConnections', State.user.id, State.user.role).then(conns => {
var connections = conns.data || [];
set('page-content', `
<div class="section-header"><span class="section-title">Interventions</span></div>
<div class="card">
<div class="form-group">
<label class="form-label">Select Connection</label>
<select class="form-control" onchange="loadConnectionInterventions(this.value)" id="intv-conn-sel">
<option value="">\u2014 Choose connection \u2014</option>
${connections.map(c=>`<option value="${c.ConnectionID}">${c.ClientName||c.ConnectionID}</option>`).join('')}
</select>
</div>
<div id="intv-list"><div class="empty-state"><h3>Select a connection to view interventions</h3></div></div>
</div>
`);
});
}

function loadConnectionInterventions(connId) {
if (!connId) return;
gsr('getInterventions', connId).then(res => {

gsr('getInterventionTypes').then(types => {
window._interventionTypes = types.data||[];
document.getElementById('intv-list').innerHTML = renderInterventionsList(res.data||[], connId, true);
});
});
}

function openAddIntervention(connId) {
gsr('getInterventionTypes').then(types => {
var typeList = types.data || [];
openModal('Log Intervention', `
<form onsubmit="submitIntervention(event,'${connId}')">
<div class="form-group"><label class="form-label">Type</label>
<select class="form-control" id="intv-type">
${typeList.map(t=>`<option>${t}</option>`).join('')}
</select></div>
<div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="intv-desc" rows="3" required placeholder="Describe the intervention..."></textarea></div>
<div class="form-group"><label class="form-label">Action Taken</label><textarea class="form-control" id="intv-action" rows="2" placeholder="What was done?"></textarea></div>
<div class="form-group"><label class="form-label">Outcome</label><input class="form-control" id="intv-outcome" placeholder="Initial outcome or pending"></div>
<div class="form-actions">
<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
<button type="submit" class="btn btn-primary">Log Intervention</button>
</div>
</form>
`);
});
}

function submitIntervention(e, connId) {
e.preventDefault();
var data = {
connectionId: connId,
type: document.getElementById('intv-type').value,
description: document.getElementById('intv-desc').value,
actionTaken: document.getElementById('intv-action').value,
outcome: document.getElementById('intv-outcome').value
};
gsr('createIntervention', data, State.user.id).then(res => {
toast(res.success?'Intervention logged.':res.message, res.success?'success':'error');
if (res.success) { closeModal(); openConnectionDetail(connId); }
});
}

function renderAnalytics(selectedWeek) {
  VAA_LOG && VAA_LOG.info('ANALYTICS', 'renderAnalytics(week='+(selectedWeek||'current')+')');
  set('page-content','<div style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>');
  Promise.all([gsr('getAvailableWeeks'),gsr('getVAConnectionUsers')]).then(function(pre) {
    var weeks=(pre[0]&&pre[0].data)||[];
    var uMap={}; ((pre[1]||{}).data||[]).forEach(function(u){ uMap[u.UserID]=u.Name; });
    window._perfUserMap=uMap;
    if (!weeks.length||weeks[0]!==getMondayStr(new Date())) weeks.unshift(getMondayStr(new Date()));
    // Always use global period key as source of truth
    var _gp2 = window._globalPeriod || {};
    if (_gp2.periodKey) window._analyticsWeek = _gp2.periodKey;
    var week = window._analyticsWeek || selectedWeek || weeks[0] || getMondayStr(new Date());
    // Use global period key directly — getMondayStr in GAS backend handles snapping
    // Do NOT call getMondayStr here (browser vs GAS timezone differences cause off-by-one)
    window._analyticsWeek = week;
    window._analyticsUMap = uMap;
    var _fmtPW=function(iso){ var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
    var _pwLabel=function(mon){ var d=new Date(mon+'T00:00:00'); d.setDate(d.getDate()+6); var yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'); return _fmtPW(mon)+' \u2013 '+_fmtPW(yr+'-'+mo+'-'+dy); };
    window._perfWeekLabel=_pwLabel;
    window._perfPeriodLabel = function(dateStr) {
      var period = window._perfPeriod || 'weekly';
      if (period === 'monthly') {
        var d = new Date(dateStr.slice(0,7) + '-01T00:00:00');
        return d.toLocaleDateString('en-US', { month:'long', year:'numeric' });
      }
    };
    var perfPeriod = window._perfPeriod || 'weekly';
    var isAdminPerf = State.user.role === 'Administrator';
    var _gridCols = '1fr 260px';
    set('page-content',
      '<div class="section-header" style="margin-bottom:16px;">'
      +'<span class="section-title">Performance Analytics</span>'
      +'<div style="display:flex;gap:8px;margin-left:auto;">'
      +'<button class="btn btn-secondary btn-sm" onclick="openKPIPerformanceModal()">View KPI Performance</button>'
      +'<button class="btn btn-secondary btn-sm" onclick="openWeeklyInterventionsModal()">View Interventions for This Week</button>'
      +'</div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:'+_gridCols+';gap:16px;align-items:start;">'
      +'<div id="analytics-panel"></div>'
      +'<div id="perf-side-panel"></div>'
      +'</div>'
    );
    // Auto-detect dept scope for Manager; team scope for TL
    var role = State.user.role;
    if (role === 'Manager') {
      gsr('getManagerDeptId', State.user.id).then(function(dr){
        var autoD = (dr&&dr.data) || State.user.department || '';
        window._perfDeptFilter = window._perfDeptFilter || autoD;
        _renderPerformanceTab(week, uMap, window._perfDeptFilter, window._perfServiceFilter||'');
      });
    } else if (role === 'Team Leader') {
      gsr('getTLTeamId', State.user.id).then(function(tr){
        // getTLTeamId returns a raw string (not {success,data}) — use it directly
        window._perfTeamId = (typeof tr === 'string') ? tr : ((tr&&tr.data) || '');
        console.log('[PERF] TL teamId resolved:', window._perfTeamId);
        _renderPerformanceTab(week, uMap, '', '', window._perfTeamId);
      });
    } else {
      _renderPerformanceTab(week, uMap, window._perfDeptFilter||'', window._perfServiceFilter||'');
    }
  }).catch(function(err) {
    console.error('[renderAnalytics init] FAILED:', err && err.message ? err.message : err, err && err.stack);
    var p2 = document.getElementById('page-content');
    if (p2) p2.innerHTML = '<div class="empty-state"><h3>Failed to load Performance Analytics</h3>'
      + '<p style="color:var(--text-muted);font-size:12px;">'+(err && err.message ? err.message : 'Unknown error.')+'</p></div>';
  });
}


// ── Performance side panel: dept or team summary ──────────────────────────
// ── Performance Analytics diagnostic functions ────────────────────────────
function _perfTest() {
  toast('Running performance test\u2026', 'info');
  var week = window._analyticsWeek || getMondayStr(new Date());
  var period = window._perfPeriod || 'weekly';
  gsr('testPerfData', week, period).then(function(res) {
    if (!res) { openModal('Test Failed', '<pre>null response</pre>'); return; }
    var lines = [
      'Week tested:       ' + week,
      'Period:            ' + period,
      'SHEET_NAMES.KPI_WEEKLY_SUMMARY: ' + res.sheetName,
      'Sheet exists:      ' + res.sheetExists,
      'Sheet lastRow:     ' + res.sheetLastRow,
      'Headers found:     ' + JSON.stringify(res.headers),
      'cidIdx:            ' + res.cidIdx,
      'wsdIdx:            ' + res.wsdIdx,
      'Rows scanned:      ' + res.numRows,
      'Rows matching week:' + res.matched,
      'Sample matches:    ' + JSON.stringify(res.sampleMatches),
      'Active conns:      ' + res.activeConns,
      'Perf map size:     ' + res.perfMapSize,
      '',
      'Sample summary rows (raw):',
    ].concat((res.sampleRaw||[]).map(function(r) {
      return '  cid='+r.cid+' wsd='+r.wsd+' type='+r.wsdType+' onT='+r.onT+' atR='+r.atR+' crit='+r.crit;
    }));
    var verdict = res.matched > 0
      ? '\n\n\u2705 ' + res.matched + ' rows match week ' + week
      : '\n\n\u26A0 0 rows match week ' + week + (res.sheetLastRow < 2 ? '\n  Sheet is EMPTY' : '\n  Check date format in sheet');
    openModal('Performance Data Test',
      '<pre style="font-family:monospace;font-size:10px;line-height:1.7;background:var(--bg-secondary);padding:14px;border-radius:8px;overflow:auto;max-height:75vh;white-space:pre;">'
      + lines.join('\n') + verdict + '</pre>');
  });
}

function _perfInspect() {
  toast('Inspecting\u2026', 'info');
  gsr('inspectPerfSheet').then(function(res) {
    if (!res || !res.success) { openModal('Inspect Failed', '<pre>'+JSON.stringify(res,null,2)+'</pre>'); return; }
    var lines = [
      'Sheet: ' + res.sheetName,
      'Last row: ' + res.lastRow,
      'Headers: ' + JSON.stringify(res.headers),
      '',
      'First 5 rows (cid | wsd_raw | wsd_type | wsd_parsed | onT | atR | crit):'
    ].concat((res.rows||[]).map(function(r) {
      return '  '+r.cid+' | '+r.wsdRaw+' | '+r.wsdType+' | '+r.wsdParsed+' | '+r.onT+' / '+r.atR+' / '+r.crit;
    })).concat([
      '',
      'Weeks in sheet (most recent):',
    ]).concat((res.weeks||[]).map(function(w) {
      return '  ' + w.key + ' \u2192 ' + w.count + ' rows';
    }));
    openModal('Performance Sheet Inspector',
      '<pre style="font-family:monospace;font-size:10px;line-height:1.7;background:var(--bg-secondary);padding:14px;border-radius:8px;overflow:auto;max-height:75vh;white-space:pre;">'
      + lines.join('\n') + '</pre>');
  });
}

function _buildPerfSidePanel(rows, deptFilter, depts) {
  var side = document.getElementById('perf-side-panel');
  if (!side) return;
  if (!rows || !rows.length) { side.innerHTML=''; return; }
  window._perfDeptsList = depts;
  window._perfSideRows = rows;
  window._perfSideActiveDept = deptFilter;
  var isAdmin  = State.user.role==='Administrator';
  // activeDept: prefer explicit parameter, then stored state
  var activeDept = deptFilter || window._perfDeptFilter || window._perfDeptIdFilter || '';
  // showDept = show dept-level summary (no filter active)
  // If activeDept is set (either ID or name), show team summary
  // Managers and Team Leaders are always scoped to a single dept/team already
  // (isAdmin is false for them), so this always falls through to Team Summary.
  var showDept = isAdmin && !activeDept;

  // ── Submission status lookup (from the current-period breakdown used by the
  //    Submission Trend scorecards) — connections not tracked there (e.g. newly
  //    joined this period / Not Applicable) are excluded from the % denominator ──
  var subStatus = window._perfSubStatus;
  var trackedSet = {}, submittedSet = {};
  if (subStatus) {
    (subStatus.submittedList||[]).forEach(function(c){ var id=String(c.ConnectionID).trim(); trackedSet[id]=true; submittedSet[id]=true; });
    (subStatus.pendingList||[]).forEach(function(c){ var id=String(c.ConnectionID).trim(); trackedSet[id]=true; });
  }
  function _subState(r) {
    var cid = String(r._connId||'').trim();
    var parts = cid.split('_'); var suffix = parts[parts.length-1];
    if (trackedSet[cid])    return submittedSet[cid];
    if (trackedSet[suffix]) return submittedSet[suffix];
    return null; // not tracked this period (Not Applicable / unknown) — excluded
  }
  function _rateColor(pct) { return pct>=80 ? '#10d48e' : (pct>=60 ? '#f5a623' : '#ff4d6a'); }
  var tdRate = function(pct){ return 'style="text-align:center;padding:4px 4px;font-size:11px;font-weight:700;color:'+_rateColor(pct)+';"'; };
  var thRate = 'style="font-size:10px;padding:4px 4px;text-align:center;"';

  if (showDept) {
    console.log('[SIDE] rendering Department Summary');
    var dMap = {};
    rows.forEach(function(r){
      var d=r.Department||'\u2014'; if(!dMap[d]) dMap[d]={submitted:0,total:0};
      var s = _subState(r);
      if (s===null) return;
      dMap[d].total++; if (s) dMap[d].submitted++;
    });
    var tbody=Object.keys(dMap).sort().map(function(n){
      var d=dMap[n];
      var pct = d.total ? Math.round((d.submitted/d.total)*100) : 0;
      return '<tr><td style="font-size:11px;padding:4px 6px;">'+n+'</td>'
        +'<td '+tdRate(pct)+'>'+pct+'%<div style="font-size:9px;font-weight:400;color:var(--text-muted);">'+d.submitted+'/'+d.total+'</div></td></tr>';
    }).join('');
    side.innerHTML='<div class="card"><div class="card-header" style="padding-bottom:4px;">'
      +'<div class="card-title">Department Summary</div></div>'
      +'<div class="card-subtitle" style="padding:0 12px 6px;">Submission rate for this period</div>'
      +'<div class="table-wrap"><table style="font-size:11px;width:100%;">'
      +'<thead><tr><th style="font-size:10px;padding:4px 6px;">Dept</th>'
      +'<th '+thRate+'>Submitted</th>'
      +'</tr></thead><tbody>'+tbody+'</tbody></table></div></div>';
    return;
  }

  // Team summary
  console.log('[SIDE] rendering Team Summary');
  var tMap = {};
  rows.forEach(function(r){
    var tid=r.TeamID||'__none__';
    if(!tMap[tid]) tMap[tid]={number:r.TeamNumber||r.Team||'\u2014',leader:r.TeamLeader||'',submitted:0,total:0};
    var s = _subState(r);
    if (s===null) return;
    tMap[tid].total++; if (s) tMap[tid].submitted++;
  });
  // Sort by team number, but Teamless always goes last regardless of number
  var tKeys=Object.keys(tMap).filter(function(k){ return k!=='__none__'; }).sort(function(a,b){
    return (parseInt(String(tMap[a].number).replace(/\D/g,''))||0)
          -(parseInt(String(tMap[b].number).replace(/\D/g,''))||0);
  });
  if (tMap['__none__']) tKeys.push('__none__');
  var tbody2=tKeys.map(function(tid){
    var t=tMap[tid];
    var _teamNum = String(t.number||'').trim();
    var teamNumStr = (tid!=='__none__' && _teamNum && _teamNum !== '0' && _teamNum !== '—' && _teamNum !== '\u2014')
      ? 'Team '+_teamNum.padStart(2,'0')
      : 'Teamless';
    var lbl='<div style="font-size:11px;font-weight:700;">'+teamNumStr+'</div>'
      +(t.leader?'<div style="font-size:10px;color:var(--text-muted);">'+t.leader+'</div>':'');
    var pct = t.total ? Math.round((t.submitted/t.total)*100) : 0;
    return '<tr><td style="padding:4px 6px;">'+lbl+'</td>'
      +'<td '+tdRate(pct)+'>'+pct+'%<div style="font-size:9px;font-weight:400;color:var(--text-muted);">'+t.submitted+'/'+t.total+'</div></td></tr>';
  }).join('');
  side.innerHTML='<div class="card"><div class="card-header" style="padding-bottom:4px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div class="card-title">Team Summary</div>'
    +'<button class="btn btn-secondary btn-sm" style="font-size:10px;padding:3px 8px;" onclick="openTeamSubmissionReport()">Team Report</button>'
    +'</div>'
    +'<div class="card-subtitle" style="padding:0 12px 6px;">Submission rate for this period</div>'
    +'<div class="table-wrap"><table style="font-size:11px;width:100%;">'
    +'<thead><tr><th style="font-size:10px;padding:4px 6px;">Team</th>'
    +'<th '+thRate+'>Submitted</th>'
    +'</tr></thead><tbody>'+tbody2+'</tbody></table></div></div>';
}

function _renderPerformanceTab(week, uMap, deptId, serviceId, teamId) {
  VAA_LOG && VAA_LOG.debug('ANALYTICS', '_renderPerformanceTab(week='+week+' dept='+deptId+' svc='+serviceId+')');
  var panel = document.getElementById('analytics-panel');
  if (!panel) return;
  panel.innerHTML = '<div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>';

  var _uMap  = uMap || window._analyticsUMap || {};
  var _dept = deptId    || window._perfDeptFilter    || '';
  var _svc  = serviceId || window._perfServiceFilter || '';
  var _team = teamId    || window._perfTeamId        || '';
  // Managers always see only their dept; TLs only their team
  if (!_dept && State.user.role === 'Manager') _dept = State.user.department || '';

  var _period = window._perfPeriod || 'weekly';
  Promise.all([
    gsr('getPerformanceData', State.user.id, State.user.role, _dept, _team, _svc, week, _period),
    gsr('getConnectionsWithInterventions', State.user.id, State.user.role)
  ]).then(function(allRes) {
    var combined = allRes[0] || {};
    var intvIds  = (allRes[1] && allRes[1].data) || [];
    var intvSet  = {};
    intvIds.forEach(function(cid){ intvSet[cid] = true; });
    window._connInterventionSet = intvSet;
    console.log('[PERF] combined keys:', Object.keys(combined||{}));
    console.log('[PERF] perf keys:', Object.keys(combined.perf||{}));
    console.log('[PERF] counts: critical='+(combined.perf&&combined.perf.critical||[]).length+' atRisk='+(combined.perf&&combined.perf.atRisk||[]).length+' onTarget='+(combined.perf&&combined.perf.onTarget||[]).length+' noData='+(combined.perf&&combined.perf.noData||[]).length);
    console.log('[PERF] trend length:', (combined.trend||[]).length);
    console.log('[PERF] connTrendMap keys:', Object.keys(combined.connTrendMap||{}).length);
    var depts = combined.depts || [];
    var p     = combined.perf  || {};
    var trend = combined.trend || [];
    // Tag status at construction — indexOf on JSON-deserialized objects is always -1
    var all = []
      .concat((p.critical||[]).map(function(c){ return Object.assign({_status:'Critical'},  c); }))
      .concat((p.atRisk  ||[]).map(function(c){ return Object.assign({_status:'At Risk'},   c); }))
      .concat((p.onTarget||[]).map(function(c){ return Object.assign({_status:'On Target'}, c); }))
      .concat((p.noData  ||[]).map(function(c){ return Object.assign({_status:'No Data'},   c); }));

    // ── Build dept/service filter bar ──

    // ── dtData ──
    var _teamMap = window._perfTeamMap || {};  // {VAUserID+'_'+DeptID: team} or {VAUserID: team}
    var dtData = all.map(function(conn) {
      var vaId   = String(conn.VAUserID||'');
      var deptId2= String(conn.DeptID||conn.DeptName||'');
      // Lookup by VAUserID+DeptID (dept-aware, for VAs in multiple teams across depts)
      var tInfo = _teamMap[vaId+'_'+deptId2]
                || _teamMap[vaId]
                || (conn.TeamID ? _teamMap['TID_'+String(conn.TeamID)] : null)
                || {};
      return {
        ClientName:    conn.ClientName || '\u2014',
        SecondaryName: conn.SecondaryName || '',
        Department:    conn.DeptName || conn.DeptID || '\u2014',
        _deptId:       deptId2 || conn.DeptID || '',
        Service:       conn.ServiceName || conn.ServiceID || '\u2014',
        VAName:        _uMap[vaId] || '\u2014',
        Team:          tInfo.name   || '\u2014',
        TeamNumber:    tInfo.number || '',
        TeamLeader:    tInfo.leader || '',
        TeamID:        tInfo.teamId || String(conn.TeamID||''),
        Status:        conn._status || 'No Data',
        StartDate:     conn.StartDate ? String(conn.StartDate).slice(0,10) : '',
        DaysActive:    conn.StartDate ? Math.max(0, Math.floor((new Date() - new Date(String(conn.StartDate).slice(0,10)+'T00:00:00')) / 86400000) - (conn.PausedDays||0)) : 0,
        // Defensive: ConnectionType should be 'Regular' or 'Project-based' (text),
        // but the sheet cell may resolve to a JS boolean OR the literal string
        // "TRUE"/"FALSE" (checkbox-formatted column, or pasted-as-values).
        // Coerce all of these back to the correct label so "true"/"false" never
        // leaks into the UI or the filter dropdown.
        ConnectionType: (function(){
          var ct = conn.ConnectionType;
          if (ct === true)  return 'Project-based';
          if (ct === false) return 'Regular';
          var s = (ct !== undefined && ct !== null) ? String(ct).trim() : '';
          var sLower = s.toLowerCase();
          if (sLower === 'true')  return 'Project-based';
          if (sLower === 'false') return 'Regular';
          return s || 'Regular';
        })(),
        Flag:          (conn.IsFlagged===true||conn.IsFlagged==='TRUE') ? '\u2691' : '',
        HasIntervention: !!(intvSet[String(conn.ConnectionID||'')] || intvSet[String(conn.ConnectionID||'').split('_').pop()]),
        _connId:       conn.ConnectionID || '',
        _week:         week
      };
    });

    // ── Stat cards ──
    
// ── Scorecard click: show filtered connection list in a modal ──────────────
// ── Weekly Interventions Report Modal ───────────────────────────────────────

// ── KPI Performance Breakdown Modal ─────────────────────────────────────────
function openKPIPerformanceModal() {
  var box = document.getElementById('modal-box');
  if (box) box.className = 'modal-box modal-xl';
  var period = window._perfPeriod || 'weekly';
  var week   = window._analyticsWeek || getMondayStr(new Date());
  var periodLabel = period === 'monthly'
    ? (function(){ var d=new Date(week+'-01T00:00:00'); return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); })()
    : (function(){
        var d=new Date(week+'T00:00:00'); var end=new Date(d); end.setDate(end.getDate()+6);
        var f=function(dt){ return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
        return f(d)+' \u2013 '+f(end)+', '+d.getFullYear();
      })();

  openModal('KPI Performance Breakdown',
    '<div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div style="font-size:12px;color:var(--text-muted);">Showing data for <strong style="color:var(--text);">'+periodLabel+'</strong></div>'
    +'<select id="kpb-sort" class="form-control" style="width:auto;height:30px;font-size:12px;" onchange="_kpbRender()">'
    +'<option value="critical">Most Critical First</option>'
    +'<option value="atRisk">Most At Risk First</option>'
    +'<option value="total">Most Submissions First</option>'
    +'<option value="name">KPI Name (A\u2013Z)</option>'
    +'</select>'
    +'</div>'
    +'<div id="kpb-body"><div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div></div>'
  );

  console.log('[KPB] calling getKPIPerformanceBreakdown: week='+week+' period='+period+' role='+State.user.role);
  gsr('getKPIPerformanceBreakdown', State.user.id, State.user.role, week, period)
    .then(function(res) {
      console.log('[KPB] response: success='+(res&&res.success)+' kpis='+(res&&res.data&&res.data.length));
      var body = document.getElementById('kpb-body');
      if (!body) return;

function _kpbRender() {
  var body = document.getElementById('kpb-body');
  if (!body) return;
  var groups = (window._kpbGrouped || []).map(function(g){ return { deptName: g.deptName, kpis: g.kpis.slice() }; });
  if (!groups.length) {
    body.innerHTML = '<div class="table-empty">No KPI submissions found for this period.</div>';
    return;
  }

  var sortKey = (document.getElementById('kpb-sort')||{value:'critical'}).value;
  function sortKpis(list) {
    if (sortKey === 'name') list.sort(function(a,b){ return a.name.localeCompare(b.name); });
    else if (sortKey === 'total') list.sort(function(a,b){ return b.total - a.total; });
    else list.sort(function(a,b){ return b[sortKey] - a[sortKey] || b.critical - a.critical; });
  }
  groups.forEach(function(g){ sortKpis(g.kpis); });

  function _kpbColor(status) {
    return status==='Critical' ? 'var(--critical)' : status==='At Risk' ? 'var(--at-risk)'
      : status==='On Target' ? 'var(--on-target)' : 'var(--text-muted)';
  }
  function miniBar(o) {
    var pct = function(n){ return o.total ? Math.round((n/o.total)*100) : 0; };
    var segs = [
      { n:o.critical, c:'var(--critical)'  },
      { n:o.atRisk,   c:'var(--at-risk)'   },
      { n:o.onTarget, c:'var(--on-target)' },
      { n:o.noData,   c:'var(--text-muted)'}
    ];
    return segs.map(function(s){ var w=pct(s.n); if(!w) return ''; return '<div style="width:'+w+'%;background:'+s.c+';height:100%;"></div>'; }).join('');
  }
  // Ranks worse→better so we can tell if the current period is worse or better than the 6-period trend
  var _sevRank = { 'Critical':3, 'At Risk':2, 'No Data':1, 'On Target':0 };
  var periodNoun = (window._perfPeriod === 'monthly') ? 'Months' : 'Weeks';

  var sections = groups.map(function(g){
    var rows = g.kpis.map(function(k){
      var cur = k.current   || { onTarget:0, atRisk:0, critical:0, noData:0, total:0, dominant:{status:'No Data',pct:0} };
      var six = k.sixPeriod || cur;
      var curDom = cur.dominant || { status:'No Data', pct:0 };
      var sixDom = six.dominant || { status:'No Data', pct:0 };

      var pattern = '<span style="color:var(--text-muted);font-size:11px;">\u2014</span>';
      if (cur.total > 0 && six.total > 0 && curDom.status !== sixDom.status) {
        var curRank = _sevRank[curDom.status] || 0, sixRank = _sevRank[sixDom.status] || 0;
        pattern = curRank > sixRank
          ? '<span title="Worse this period than its 6-period trend" style="color:var(--critical);font-size:11px;font-weight:700;">\u25B2 Declining</span>'
          : '<span title="Better this period than its 6-period trend" style="color:var(--on-target);font-size:11px;font-weight:700;">\u25BC Improved</span>';
      } else if (cur.total > 0 && six.total > 0 && (curDom.status==='Critical'||curDom.status==='At Risk') && curDom.status===sixDom.status) {
        pattern = '<span title="Consistently weak — this is a chronic pattern, not a one-off" style="color:var(--at-risk);font-size:11px;font-weight:700;">\u26A0 Chronic</span>';
      }

      return '<tr>'
        + '<td style="min-width:170px;"><strong style="font-size:13px;">'+k.name+'</strong>'
        + (k.cluster ? '<div style="font-size:10px;color:var(--text-muted);">'+k.cluster+'</div>' : '')
        + '</td>'
        + '<td style="min-width:150px;">'
        + '<div style="font-weight:700;font-size:12px;color:'+_kpbColor(curDom.status)+';">'+curDom.pct+'% '+curDom.status+'</div>'
        + '<div style="display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg-secondary);margin-top:3px;" title="Critical '+cur.critical+' \u00b7 At Risk '+cur.atRisk+' \u00b7 On Target '+cur.onTarget+' \u00b7 No Data '+cur.noData+'">'+miniBar(cur)+'</div>'
        + '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">'+cur.total+' submission'+(cur.total!==1?'s':'')+'</div>'
        + '</td>'
        + '<td style="min-width:150px;">'
        + '<div style="font-weight:700;font-size:12px;color:'+_kpbColor(sixDom.status)+';">'+sixDom.pct+'% '+sixDom.status+'</div>'
        + '<div style="display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg-secondary);margin-top:3px;" title="Critical '+six.critical+' \u00b7 At Risk '+six.atRisk+' \u00b7 On Target '+six.onTarget+' \u00b7 No Data '+six.noData+'">'+miniBar(six)+'</div>'
        + '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">'+six.total+' submission'+(six.total!==1?'s':'')+'</div>'
        + '</td>'
        + '<td style="text-align:center;">'+pattern+'</td>'
        + '</tr>';
    }).join('');
    return '<div style="margin-bottom:18px;">'
      + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:6px 2px;border-bottom:1px solid var(--border);margin-bottom:4px;">'
      + g.deptName+' <span style="font-weight:400;text-transform:none;letter-spacing:0;">\u00b7 '+g.kpis.length+' KPI'+(g.kpis.length!==1?'s':'')+'</span></div>'
      + '<div class="table-wrap"><table class="data-table">'
      + '<thead><tr><th>KPI</th><th>This Period</th><th>Past 6 '+periodNoun+'</th><th>Pattern</th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table></div>'
      + '</div>';
  }).join('');

  var totalKpis = groups.reduce(function(s,g){ return s+g.kpis.length; }, 0);
  body.innerHTML = '<div style="max-height:60vh;overflow-y:auto;padding-right:4px;">'+sections+'</div>'
    + '<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">'+totalKpis+' KPI'+(totalKpis!==1?'s':'')+' across '+groups.length+' department'+(groups.length!==1?'s':'')
    + ', sorted by '+(sortKey==='name'?'name':sortKey==='total'?'submission count':sortKey)+' within each department.</div>';
}
window._kpbRender = _kpbRender;

    function _buildPerfCards(rows) {

      // ── Scorecards (now live in their own Performance Trend panel, with % of total) ──
      var pct = function(n){ return total ? Math.round((n/total)*100) : 0; };
      var el = document.getElementById('perf-trend-cards');
      if (el) el.innerHTML =
          '<div class="stat-card total" style="cursor:pointer;" onclick="_perfCardClick(\'all\')">'

        + '<div class="stat-label">At Risk</div><div class="stat-value">'+pct(atR)+'%</div>'

        + '<div class="stat-label">Critical</div><div class="stat-value">'+pct(crit)+'%</div>'
        + '<div class="stat-sub">'+crit+' of '+total+'</div>'

      // ── Trend: re-aggregate from visible rows ──

      var visIds = {};

        visIds[parts[parts.length-1]] = true;
      });
      var weekMap = {};
      Object.keys(rawTrend).forEach(function(cid) {

      var _activeDeptForSub = window._perfDeptFilter || window._perfDeptIdFilter || '';

// ── Performance Summary — Per Client tab: aggregates all of a client's connections ──
function _buildClientSummaryTable(dtData) {
  var wrap = document.getElementById('perf-dt-client-wrap');
  if (!wrap) return;
  var rank = { 'Critical':4, 'At Risk':3, 'On Target':2, 'No Data':1 };
  var cMap = {};
  (dtData||[]).forEach(function(r){
    var key = r.ClientName || '\u2014';
    if (!cMap[key]) cMap[key] = {
      ClientName: key, connCount:0, onT:0, atR:0, crit:0, noData:0,
      depts:{}, vas:{}, overallStatus:'On Target', overallRank:0,
      minStart:'', maxDays:0
    };
    var c = cMap[key];
    c.connCount++;
    if      (r.Status==='Critical')  c.crit++;
    else if (r.Status==='At Risk')   c.atR++;
    else if (r.Status==='On Target') c.onT++;
    else                             c.noData++;
    if (r.Department) c.depts[r.Department] = true;
    if (r.VAName)      c.vas[r.VAName] = true;
    var rk = rank[r.Status] || 0;
    if (rk > c.overallRank) { c.overallRank = rk; c.overallStatus = r.Status; }
    if (!c.minStart || (r.StartDate && r.StartDate < c.minStart)) c.minStart = r.StartDate || c.minStart;
    if ((r.DaysActive||0) > c.maxDays) c.maxDays = r.DaysActive||0;
  });
  var clientRows = Object.keys(cMap).map(function(k){
    var c = cMap[k];
    return {
      ClientName: c.ClientName, ConnCount: c.connCount,
      Departments: Object.keys(c.depts).join(', ') || '\u2014',
      VAs: Object.keys(c.vas).join(', ') || '\u2014',
      OnTarget: c.onT, AtRisk: c.atR, Critical: c.crit, NoData: c.noData,
      OverallStatus: c.overallStatus, DaysActive: c.maxDays, StartDate: c.minStart
    };
  });

  renderDataTable({
    containerId:'perf-dt-client-wrap', defaultLimit:10, limitOptions:[10,25,50,100],
    emptyMessage:'No client data for this week.', data:clientRows,
    defaultSort:{key:'DaysActive', dir:'asc'},
    rowClick: function(row) { if (typeof _openClientDetailModal==='function') _openClientDetailModal(row.ClientName); },
    rowStyle: 'cursor:pointer;',
    columns:[
      { key:'ClientName', label:'Client', sortable:true, filterable:true,
        render:function(v){ return '<span style="font-weight:600;">'+v+'</span>'; } },
      { key:'ConnCount', label:'Connections', sortable:true, filterable:false,
        render:function(v){ return '<span style="font-size:12px;">'+v+'</span>'; } },
      { key:'Departments', label:'Dept(s)', sortable:true, filterable:'select', filterPlaceholder:'All Departments',
        filterOptions: Array.from(new Set(clientRows.reduce(function(acc,r){
          return acc.concat(String(r.Departments||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean));
        }, []))).sort().map(function(d){ return { value:d, label:d }; }) },
      { key:'VAs', label:'VA(s)', sortable:true, filterable:true },
      { key:'OverallStatus', label:'Overall Status', sortable:true, filterable:'select', filterPlaceholder:'All Statuses',
        render:function(v){ var m={'Critical':'badge-danger','At Risk':'badge-warning','On Target':'badge-success','No Data':'badge-muted'}; return '<span class="badge '+(m[v]||'badge-muted')+'">'+v+'</span>'; }},
      { key:'OnTarget', label:'OT', sortable:true, filterable:false, render:function(v){ return '<span style="color:var(--on-target);font-weight:700;">'+v+'</span>'; } },
      { key:'AtRisk', label:'AR', sortable:true, filterable:false, render:function(v){ return '<span style="color:var(--at-risk);font-weight:700;">'+v+'</span>'; } },
      { key:'Critical', label:'CR', sortable:true, filterable:false, render:function(v){ return '<span style="color:var(--critical);font-weight:700;">'+v+'</span>'; } },
      { key:'DaysActive', label:'Longest Duration', sortable:true, filterable:false,
        render:function(v,row){
          return '<span style="font-size:12px;font-weight:600;">'+(typeof _fmtDur==='function'?_fmtDur(v):(v||0)+' days')+'</span>'
            +(row.StartDate?'<div style="font-size:10px;color:var(--text-muted);">Since '+row.StartDate+'</div>':'');
        }}
    ]
  });
}

// Shows performance across ALL of the client's VAs for the past 6 weeks/months,
// plus a connections table with start date and end/paused date per VA.
function _openClientDetailModal(clientName) {
  var box = document.getElementById('modal-box');
  if (box) box.className = 'modal-box modal-960';
  var period = window._perfPeriod || 'weekly';
  var week   = window._analyticsWeek || getMondayStr(new Date());
  var periodNoun = (period === 'monthly') ? 'Months' : 'Weeks';

  openModal('Client \u2014 ' + clientName,
    '<div id="cdm-body"><div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div></div>');

  gsr('getClientDetail', State.user.id, State.user.role, clientName, period, week)
    .then(function(res) {
      var body = document.getElementById('cdm-body');
      if (!body) return;
      if (!res || !res.success) {
        body.innerHTML = '<div class="table-empty">Failed to load client detail: '+(res&&res.message||'Unknown error')+'</div>';
        return;
      }
      var conns  = res.connections || [];
      var active = res.activeConnections || [];
      var trend  = res.trend || [];

      var trendSection = '<div class="card" style="overflow:visible;margin-bottom:16px;">'
        + '<div class="card-header" style="padding-bottom:6px;"><div class="card-title">Performance \u2014 All VAs</div>'
        + '<div class="card-subtitle">Past 6 '+periodNoun+' \u00b7 '+active.length+' active connection'+(active.length!==1?'s':'')+'</div></div>'
        + '<div style="padding:2px 10px 6px;">'+(typeof renderTrendChart==='function' ? renderTrendChart(trend) : '')+'</div>'
        + '</div>';

      var rows = conns.map(function(c){
        var statusBadge = c.IsActive
          ? '<span class="badge badge-success">Active</span>'
          : '<span class="badge badge-muted">'+c.Status+'</span>';
        return '<tr>'
          + '<td><strong>'+c.VAName+'</strong></td>'
          + '<td style="font-size:12px;">'+c.Department+(c.Service&&c.Service!==c.Department?'<div style="font-size:11px;color:var(--text-muted);">'+c.Service+'</div>':'')+'</td>'
          + '<td>'+statusBadge+'</td>'
          + '<td style="font-size:12px;">'+(c.StartDate||'\u2014')+'</td>'
          + '<td style="font-size:12px;">'+(c.EndDate||(c.IsActive?'\u2014':'\u2014'))+'</td>'
          + '<td><span class="badge '+(c.ConnectionType==='Project-based'?'badge-info':'badge-muted')+'" style="font-size:10px;">'+c.ConnectionType+'</span></td>'
          + '</tr>';
      }).join('');

      var tableSection = '<div class="card">'
        + '<div class="card-header"><div class="card-title">Connections</div>'
        + '<div class="card-subtitle">Client: <strong style="color:var(--text);">'+clientName+'</strong> \u00b7 '+conns.length+' connection'+(conns.length!==1?'s':'')+' ('+active.length+' active)</div></div>'
        + '<div class="table-wrap"><table class="data-table">'
        + '<thead><tr><th>VA</th><th>Dept / Service</th><th>Status</th><th>Start Date</th><th>End / Paused</th><th>Type</th></tr></thead>'
        + '<tbody>'+(rows || '<tr><td colspan="6" class="dt-empty">No connections found for this client.</td></tr>')+'</tbody></table></div>'
        + '</div>';

      body.innerHTML = trendSection + tableSection;
    })
    .catch(function(err) {
      var body2 = document.getElementById('cdm-body');
      if (body2) body2.innerHTML = '<div class="table-empty">Failed to load: '+(err && err.message ? err.message : 'Unknown error.')+'</div>';
    });
}

// ── Submission Trend: loader ────────────────────────────────────────────────
function _loadSubTrend(week, deptId, svcId, period, connectionType) {
  var isMonthly = (period === 'monthly');
  var subWeek = week || window._analyticsWeek || getMondayStr(new Date());
  var wrap = document.getElementById('perf-sub-trend-wrap');
  if (wrap) wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">Loading\u2026</div>';

  gsr('getSubmissionTrendData', subWeek, deptId||'', svcId||'', isMonthly, connectionType||'', State.user.id, State.user.role, window._perfTeamId||'')
    .then(function(res) {
      if (res && res.success) {
        window._perfSubTrendData = res.data || [];
        window._perfSubTrendError = null;
      } else {
        // Surface the real backend error instead of silently showing "no data" —
        // an isMonthly-specific failure (e.g. missing sheet/column) was previously
        // masked here and looked identical to "nothing submitted yet".
        window._perfSubTrendData = [];
        window._perfSubTrendError = (res && res.message) || 'Unknown error loading submission trend.';
        console.error('[SubTrend] backend error:', window._perfSubTrendError);
      }
      _renderSubTrendChart();
    })
    .catch(function(err) {
      window._perfSubTrendData = [];
      window._perfSubTrendError = (err && err.message) || String(err);
      console.error('[SubTrend] call failed:', err);
      _renderSubTrendChart();
    });

  // Current-period breakdown (submitted/pending/N-A + who's missing) for the scorecards
  gsr('getSubmissionStatusList', subWeek, deptId||'', svcId||'', isMonthly, connectionType||'', State.user.id, State.user.role, window._perfTeamId||'')
    .then(function(res) {
      window._perfSubStatus = (res && res.success) ? res.data : null;
      _buildSubCards();
    })
    .catch(function(err) {
      console.error('[SubTrend] status list call failed:', err);
      window._perfSubStatus = null;
      _buildSubCards();
    });
}

// ── Submission Trend scorecards: submission rate (color-coded) + No Submissions ──
function _buildSubCards() {
  var el = document.getElementById('perf-sub-cards');
  if (!el) return;
  var s = window._perfSubStatus;
  if (!s) { el.innerHTML = ''; return; }
  var rate = s.total ? Math.round((s.submitted/s.total)*100) : 0;
  var rateClass = rate >= 80 ? 'on-target' : (rate >= 60 ? 'at-risk' : 'critical');
  el.innerHTML =
      '<div class="stat-card '+rateClass+'">'
    + '<div class="stat-label">Submission Rate</div><div class="stat-value">'+rate+'%</div>'
    + '<div class="stat-sub">'+s.submitted+' of '+s.total+' submitted</div>'
    + '<div class="stat-icon">'+statIcon('target')+'</div></div>'
    + '<div class="stat-card critical" style="cursor:pointer;" onclick="_openNoSubmissionsModal()">'
    + '<div class="stat-label">No Submissions</div><div class="stat-value">'+s.pending+'</div>'
    + '<div class="stat-sub">Click to view</div>'
    + '<div class="stat-icon">'+statIcon('warning')+'</div></div>';
  // The dept/team side panel shows submission-rate %, driven by this same data —
  // re-render it now that the numbers are in (it may have rendered earlier with stale/no data).
  if (typeof _buildPerfSidePanel === 'function' && window._perfSideRows) {
    _buildPerfSidePanel(window._perfSideRows, window._perfSideActiveDept, window._perfDeptsList||[]);
  }
}

// ── Submission Trend: renderer — visually matches Performance Trend style ──
function _renderSubTrendChart() {
  var wrap = document.getElementById('perf-sub-trend-wrap');
  if (!wrap) return;
  var data = window._perfSubTrendData || [];

  if (!data.length) {
    if (window._perfSubTrendError) {
      wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--critical);font-size:12px;">'
        + 'Failed to load submission trend: ' + window._perfSubTrendError + '</div>';
    } else {
      wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">No submission data for this period</div>';
    }
    return;
  }

  var trend = data.map(function(w) {
    var rate = w.total ? Math.round((w.submitted/w.total)*100) : 0;
    return { week: w.week||'', rate: rate, submitted: w.submitted||0, pending: w.pending||0, total: w.total||0 };
  });

  var uid = 'stc-' + Date.now();
  var W = 520, H = 200, PL = 38, PR = 20, PT = 16, PB = 32;
  var cW = W - PL - PR, cH = H - PT - PB;
  var n  = trend.length;

  // Fixed 0-100% scale (it's a percentage, unlike Performance Trend's variable max)
  var maxVal = 100;
  function cx(i) { return PL + (n > 1 ? (i / (n-1)) * cW : cW/2); }
  function cy(v) { return PT + cH - (v / maxVal) * cH; }

  // Smooth bezier path — identical technique to renderTrendChart
  function smoothPath() {
    if (n === 1) return 'M '+cx(0)+' '+cy(trend[0].rate||0);
    var pts = trend.map(function(t,i){ return {x:cx(i), y:cy(t.rate||0)}; });
    var d = 'M '+pts[0].x+' '+pts[0].y;
    for (var i=1; i<pts.length; i++) {
      var cp1x = pts[i-1].x + (pts[i].x - pts[i-1].x)*0.4;
      var cp1y = pts[i-1].y;
      var cp2x = pts[i].x   - (pts[i].x - pts[i-1].x)*0.4;
      var cp2y = pts[i].y;
      d += ' C '+cp1x+' '+cp1y+','+cp2x+' '+cp2y+','+pts[i].x+' '+pts[i].y;
    }
    return d;
  }

  var pathD = smoothPath();
  var baseline = cy(0);
  var color = '#10d48e';
  var filledArea = '<defs><linearGradient id="'+uid+'-g" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.18"/>'
    + '<stop offset="100%" stop-color="'+color+'" stop-opacity="0.01"/>'
    + '</linearGradient></defs>'
    + '<path d="'+pathD+' L '+cx(n-1)+' '+baseline+' L '+cx(0)+' '+baseline+' Z" fill="url(#'+uid+'-g)" stroke="none"/>'
    + '<path d="'+pathD+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';

  // Grid (4 horizontal lines, 0/25/50/75/100%)
  var grid = '';
  var gridCount = 4;
  for (var g=0; g<=gridCount; g++) {
    var gy = PT + (g/gridCount)*cH;
    var gv = Math.round(maxVal*(1-g/gridCount));
    grid += '<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>'
          + '<text x="'+(PL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="#9ca3af">'+gv+'%</text>';
  }

  // 80% threshold reference line — highlighted distinctly from the grid
  var thresholdY = cy(80);
  var thresholdLine = '<line x1="'+PL+'" y1="'+thresholdY+'" x2="'+(W-PR)+'" y2="'+thresholdY+'" stroke="#10d48e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>'
    + '<text x="'+(W-PR+2)+'" y="'+(thresholdY+3)+'" font-size="9" font-weight="700" fill="#10d48e" opacity="0.85">80%</text>';

  // X labels (period-aware: monthly keys are "YYYY-MM", weekly keys are "YYYY-MM-DD")
  var xLabels = trend.map(function(t,i){
    var label = _fmtTrendPeriodLabel(t.week);
    return '<text x="'+cx(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="#9ca3af">'+label+'</text>';
  }).join('');

  // Invisible hover zones with data attributes
  var hoverZones = trend.map(function(t,i){
    var zoneW = cW / Math.max(n-1,1);
    var zx = i===0 ? PL : cx(i) - zoneW/2;
    if (i===n-1) zx = cx(i) - zoneW/2;
    return '<rect x="'+zx+'" y="'+PT+'" width="'+(i===0||i===n-1?zoneW/2:zoneW)+'" height="'+cH+'"'
      + ' fill="transparent" data-idx="'+i+'"'
      + ' data-week="'+t.week+'" data-rate="'+t.rate+'" data-submitted="'+t.submitted+'" data-pending="'+t.pending+'" data-total="'+t.total+'"'
      + ' onmousemove="subTrendHover(event,\''+uid+'\')" onmouseleave="subTrendLeave(\''+uid+'\')" style="cursor:crosshair"/>';
  }).join('');

  var crosshair = '<line id="'+uid+'-vline" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+cH)+'" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" opacity="0" pointer-events="none"/>';
  var hlDot = '<circle id="'+uid+'-dot" cx="0" cy="0" r="5" fill="'+color+'" stroke="white" stroke-width="2" opacity="0" pointer-events="none"/>';

  // Always-visible per-point % labels; the latest period's dot is bigger/highlighted
  var points = trend.map(function(t,i){
    var isLast = (i === n-1);
    var px = cx(i), py = cy(t.rate||0);
    var r  = isLast ? 7 : 4;
    var dotColor = t.rate>=80 ? '#10d48e' : (t.rate>=60 ? '#f5a623' : '#ff4d6a');
    var labelY = Math.max(10, py - (isLast ? 18 : 10));
    return (isLast ? '<circle cx="'+px+'" cy="'+py+'" r="'+(r+5)+'" fill="'+dotColor+'" opacity="0.18"/>' : '')
      + '<circle cx="'+px+'" cy="'+py+'" r="'+r+'" fill="'+dotColor+'" stroke="white" stroke-width="'+(isLast?2.5:1.5)+'"/>'
      + '<text x="'+px+'" y="'+labelY+'" text-anchor="middle" font-size="'+(isLast?12:9)+'" font-weight="'+(isLast?800:600)+'" fill="'+dotColor+'">'+t.rate+'%</text>';
  }).join('');

  var svg = '<svg id="'+uid+'" viewBox="0 0 '+W+' '+H+'" width="100%" style="overflow:visible;display:block;">'
    + grid
    + thresholdLine
    + filledArea
    + xLabels
    + crosshair
    + hlDot
    + points
    + hoverZones
    + '</svg>';

  var tooltip = '<div id="'+uid+'-tip" style="display:none;position:absolute;background:white;border:1px solid #e5e7eb;border-radius:10px;padding:6px 10px;font-size:10px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;min-width:130px;z-index:9999;">'
    + '<div id="'+uid+'-tw" style="font-weight:700;color:#111;margin-bottom:8px;"></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="width:3px;height:16px;background:'+color+';border-radius:2px;display:inline-block;"></span>'
    + '<span style="color:#374151;">Rate</span><span id="'+uid+'-rate" style="font-weight:700;margin-left:auto;color:'+color+';"></span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid #f3f4f6;">'
    + '<span style="color:#6b7280;font-size:10px;">Submitted</span>'
    + '<span id="'+uid+'-sub" style="font-weight:700;margin-left:auto;font-size:10px;color:#374151;"></span>'
    + '</div>'
    + '<div style="display:flex;align-items:center;gap:8px;">'
    + '<span style="color:#6b7280;font-size:10px;">Pending</span>'
    + '<span id="'+uid+'-pend" style="font-weight:700;margin-left:auto;font-size:10px;color:#374151;"></span>'
    + '</div></div>';

  wrap.innerHTML = '<div style="position:relative;">'+svg+tooltip+'</div>';
}

function subTrendHover(evt, uid) {
  var svgEl = document.getElementById(uid);
  var tip   = document.getElementById(uid+'-tip');
  if (!svgEl || !tip) return;
  var d = evt.currentTarget;
  var idx  = parseInt(d.getAttribute('data-idx'));
  var week = d.getAttribute('data-week');
  var rate = d.getAttribute('data-rate');
  var sub  = d.getAttribute('data-submitted');
  var pend = d.getAttribute('data-pending');

  var wLabel = _fmtTrendTooltipLabel(week);

  document.getElementById(uid+'-tw').textContent  = wLabel;
  document.getElementById(uid+'-rate').textContent = rate+'%';
  document.getElementById(uid+'-sub').textContent  = sub;
  document.getElementById(uid+'-pend').textContent = pend;

  var svgRect = svgEl.getBoundingClientRect();
  var mouseX = evt.clientX - svgRect.left;
  var mouseY = evt.clientY - svgRect.top;
  var tipW = 150, svgW2 = svgRect.width || 520;
  tip.style.display = 'block';
  if (mouseX + tipW + 20 > svgW2) {
    tip.style.left = 'auto'; tip.style.right = (svgW2 - mouseX + 8) + 'px';
  } else {
    tip.style.left = (mouseX + 14) + 'px'; tip.style.right = 'auto';
  }
  tip.style.top = Math.max(0, mouseY - 24) + 'px';

  var vb = (svgEl.getAttribute('viewBox')||'').split(' ');
  var VW = parseFloat(vb[2]||520), VH = parseFloat(vb[3]||200);
  var PL2=38, PR2=20, PT2=16, PB2=32;
  var cW2 = VW-PL2-PR2, cH2 = VH-PT2-PB2;
  var zones = svgEl.querySelectorAll('rect[data-idx]');
  var n2 = zones.length;
  var xCoord = PL2 + (n2>1 ? idx/(n2-1)*cW2 : cW2/2);
  var yCoord = PT2 + cH2 - (parseFloat(rate)/100)*cH2;

  var vline = document.getElementById(uid+'-vline');
  if (vline) { vline.setAttribute('x1',xCoord); vline.setAttribute('x2',xCoord); vline.setAttribute('opacity','1'); }
  var dot = document.getElementById(uid+'-dot');
  if (dot) { dot.setAttribute('cx',xCoord); dot.setAttribute('cy',yCoord); dot.setAttribute('opacity','1'); }
}

function subTrendLeave(uid) {
  var tip   = document.getElementById(uid+'-tip');
  var vline = document.getElementById(uid+'-vline');
  var dot   = document.getElementById(uid+'-dot');
  if (tip)   tip.style.display = 'none';
  if (vline) vline.setAttribute('opacity','0');
  if (dot)   dot.setAttribute('opacity','0');
}

// ── Period label helper ──
function _rptPeriodLabel(dateStr) {

}

function _rptChangePeriod(period) {
  window._rptPeriod = period;

function _buildReportsPage(week, weeks, uMap) {

    ? (week.slice(0,7) >= now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'))
    : (week >= todayMon);

  var _rptDepts   = window._rptDepts   || [];
  var _rptAllSvcs = window._rptAllSvcs || [];

  var _curSvc     = window._rptSvcFilter   || '';
  var deptOpts = '<option value="">All Departments</option>'
    +_rptDepts.map(function(d){return '<option value="'+d.DeptID+'"'+(_curDept===d.DeptID?' selected':'')+'>'+d.DeptName+'</option>';}).join('');
  var filteredSvcs = _curDept ? _rptAllSvcs.filter(function(s){return s.DeptID===_curDept;}) : _rptAllSvcs;

    +filteredSvcs.map(function(s){return '<option value="'+s.ServiceID+'"'+(_curSvc===s.ServiceID?' selected':'')+'>'+s.ServiceName+'</option>';}).join('');

  window._rptNavDate = function(dir) {
    var period2 = window._rptPeriod || 'weekly';
    var cur     = window._reportsWeek || getMondayStr(new Date());

    if (period2 === 'monthly') { d.setDate(1); d.setMonth(d.getMonth()+dir); }
    else d.setDate(d.getDate()+dir*7);
    var yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');
    var nw=yr+'-'+mo+'-'+dy;
    var now2=new Date(), todayMon2=getMondayStr(now2);
    if (period2==='monthly') {
      var curYM=now2.getFullYear()+'-'+String(now2.getMonth()+1).padStart(2,'0');
      if (nw.slice(0,7)>curYM) nw=curYM+'-01';
    } else { if(nw>todayMon2) nw=todayMon2; }
    window._reportsWeek=nw;
    var lbl=document.getElementById('rpt-week-label'); if(lbl) lbl.textContent=_rptPeriodLabel(nw);
    var nb=document.getElementById('rpt-week-next');

      nb.disabled=(period2==='monthly')
        ?(nw.slice(0,7)>=now3.getFullYear()+'-'+String(now3.getMonth()+1).padStart(2,'0'))
        :(nw>=getMondayStr(now3));
    }
    _loadReportsData(nw, window._reportsWeeks||[], window._analyticsUMap||{}, window._rptDeptFilter||'', window._rptSvcFilter||'');
  };

  window._rptGoToday = function() {
    var period2=window._rptPeriod||'weekly';
    var now2=new Date();
    window._reportsWeek = period2==='monthly'
      ? now2.getFullYear()+'-'+String(now2.getMonth()+1).padStart(2,'0')+'-01'
      : getMondayStr(now2);

    var nb=document.getElementById('rpt-week-next'); if(nb) nb.disabled=true;
    _loadReportsData(window._reportsWeek, window._reportsWeeks||[], window._analyticsUMap||{}, window._rptDeptFilter||'', window._rptSvcFilter||'');
  };

function _loadReportsData(week, weeks, uMap, deptId, serviceId) {
  var panel = document.getElementById('rpt-content');
  if (!panel) return;
  panel.innerHTML = '<div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>';
  var _dept   = deptId    || '';
  var _svc    = serviceId || '';
  var _period = window._rptPeriod || 'weekly';

  // Use correct submission function for period
  var subGsr = _period === 'monthly'
    ? gsr('getMonthlySubmissionStatus', State.user.id, State.user.role, week, _dept, _svc)
    : gsr('getWeeklySubmissionStatus',  State.user.id, State.user.role, week, _dept, _svc);

  gsr('getReportsData', State.user.id, State.user.role, _dept, _svc, week, _period)
  .then(function(combined) {
    var subRows  = combined.subRows  || [];
    var perf     = combined.perf     || {};
    var trend    = combined.trend    || [];
    var deptSub  = combined.deptSub  || [];
    var newConns = combined.newConns || [];

    var onT       = (perf.onTarget||[]).length;
    var atR       = (perf.atRisk||[]).length;
    var crit      = (perf.critical||[]).length;
    var noD       = (perf.noData||[]).length;
    var perfTotal = onT+atR+crit+noD;
    var totalSub  = subRows.reduce(function(a,v){return a+v.submittedCount;},0);
    var subNotYet = perfTotal - totalSub;
    var subPct    = perfTotal>0 ? Math.round((totalSub/perfTotal)*100) : 0;
    var pct       = function(n){return perfTotal>0?Math.round((n/perfTotal)*100):0;};

    var periodLabel = _rptPeriodLabel(week);

    // Scorecards
    var scorecards='<div class="stat-grid" style="margin-bottom:20px;">'
      +'<div class="stat-card total"><div class="stat-label">Active Connections</div><div class="stat-value">'+perfTotal+'</div></div>'
      +'<div class="stat-card on-target"><div class="stat-label">Submitted</div><div class="stat-value">'+totalSub+'<span style="font-size:13px;opacity:0.7;margin-left:6px;">/ '+perfTotal+'</span></div>'
      +'<div style="font-size:12px;margin-top:4px;opacity:0.8;">'+subPct+'% submission rate</div></div>'
      +'<div class="stat-card '+( subNotYet>0?'at-risk':'on-target')+'"><div class="stat-label">Not Submitted</div><div class="stat-value">'+subNotYet+'</div></div>'
      +'<div class="stat-card on-target"><div class="stat-label">On Target</div><div class="stat-value">'+onT+'<span style="font-size:13px;opacity:0.7;margin-left:6px;">('+pct(onT)+'%)</span></div></div>'
      +'<div class="stat-card at-risk"><div class="stat-label">At Risk</div><div class="stat-value">'+atR+'<span style="font-size:13px;opacity:0.7;margin-left:6px;">('+pct(atR)+'%)</span></div></div>'
      +'<div class="stat-card critical"><div class="stat-label">Critical</div><div class="stat-value">'+crit+'<span style="font-size:13px;opacity:0.7;margin-left:6px;">('+pct(crit)+'%)</span></div></div>'
      +'</div>';

    // Charts
    var subTrend=trend.map(function(t){
      var total=t.total||1;
      return {week:t.week,subRate:Math.round(((t.onTarget||0)+(t.atRisk||0)+(t.critical||0))/total*100),
              onTarget:t.onTarget||0,atRisk:t.atRisk||0,critical:t.critical||0,total:total};
    });
    var periodLabelShort = _period==='monthly'?'month':'week';
    var charts='<div class="grid-2" style="margin-bottom:20px;">'
      +'<div class="card" style="overflow:visible;">'
      +'<div class="card-header"><div class="card-title">Submission Rate Over Time</div>'
      +'<div class="card-subtitle">% submitted each '+periodLabelShort+'</div></div>'
      +'<div style="padding:8px 16px 12px;">'+_renderSubRateChart(subTrend)+'</div></div>'
      +'<div class="card" style="overflow:visible;">'
      +'<div class="card-header"><div class="card-title">Performance Over Time</div>'
      +'<div class="card-subtitle">On Target / At Risk / Critical per '+periodLabelShort+'</div></div>'
      +'<div style="padding:8px 16px 12px;">'+(typeof renderTrendChart==='function'?renderTrendChart(trend):'')+'</div></div>'
      +'</div>';

    // New connections (weekly only - skip for monthly)
    var newConnSection='';
    if (_period==='weekly' && newConns.length) {
      var PCLS={'Critical':'badge-danger','At Risk':'badge-warning','On Target':'badge-success','No Data':'badge-muted'};
      var ncRows=newConns.map(function(n){
        return '<tr>'
          +'<td><strong>'+n.clientName+'</strong></td>'
          +'<td>'+n.vaName+'</td>'
          +'<td>'+n.department+'</td>'
          +'<td>'+n.service+'</td>'
          +'<td><span class="badge '+(n.type==='Project-based'?'badge-info':'badge-muted')+'">'+n.type+'</span></td>'
          +'<td style="font-size:11px;color:var(--text-muted);">'+n.startDate+'</td>'
          +'</tr>';
      }).join('');
      newConnSection='<div class="card" style="margin-bottom:16px;">'
        +'<div class="card-header"><div class="card-title">New Connections This Week</div>'
        +'<div class="card-subtitle">'+newConns.length+' connection'+(newConns.length!==1?'s':'')+' started · '+periodLabel+'</div></div>'
        +'<div class="table-wrap"><table>'
        +'<thead><tr><th>Client</th><th>VA</th><th>Department</th><th>Service</th><th>Type</th><th>Start Date</th></tr></thead>'
        +'<tbody>'+ncRows+'</tbody></table></div></div>';
    }

    // Dept summary
    var deptTable='';
    if (deptSub.length) {
      var deptRows=deptSub.map(function(s){
        var pct2=s.total>0?Math.round((s.submitted/s.total)*100):0;
        var barC=pct2===100?'var(--on-target)':pct2>=50?'var(--at-risk)':'var(--critical)';
        return '<tr>'
          +'<td><strong>'+s.deptName+'</strong></td>'
          +'<td style="text-align:center;">'+s.submitted+' / '+s.total+'</td>'
          +'<td style="min-width:130px;">'
          +'<div style="display:flex;align-items:center;gap:6px;">'
          +'<div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;">'
          +'<div style="width:'+pct2+'%;height:100%;background:'+barC+';border-radius:3px;"></div></div>'
          +'<span style="font-size:11px;font-weight:700;color:'+barC+';">'+pct2+'%</span>'
          +'</div></td>'
          +'</tr>';
      }).join('');
      deptTable='<div class="card">'
        +'<div class="card-header"><div class="card-title">Submission by Department</div>'
        +'<div class="card-subtitle">'+(_period==='monthly'?'Month of ':'Week of ')+periodLabel+'</div></div>'
        +'<div class="table-wrap"><table>'
        +'<thead><tr><th>Department</th><th style="text-align:center;">Submitted / Total</th><th>Rate</th></tr></thead>'
        +'<tbody>'+deptRows+'</tbody></table></div></div>';
    }

    panel.innerHTML = newConnSection + scorecards + charts + deptTable;
  });
}

  var dateStr = window._lvDate   || getMondayStr(new Date());

  gsr('getLifetimeValueReport', State.user.id, State.user.role, deptId, dateStr, period).then(function(res) {
    var data      = (res&&res.data) || {};
    var rows      = (data.rows || []).slice();
    var PCLS      = {'Critical':'badge-danger','At Risk':'badge-warning','On Target':'badge-success','No Data':'badge-muted'};

    window._lvAllRows   = rows;
    window._lvCustomers = data.customers || [];

    // Scorecards
    var totalConns  = rows.length;
    var activeConns = rows.filter(function(r){ return r.status==='Active'; }).length;
    var customers   = data.customers || [];
    var avgDays     = customers.length ? Math.round(customers.reduce(function(a,c){ return a+c.maxDays; },0)/customers.length) : 0;
    var maxDays     = customers.length ? Math.max.apply(null, customers.map(function(c){ return c.maxDays; }).concat([0])) : 0;

    var scorecards = '<div class="stat-grid" style="margin-bottom:20px;">'
      + '<div class="stat-card total"><div class="stat-label">Total Connections</div><div class="stat-value">'+totalConns+'</div></div>'
      + '<div class="stat-card on-target"><div class="stat-label">Active Now</div><div class="stat-value">'+activeConns+'</div></div>'
      + '<div class="stat-card total"><div class="stat-label">Avg Duration</div><div class="stat-value" style="font-size:18px;">'+_fmtDur(avgDays)+'</div></div>'
      + '<div class="stat-card on-target"><div class="stat-label">Longest Client</div><div class="stat-value" style="font-size:18px;">'+_fmtDur(maxDays)+'</div></div>'
      + '</div>';

    // Dedup to 1 row per client (longest)
    function dedupeByClient(list, ascending) {
      var map = {};
      list.forEach(function(r){
        var k=r.clientName;
        if (!map[k]||r.daysActive>map[k].daysActive) map[k]=r;
      });
      var arr = Object.values(map);
      arr.sort(function(a,b){ return ascending?a.daysActive-b.daysActive:b.daysActive-a.daysActive; });
      return arr;
    }

    var clientRows = dedupeByClient(rows, sortDir==='asc');

    // All Clients table (client name, active, longest duration, status, perf)
    function clientTable(list) {
      if (!list.length) return '<div class="table-empty">No connections found.</div>';
      var hdr='<thead style="position:sticky;top:0;z-index:2;background:var(--bg-secondary);"><tr><th>Client</th><th>Active</th><th>Longest Duration</th><th>Status</th><th>Performance</th></tr></thead>';
      var body='<tbody>'+list.map(function(row){
        var cust=(window._lvCustomers||[]).find(function(c){return c.clientName===row.clientName;})||{};
        var activeCnt=cust.activeConnections!=null?cust.activeConnections:(row.status==='Active'?1:0);
        var sCls=row.status==='Active'?'badge-success':row.status==='Paused'?'badge-warning':'badge-danger';
        var perfSt=cust.perfStatus||row.perfStatus||'No Data';
        return '<tr style="cursor:pointer;" onclick="_openLVModal(\''+row.clientName.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')" title="Click to view VA details">'
          +'<td><strong style="color:var(--accent);">'+row.clientName+'</strong>'+(row.secondaryName?'<div style="font-size:11px;color:var(--text-muted);">'+row.secondaryName+'</div>':'')+'</td>'
          +'<td style="text-align:center;"><span class="badge badge-success">'+activeCnt+'</span></td>'
          +'<td><strong style="font-size:13px;">'+_fmtDur(row.daysActive)+'</strong></td>'
          +'<td><span class="badge '+sCls+'">'+row.status+'</span></td>'
          +'<td><span class="badge '+(PCLS[perfSt]||'badge-muted')+'">'+perfSt+'</span></td>'
          +'</tr>';
      }).join('')+'</tbody>';
      return '<div class="table-wrap" style="max-height:420px;overflow-y:auto;"><table>'+hdr+body+'</table></div>';
    }

    // Top 10 table
    function top10Table(list, emptyMsg) {
      if (!list||!list.length) return '<div class="table-empty">'+emptyMsg+'</div>';
      var hdr='<thead style="position:sticky;top:0;z-index:2;background:var(--bg-secondary);"><tr><th>#</th><th>Client</th><th>Active</th><th>Longest Duration</th><th>Performance</th></tr></thead>';
      var body='<tbody>'+list.map(function(c,idx){
        return '<tr style="cursor:pointer;" onclick="_openLVModal(\''+c.clientName.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">>'
          +'<td style="font-weight:700;color:var(--text-muted);">'+(idx+1)+'</td>'
          +'<td><strong>'+c.clientName+'</strong>'+(c.secondaryName?'<div style="font-size:11px;color:var(--text-muted);">'+c.secondaryName+'</div>':'')+'</td>'
          +'<td style="text-align:center;"><span class="badge badge-success">'+c.activeConnections+'</span></td>'
          +'<td><strong style="color:var(--accent);">'+_fmtDur(c.maxDays)+'</strong></td>'
          +'<td><span class="badge '+(PCLS[c.perfStatus]||'badge-muted')+'">'+c.perfStatus+'</span></td>'
          +'</tr>';
      }).join('')+'</tbody>';
      return '<div class="table-wrap"><table>'+hdr+body+'</table></div>';
    }

    var top10long  = (data.top10long  ||[]).filter(function(c){return c.maxDays>0;});
    var top10short = (data.top10short ||[]).filter(function(c){return c.maxDays>0&&c.activeConnections>0;});

    panel.innerHTML = scorecards
      +'<div class="card" style="margin-bottom:16px;">'
      +'<div class="card-header"><div class="card-title">All Clients</div>'
      +'<div class="card-subtitle">One row per client · '+(sortDir==='desc'?'longest':'shortest')+' first · click to view details</div></div>'
      +clientTable(clientRows)
      +'</div>'
      +'<div class="grid-2">'
      +'<div class="card"><div class="card-header"><div class="card-title">Top 10 Longest-Running</div>'
      +'<div class="card-subtitle">Click a row to view VA details</div></div>'
      +top10Table(top10long,'No data.')
      +'</div>'
      +'<div class="card"><div class="card-header"><div class="card-title">Top 10 Shortest-Running</div>'
      +'<div class="card-subtitle">Active connections only</div></div>'
      +top10Table(top10short,'No data.')
      +'</div></div>';
  });
}

// ── CLIENT MODAL ──

  var cust = (window._lvCustomers||[]).find(function(c){ return c.clientName===clientName; }) || {};

  var depts   = [...new Set(origRows.map(function(r){return r.department;}))].sort();
  var statuses= [...new Set(origRows.map(function(r){return r.status;}))].sort();
  var types   = [...new Set(origRows.map(function(r){return r.connectionType;}))].sort();

    var typeOpts  = '<option value="">All Types</option>'+types.map(function(t){return '<option>'+t+'</option>';}).join('');

      +'<select class="form-control" style="width:auto;height:26px;font-size:11px;" id="lv-m-type" onchange="_lvModalFilterChange(\''+clientName.replace(/'/g,"\\'")+'\')">'+typeOpts+'</select>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'
      +'<span style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;">Status:</span>'+statChecks
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'
      +'<span style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;">Performance:</span>'+perfChecks
      +'</div>'

    var INTV_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-5"/></svg>';
    var vaTable = filteredRows.length
      ? '<div class="table-wrap"><table>'
        +'<thead><tr><th>VA Name</th><th>Department</th><th>Service</th><th>Type</th>'

        +'<tbody>'+filteredRows.map(function(r){
          return '<tr'+(r.connectionId?' style="cursor:pointer;" onclick="closeModal();setTimeout(function(){ if(typeof connOpenDetail===\'function\') connOpenDetail(\''+r.connectionId+'\'); },80);"':'')+'>'
            +'<td><strong>'+r.vaName+'</strong></td>'
            +'<td style="font-size:11px;">'+r.department+'</td>'

    return chartSection + filterBar + vaTable;
  }

  var perfBadge = '<span class="badge '+(PCLS[cust.perfStatus]||'badge-muted')+'" style="font-size:12px;padding:4px 10px;">'+( cust.perfStatus||'No Data')+'</span>';
  var summary   = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">'
    +perfBadge
    +'<span style="font-size:12px;color:var(--text-muted);">'+origRows.length+' connection'+(origRows.length!==1?'s':'')+' · Longest: '+_fmtDur(cust.maxDays||0)+'</span>'
    +'</div>';

  openModal(clientName, summary + buildModalContent(origRows, null));

  // Wire filter change function on window
  window._lvModalFilterChange = function(cn) {
    var dept  = (document.getElementById('lv-m-dept')||{value:''}).value;
    var type  = (document.getElementById('lv-m-type')||{value:''}).value;
    // Multi-select perf (distinct checkbox class from status)
    var perfChks = document.querySelectorAll('#modal-body input.lv-perf-cb');
    var selPerfs = [];
    perfChks.forEach(function(cb){ if(cb.checked) selPerfs.push(cb.value); });
    // Multi-select status
    var statChks = document.querySelectorAll('#modal-body input.lv-stat-cb');
    var selStats = [];
    statChks.forEach(function(cb){ if(cb.checked) selStats.push(cb.value); });

    var filtered = origRows.filter(function(r){
      if (dept && r.department !== dept) return false;
      if (type && r.connectionType !== type) return false;
      if (selStats.length && selStats.indexOf(r.status) < 0) return false;
      if (selPerfs.length && selPerfs.indexOf(r.perfStatus) < 0) return false;
      return true;
    });

    var body = document.getElementById('modal-body');
    if (body) {
      body.innerHTML = summary + buildModalContent(filtered, selPerfs.length?selPerfs:null, selStats.length?selStats:null);
      // Re-restore dropdown/checkbox selections after rebuild
      setTimeout(function(){
        var d=document.getElementById('lv-m-dept'); if(d) d.value=dept;
        var t=document.getElementById('lv-m-type'); if(t) t.value=type;
        var pcbs=document.querySelectorAll('#modal-body input.lv-perf-cb');
        pcbs.forEach(function(cb){ cb.checked=selPerfs.length?selPerfs.indexOf(cb.value)>=0:true; });
        var scbs=document.querySelectorAll('#modal-body input.lv-stat-cb');
        scbs.forEach(function(cb){ cb.checked=selStats.length?selStats.indexOf(cb.value)>=0:true; });
        _loadLVChart(cn, filtered);
      }, 10);
    }
  };

  // Load trend chart
  setTimeout(function(){ _loadLVChart(clientName, origRows); }, 100);
}

function _loadLVChart(clientName, connRows) {
  gsr('getClientPerformanceTrend', connRows.map(function(r){ return r.connectionId; })).then(function(tr){
    var wrap=document.getElementById('lv-modal-chart');
    if (wrap && typeof renderTrendChart==='function') {
      wrap.innerHTML = (tr&&tr.data&&tr.data.length)
        ? renderTrendChart(tr.data)
        : '<div class="table-empty">No performance data for the past 6 weeks.</div>';
    }
  });
}

// Duration formatter
function _fmtDur(days) {
  if (!days||days<=0) return '\u2014';
  var yrs=Math.floor(days/365), mos=Math.floor((days%365)/30);
  if (yrs>0&&mos>0) return yrs+'yr '+mos+'mo';
  if (yrs>0) return yrs+' yr'+(yrs!==1?'s':'');
  if (mos>0) return mos+' mo'+(mos!==1?'s':'');
  return days+' day'+(days!==1?'s':'');
}

function renderCustomerOverview() {
  // Sync from global period
  var _gpCO = window._globalPeriod || {};
  if (_gpCO.period)    window._coPeriod = _gpCO.period;
  if (_gpCO.periodKey) window._coDate   = _gpCO.periodKey;
  if (!window._gpListeners) window._gpListeners = {};
  window._gpListeners['customer-overview'] = function() {
    var gp5 = window._globalPeriod || {};
    if (gp5.period)    window._coPeriod = gp5.period;
    if (gp5.periodKey) window._coDate   = gp5.periodKey;
    renderCustomerOverview();
  };
  VAA_LOG && VAA_LOG.info('REPORTS','renderCustomerOverview()');
  set('page-content','<div style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>');
  gsr('getDepartments').then(function(dr){
    window._coDepts = (dr&&dr.data)||[];
    if (!window._coPeriod) window._coPeriod = 'weekly';
    if (!window._coDate)   window._coDate   = getMondayStr(new Date());
    if (!window._coDept)   window._coDept   = '';
    _buildCustomerOverviewPage();
  });
}
window.renderCustomerOverview = renderCustomerOverview;

function _coPeriodLabel(dateStr) {
  var period = window._coPeriod || 'weekly';
  if (period === 'monthly') {
    var d = new Date(String(dateStr).slice(0,7)+'-01T00:00:00');
    return d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  }
  var d1=new Date(dateStr+'T00:00:00'), d2=new Date(dateStr+'T00:00:00');
  d2.setDate(d2.getDate()+6);
  var f=function(x){return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};
  return f(d1)+' \u2013 '+f(d2);
}

function _coNavDate(dir) {
  var period=window._coPeriod||'weekly';
  var d=new Date((window._coDate||getMondayStr(new Date()))+'T00:00:00');
  if (period==='monthly'){d.setDate(1);d.setMonth(d.getMonth()+dir);}
  else d.setDate(d.getDate()+dir*7);
  var yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');
  var nw=yr+'-'+mo+'-'+dy;
  var now=new Date();
  if (period==='monthly'){
    var curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    if (nw.slice(0,7)>curYM) nw=curYM+'-01';
  } else { var tm=getMondayStr(now); if(nw>tm) nw=tm; }
  window._coDate=nw;
  var lbl=document.getElementById('co-date-label'); if(lbl) lbl.textContent=_coPeriodLabel(nw);
  var nb=document.getElementById('co-date-next');
  if (nb){
    var now2=new Date();
    nb.disabled=(period==='monthly')
      ?(nw.slice(0,7)>=now2.getFullYear()+'-'+String(now2.getMonth()+1).padStart(2,'0'))
      :(nw>=getMondayStr(now2));
  }
  _loadCustomerOverviewData();
}

function _coChangePeriod(period) {
  window._coPeriod=period;
  var now=new Date();
  window._coDate=period==='monthly'
    ?now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01'
