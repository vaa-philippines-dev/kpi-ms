function _loadCustomerOverviewData() {
  var panel=document.getElementById('co-content');
  console.log('[CO] _loadCustomerOverviewData: panel='+!!panel+' coPeriod='+window._coPeriod+' coDate='+window._coDate);
  if (!panel) { console.error('[CO] co-content NOT FOUND'); return; }
  panel.innerHTML='<div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>';
  var period  = window._coPeriod||'weekly';
  var dateStr = window._coDate||getMondayStr(new Date());
  var deptId  = window._coDept||'';
  console.log('[CO] GAS call: period='+period+' dateStr='+dateStr+' dept='+deptId);
  gsr('getCustomerOverviewReport', State.user.id, State.user.role, deptId, period, dateStr).then(function(res){
    console.log('[CO] GAS response: success='+(res&&res.success)+' customers='+(res&&res.data&&res.data.customers&&res.data.customers.length)+' msg='+(res&&res.message));
    if (!res||!res.success){
      panel.innerHTML='<div class="table-empty">Failed to load: '+(res&&res.message||'error')+'</div>'; return;
    }
    var data=res.data, customers=data.customers||[], periods=data.periods||[], useMonthly=data.useMonthly;
    window._coCustomers=customers; window._coPeriods=periods;

    var PCLS={'Critical':'badge-danger','At Risk':'badge-warning','On Target':'badge-success','No Data':'badge-muted'};
    var PBG ={'Critical':'rgba(239,68,68,0.12)','At Risk':'rgba(245,158,11,0.12)','On Target':'rgba(34,197,94,0.1)','No Data':'transparent'};

    var totalCusts=customers.length;
    var totalConns=customers.reduce(function(a,c){return a+c.activeConns;},0);
    var latestSt = function(c){ return c.periodStatuses && c.periodStatuses.length ? (c.periodStatuses[c.periodStatuses.length-1]||'') : ''; };
    var critCount   = customers.filter(function(c){ return latestSt(c)==='Critical'; }).length;
    var atRiskCount = customers.filter(function(c){ return latestSt(c)==='At Risk'; }).length;
    var onTgtCount  = customers.filter(function(c){ return latestSt(c)==='On Target'; }).length;

    var scorecards='<div class="stat-grid" style="margin-bottom:20px;">'
      +'<div class="stat-card total"><div class="stat-label">Active Customers</div><div class="stat-value">'+totalCusts+'</div></div>'
      +'<div class="stat-card total"><div class="stat-label">Active Connections</div><div class="stat-value">'+totalConns+'</div></div>'
      +'<div class="stat-card critical"><div class="stat-label">Critical</div><div class="stat-value">'+critCount+'</div></div>'
      +'<div class="stat-card on-target"><div class="stat-label">On Target</div><div class="stat-value">'+onTgtCount+'</div></div>'    +'<div class="stat-card at-risk"><div class="stat-label">At Risk</div><div class="stat-value">'+atRiskCount+'</div></div>'
      +'</div>';

    function fmtPHdr(p){
      if(useMonthly){var d=new Date(p+'-01T00:00:00');return d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
      var d=new Date(p+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }

    var periodHdrs=periods.map(function(p,i){
      var isLast=i===periods.length-1;
      return '<th style="text-align:center;white-space:nowrap;font-size:11px;'+(isLast?'font-weight:800;color:var(--accent)':'')+'">'+fmtPHdr(p)+'</th>';
    }).join('');

    // Sort state
    window._coSortKey = window._coSortKey || 'activeConns';
    window._coSortDir = window._coSortDir || 'desc';

    window._renderCoTable = function(sorted) {
      var rows=sorted.map(function(cust){
        var latestStatus=cust.periodStatuses[cust.periodStatuses.length-1]||'No Data';
        var periodCells=cust.periodStatuses.map(function(st,i){
          var isLast=i===cust.periodStatuses.length-1;
          return '<td style="text-align:center;background:'+(PBG[st]||'transparent')+';'+(isLast?'border-left:2px solid var(--border);':'')+'\">'
            +'<span class="badge '+(PCLS[st]||'badge-muted')+'" style="font-size:10px;padding:2px 5px;">'+st+'</span></td>';
        }).join('');
        var safeName=cust.clientName.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return '<tr style="cursor:pointer;" onclick="_openCoModal(\''+safeName+'\')">'
          +'<td><strong style="color:var(--accent);">'+cust.clientName+'</strong>'+(cust.secondaryName?'<div style="font-size:11px;color:var(--text-muted);">'+cust.secondaryName+'</div>':'')+'</td>'
          +'<td style="text-align:center;"><span class="badge badge-success">'+cust.activeConns+'</span></td>'
          +'<td style="text-align:center;"><strong style="font-size:12px;color:var(--accent);">'+_fmtDur(cust.maxDays||0)+'</strong></td>'
          +periodCells

          +'</tr>';
      }).join('');

      function sortHdr(key, label) {
        var active=window._coSortKey===key;
        var dir=active?window._coSortDir:'desc';
        var thStyle='cursor:pointer;white-space:nowrap;user-select:none;'+(active?'color:var(--accent);':'');
        var arrow=active?(dir==='desc'?' \u2193':' \u2191'):' \u2195';
        return '<th style="'+thStyle+'" onclick="window._coSort(\''+key+'\')">'+label+arrow+'</th>';
      }

      var thead='<thead><tr>'
        +sortHdr('clientName','Customer')
        +sortHdr('activeConns','Active')
        +sortHdr('maxDays','Duration')
        +periodHdrs
        
        +'</tr></thead>';

      return thead+'<tbody>'+rows+'</tbody>';
    };

    var CO_NUMERIC_KEYS = {activeConns:1, maxDays:1};
    function _coSortCompare(a, b, key, dir) {
      if (CO_NUMERIC_KEYS[key]) {
        var av2 = parseFloat(a[key]) || 0, bv2 = parseFloat(b[key]) || 0;
        return dir === 'asc' ? av2 - bv2 : bv2 - av2;
      }
      var as = String(a[key] || '').toLowerCase(), bs = String(b[key] || '').toLowerCase();
      return dir === 'asc' ? (as > bs ? 1 : as < bs ? -1 : 0) : (as < bs ? 1 : as > bs ? -1 : 0);
    }
    function applyCoSort(list) {
      var key = window._coSortKey || 'activeConns';
      var dir = window._coSortDir || 'desc';
      return list.slice().sort(function(a, b){ return _coSortCompare(a, b, key, dir); });
    }

    // Persist data at window scope so sort works across re-renders
    window._coCurrentCustomers = customers;
    window._coSort = function(key) {
      if (window._coSortKey===key) window._coSortDir=window._coSortDir==='asc'?'desc':'asc';
      else { window._coSortKey=key; window._coSortDir='desc'; }
      var dir2 = window._coSortDir;
      var sorted2 = (window._coCurrentCustomers||[]).slice().sort(function(a,b){ return _coSortCompare(a, b, key, dir2); });
      var thead = document.getElementById('co-table-head');
      var tbody  = document.getElementById('co-table-body');
      if (!thead || !tbody) return;
      var tmp = document.createElement('table');
      tmp.innerHTML = window._renderCoTable(sorted2);
      var newThead = tmp.querySelector('thead');
      var newTbody = tmp.querySelector('tbody');
      if (newThead) thead.innerHTML = newThead.innerHTML;
      if (newTbody) tbody.innerHTML = newTbody.innerHTML;
    };

    var sorted=applyCoSort(customers);
    var tableContent=window._renderCoTable(sorted);
    window._coAllCustomers = customers; // unfiltered master list for search

    panel.innerHTML=scorecards
      +'<div class="card">'
      +'<div class="card-header"><div class="card-title">Active Customers</div>'
      +'<div class="card-subtitle">KPI performance per period \u00b7 click a row to view VA details</div></div>'
      +'<div style="padding:0 16px 12px;">'
      +'<input class="form-control" id="co-search" placeholder="Search customers\u2026" style="max-width:260px;height:32px;font-size:12px;" oninput="_coApplySearch(this.value)">'
      +'</div>'
      +'<div class="table-wrap" style="max-height:600px;overflow-y:auto;position:relative;">'
      +'<table id="co-main-table" style="width:100%;">'
      +(function(){
          var tmp=document.createElement('table');
          tmp.innerHTML=tableContent;
          var th=tmp.querySelector('thead');
          var tb=tmp.querySelector('tbody');
          if(th){ th.id='co-table-head'; th.style.cssText='position:sticky;top:0;z-index:2;background:var(--bg-secondary);'; }
          if(tb) tb.id='co-table-body';
          return (th?th.outerHTML:'')+(tb?tb.outerHTML:'');
        })()
      +'</table></div></div>';
  });
}

// ── Search filter for Active Customers table ──────────────────────────────
function _coApplySearch(query) {
  var q = String(query||'').toLowerCase().trim();
  var all = window._coAllCustomers || [];
  var filtered = q ? all.filter(function(c){
    return (c.clientName||'').toLowerCase().indexOf(q) >= 0
        || (c.secondaryName||'').toLowerCase().indexOf(q) >= 0;
  }) : all;
  window._coCurrentCustomers = filtered;
  var key = window._coSortKey || 'activeConns';
  var dir = window._coSortDir || 'desc';
  var sorted = filtered.slice().sort(function(a,b){ return _coSortCompare(a, b, key, dir); });
  var tbody = document.getElementById('co-table-body');
  if (!tbody) return;
  var tmp = document.createElement('table');
  tmp.innerHTML = window._renderCoTable(sorted);
  var newTbody = tmp.querySelector('tbody');
  if (newTbody) tbody.innerHTML = newTbody.innerHTML;
}

// ── Customer detail modal ──
function _openCoModal(clientName) {
  var customers=window._coCustomers||[], periods=window._coPeriods||[];
  var cust=customers.find(function(c){return c.clientName===clientName;});
  if (!cust) return;

  var PCLS={'Critical':'badge-danger','At Risk':'badge-warning','On Target':'badge-success','No Data':'badge-muted'};
  var latestStatus=cust.periodStatuses[cust.periodStatuses.length-1]||'No Data';

  // Modal state
  window._coModalPeriod = window._coModalPeriod || window._coPeriod || 'weekly';
  window._coModalClient = clientName;

  function buildModalBody(modalPeriod) {
    var useMonthly2 = modalPeriod==='monthly';

    function fmtPHdr2(p){
      if(useMonthly2){var d=new Date(p+'-01T00:00:00');return d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
      var d=new Date(p+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }

    // Sort state for modal table
    window._coModalSort = window._coModalSort || 'vaName';
    window._coModalDir  = window._coModalDir  || 'asc';

    var conn2 = (cust.connections||[]).slice();

    function sortModalTable(list) {
      var key=window._coModalSort, dir=window._coModalDir;
      return list.slice().sort(function(a,b){
        var av=a[key]||''; var bv=b[key]||'';
        if (key==='daysActive'||key==='modalDays') return dir==='asc'?(a.daysActive||0)-(b.daysActive||0):(b.daysActive||0)-(a.daysActive||0);
        return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
      });
    }

    // Period headers for table
    var pHdrs=periods.map(function(p){
      return '<th style="text-align:center;font-size:10px;white-space:nowrap;">'+fmtPHdr2(p)+'</th>';
    }).join('');

    function colHdr(key, label) {
      var active=window._coModalSort===key;
      var dir=active?window._coModalDir:'asc';
      return '<th style="cursor:pointer;white-space:nowrap;'+(active?'color:var(--accent);':'')+'\" onclick="window._coModalSort=\''+key+'\';window._coModalDir='+(active?'(window._coModalDir===\'asc\'?\'desc\':\'asc\')':'\'asc\'')+';_coModalReRender()">'+label+(active?(dir==='asc'?' ↑':' ↓'):' ↕')+'</th>';
    }

    var thead='<thead><tr>'+colHdr('vaName','VA')
      +'<th>Dept / Service</th>'
      +colHdr('connectionType','Type')
      +colHdr('daysActive','Duration')
      +pHdrs
      +'</tr></thead>';

    var sorted2=sortModalTable(conn2);
    var vaRows=sorted2.map(function(conn){
      var cells=conn.periodStatuses.map(function(st){
        if (st==='empty') return '<td style="text-align:center;color:var(--border);">\u2014</td>';
        return '<td style="text-align:center;"><span class="badge '+(PCLS[st]||'badge-muted')+'" style="font-size:9px;padding:1px 4px;">'+st+'</span></td>';
      }).join('');
      return '<tr>'
        +'<td><strong style="font-size:12px;">'+conn.vaName+'</strong></td>'
        +'<td style="font-size:11px;line-height:1.3;">'
        +'<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">'+conn.department+'</span>'
        +'<div style="font-size:12px;font-weight:500;color:var(--text-primary);">'+conn.service+'</div>'
        +'</td>'
        +'<td><span class="badge '+(conn.connectionType==='Project-based'?'badge-info':'badge-muted')+'" style="font-size:9px;">'+conn.connectionType+'</span></td>'
        +'<td><strong style="font-size:11px;color:var(--accent);">'+_fmtDur(conn.daysActive||0)+'</strong></td>'
        +cells
        +'</tr>';
    }).join('');

    var tableSection='<div id="co-modal-table-wrap" class="table-wrap" style="max-height:300px;overflow-y:auto;"><table>'
      +thead+'<tbody id="co-modal-tbody">'+vaRows+'</tbody></table></div>';

    // Period toggle for modal
    var periodToggle='<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">'
      +'<span style="font-size:11px;font-weight:600;color:var(--text-muted);">View:</span>'
      +'<div class="kpi-view-toggle">'
      +'<button class="kpi-vtoggle-btn '+(modalPeriod==='weekly'?'active':'')+'" onclick="window._coModalPeriod=\'weekly\';_coModalReRender()" style="font-size:11px;padding:3px 10px;">Weekly</button>'
      +'<button class="kpi-vtoggle-btn '+(modalPeriod==='monthly'?'active':'')+'" onclick="window._coModalPeriod=\'monthly\';_coModalReRender()" style="font-size:11px;padding:3px 10px;">Monthly</button>'
      +'</div></div>';

    // Trend chart \u2014 compact half-width
    var chartSection='<div class="grid-2" style="margin-bottom:12px;gap:12px;">'
      +'<div>'
      +'<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px;">Performance Trend</div>'
      +'<div id="co-modal-chart" style="min-height:80px;"><div style="padding:16px;text-align:center;"><div class="spinner" style="margin:0 auto;width:20px;height:20px;border-width:2px;"></div></div></div>'
      +'</div>'
      +'<div></div>'  // empty right slot reserved for future
      +'</div>';

    var summary='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'
      +'<span class="badge '+(PCLS[latestStatus]||'badge-muted')+'" style="font-size:12px;padding:4px 10px;">'+latestStatus+'</span>'
      +'<span style="font-size:12px;color:var(--text-muted);">'+cust.activeConns+' active · Longest: '+_fmtDur(cust.maxDays||0)+'</span>'
      +'</div>';

    return summary + periodToggle + chartSection + tableSection;
  }

  window._coModalReRender = function() {
    var mp=window._coModalPeriod||'weekly';
    var body=document.getElementById('modal-body');
    if(body){body.innerHTML=buildModalBody(mp);}
    setTimeout(function(){_coLoadModalChart(clientName);},50);
  };

  openModal(clientName, buildModalBody(window._coModalPeriod||window._coPeriod||'weekly'));
  setTimeout(function(){ _coLoadModalChart(clientName); }, 100);
}

function _coLoadModalChart(clientName) {
  var cust=(window._coCustomers||[]).find(function(c){return c.clientName===clientName;});
  if (!cust) return;
  var connIds=cust.connections.map(function(c){return c.connectionId;});
  gsr('getClientPerformanceTrend', connIds, window._coModalPeriod||window._coPeriod||'weekly').then(function(tr){
    var wrap=document.getElementById('co-modal-chart');
    if(wrap && typeof renderTrendChart==='function'){
      wrap.innerHTML=(tr&&tr.data&&tr.data.length)
        ?renderTrendChart(tr.data)
        :'<div class="table-empty" style="font-size:11px;">No trend data.</div>';
    }
  });
}


function exportReport(mode) {
  var isHtml = (mode===2||mode==='html');
  var btnId = isHtml ? 'export-btn-html' : 'export-btn-sheets';
  var btn   = document.getElementById(btnId);
  var SPIN  = '<div class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block;vertical-align:-3px;margin-right:4px;"></div>';
  if (btn) { btn.disabled=true; btn.innerHTML=SPIN+(mode==='html'?'Building HTML\u2026':'Building Sheets\u2026'); }
  toast('Generating export\u2026 this may take a few seconds.', 'info');
  var deptId = window._coDept || '';

  if (isHtml) {
    gsr('exportReportHtml', State.user.id, State.user.role, deptId).then(function(res){
      if (btn) { btn.disabled=false; btn.innerHTML='Download HTML'; }
      if (res && res.success) {
        // Trigger browser download of HTML file
        var blob = new Blob([res.html], {type:'text/html;charset=utf-8'});
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.href   = url;
        a.download = 'VAA_Report_'+new Date().toISOString().slice(0,10)+'.html';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        toast('HTML report downloaded!', 'success');
      } else {
        toast('Export failed: '+(res&&res.message||'Unknown error'), 'error');
      }
    });
  } else {
    gsr('exportReport', State.user.id, State.user.role, deptId).then(function(res){
      if (btn) { btn.disabled=false; btn.innerHTML='Google Sheets'; }
      if (res && res.success) {
        toast('Export ready! Opening in Google Sheets\u2026', 'success');
        window.open(res.url, '_blank');
      } else {
        toast('Export failed: '+(res&&res.message||'Unknown error'), 'error');
      }
    });
  }
}

function renderSubmissionStatus(weekOverride) {
  VAA_LOG && VAA_LOG.info("SUB", "renderSubmissionStatus(week=" + (weekOverride||"current") + ")");
  var wrap = document.getElementById('submission-status-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<div style="padding:20px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>';
  gsr('getWeeklySubmissionStatus', State.user.id, State.user.role, weekOverride||'').then(function(res) {
    var rows = (res && res.data) || [];
    var week = weekOverride || (res && res.weekStartDate) || '\u2014';
    if (!rows.length) {
      wrap.innerHTML = '<div class="table-empty" style="padding:32px;text-align:center;">No VA connections found for this period.</div>';
      return;
    }
    var submitted   = rows.filter(function(r){ return r.notSubmittedCount === 0; }).length;
    var notSubmitted = rows.filter(function(r){ return r.notSubmittedCount > 0; }).length;
    var dtData = [];
    rows.forEach(function(va) {
      va.connections.forEach(function(conn) {
        dtData.push({
          VAName:     va.vaName,
          ClientName: conn.clientName,
          Department: conn.deptName   || '\u2014',
          Service:    conn.serviceName || '\u2014',
          Status:     conn.submitted ? 'Submitted' : 'Not Yet',
          _submitted: conn.submitted,
          _deptId:    conn.deptId  || '',
          _svcId:     conn.serviceId || ''
        });
      });
    });
    var summary = '<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">'
      + '<span class="badge badge-success">'+submitted+' Fully Submitted</span>'
      + '<span class="badge badge-warning">'+notSubmitted+' Pending / Partial</span>'
      + '<span style="font-size:12px;color:var(--text-muted);margin-left:auto;">Week of: '+week+'</span>'
      + '</div>';
    wrap.innerHTML = summary + '<div id="sub-status-dt"></div>';
    renderDataTable({
      containerId:  'sub-status-dt',
      defaultLimit: 10,
      limitOptions: [10, 25, 50, 100],
      emptyMessage: 'No submission records found.',
      data: dtData,
      columns: [
        { key:'VAName',     label:'Virtual Assistant', sortable:true, filterable:true },
        { key:'ClientName', label:'Client Account',    sortable:true, filterable:true },
        { key:'Department', label:'Department',        sortable:true, filterable:'select' },
        { key:'Service',    label:'Service',           sortable:true, filterable:'select' },
        { key:'Status',     label:'Status',            sortable:true, filterable:'select',
          render: function(v, row) {
            return row._submitted
              ? '<span class="badge badge-success" style="display:inline-flex;align-items:center;gap:4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>Submitted</span>'
              : '<span class="badge badge-warning">Not Yet</span>';
          }
        }
      ]
    });
  });
}

function renderTeams() {
  VAA_LOG && VAA_LOG.info("TEAMS", "renderTeams()");
Promise.all([gsr('getTeams'), gsr('getDepartments'), gsr('getVAConnectionUsers'), gsr('getServices',''), gsr('getUsersWithActiveConnections')]).then(function(results) {
var allTeams = (results[0]||{}).data || [];
var allDepts = (results[1]||{}).data || [];
var allUsers = (results[2]||{}).data || [];
var allSvcs  = (results[3]||{}).data || [];
var usersWithConns = {};
((results[4]||{}).data || []).forEach(function(uid){ usersWithConns[String(uid)] = true; });
window._teamsAllDepts = allDepts;
window._teamsAllUsers = allUsers;
window._teamsUsersWithConns = usersWithConns;
window._svcMapUser = {};
allSvcs.forEach(function(s){ window._svcMapUser[s.ServiceID] = s.ServiceName; });

var isAdmin   = State.user.role === 'Administrator';
var isManager = State.user.role === 'Manager';
var canEdit   = isAdmin || isManager;
var myDeptId  = (isManager && State.user.department) ? State.user.department : '';

// Managers only see their dept; Admins see all
var visibleDepts = myDeptId
  ? allDepts.filter(function(d){ return d.DeptID === myDeptId; })
  : allDepts;

var getDeptName = function(id){ return (allDepts.find(function(d){ return d.DeptID===id; })||{}).DeptName || id || '\u2014'; };
var getUserName = function(id){ return (allUsers.find(function(u){ return u.UserID===id; })||{}).Name || id || '\u2014'; };

// Group by dept
var grouped = {};
allTeams.forEach(function(t) {
  var key = t.DeptID || '__none__';
  if (!grouped[key]) grouped[key] = [];
  grouped[key].push(t);
});
Object.keys(grouped).forEach(function(k){
  grouped[k].sort(function(a,b){ return parseInt(a.TeamNumber||'0',10) - parseInt(b.TeamNumber||'0',10); });
});

var deptOrder = visibleDepts.map(function(d){ return d.DeptID; }).filter(function(id){ return grouped[id]; });
if (!myDeptId && grouped['__none__']) deptOrder.push('__none__');

var tabs = deptOrder.map(function(deptId, i) {
  var label = deptId === '__none__' ? 'No Dept' : getDeptName(deptId);
  var count = (grouped[deptId]||[]).length;
  return '<button class="tab'+(i===0?' active':'')+'" onclick="switchTeamTab(\''+deptId+'\',this)">'+label+' <span style="font-size:11px;opacity:0.7;">('+count+')</span></button>';
}).join('');

var panels = deptOrder.map(function(deptId, i) {
  var deptTeams = grouped[deptId] || [];
  var teamDtDataMap = teamDtDataMap || {};
  var _canEdit = canEdit;
  var _deptTeams = deptTeams;
  var _deptId = deptId;
  // Schedule DataTable render after DOM
  (function(dtId, teams, ce) {
    setTimeout(function() {
      var allUsersForCount = window._teamsAllUsers || [];
      var usersWithConns   = window._teamsUsersWithConns || {};
      var dtData = teams.map(function(t) {
        // Count members whose TeamID matches
        var memberIds = allUsersForCount.filter(function(u){
          return String(u.TeamID||'') === String(t.TeamID) &&
                 (u.IsActive===true || u.IsActive==='TRUE' || String(u.IsActive).toUpperCase()==='TRUE');
        }).map(function(u){ return String(u.UserID); });
        // Also count the team's leader(s) as members if they personally carry
        // VA connections — some Team Leaders also serve clients directly.
        [t.TeamLeaderUserID, t.TempLeader1UserID, t.TempLeader2UserID].forEach(function(lid){
          var lidStr = String(lid||'');
          if (lidStr && usersWithConns[lidStr] && memberIds.indexOf(lidStr) < 0) memberIds.push(lidStr);
        });
        var activeMemberCount = memberIds.length;
        return {
          TeamName:    t.TeamName    || '\u2014',
          TLName:      getUserName(t.TeamLeaderUserID),
          Tmp1:        t.TempLeader1UserID ? getUserName(t.TempLeader1UserID) : '\u2014',
          Tmp2:        t.TempLeader2UserID ? getUserName(t.TempLeader2UserID) : '\u2014',
          MemberCount: activeMemberCount,
          _teamId:     t.TeamID,
          _rawTeam:    t,
          _canEdit:    ce
        };
      });
      renderDataTable({
        containerId:  dtId,
        defaultLimit: 10,
        limitOptions: [10, 25, 50, 100],
        emptyMessage: 'No teams in this department.',
        data: dtData,
        columns: [
          { key:'TeamName',    label:'Team Name',       sortable:true, filterable:true,
            render: function(v){ return '<strong>'+v+'</strong>'; } },
          { key:'MemberCount', label:'Active Members',  sortable:true, filterable:false,
            render: function(v){ return '<span class="badge badge-info">'+v+'</span>'; } },
          { key:'TLName',      label:'Primary Leader',  sortable:true, filterable:true },
          { key:'Tmp1',        label:'Temp Leader 1',   sortable:true, filterable:false,
            render: function(v){ return '<span style="font-size:13px;color:var(--text-muted);">'+v+'</span>'; } },
          { key:'Tmp2',        label:'Temp Leader 2',   sortable:true, filterable:false,
            render: function(v){ return '<span style="font-size:13px;color:var(--text-muted);">'+v+'</span>'; } },
          { key:'_teamId',  label:'Actions',        sortable:false, filterable:false,
            render: function(v, row) {
              var t = row._rawTeam;
              var tSafe = JSON.stringify(t).replace(/"/g,'&quot;');
              return '<div style="display:flex;gap:6px;">'
                + '<button class="btn btn-secondary btn-sm" onclick="openTeamMembers(\''+v+'\')" title="Manage Members">'
                + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
                + ' Members</button>'
                + (row._canEdit ? '<button class="btn btn-icon" title="Edit" onclick="openEditTeam(\''+v+'\','+tSafe+')">'
                  + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
                  + '<button class="btn btn-icon" title="Delete" onclick="delTeam(\''+v+'\')">'
                  + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>'
                  : '')
                + '</div>';
            }
          }
        ]
      });
    }, 80);
  }('team-dt-'+deptId, deptTeams, canEdit));
  return '<div id="ttab-'+deptId+'" class="'+(i===0?'':'hidden')+'">'
    + (deptTeams.length === 0
      ? '<div style="padding:32px;text-align:center;color:var(--text-muted);">No teams in this department.</div>'
      : '<div class="card" style="padding:0;overflow:hidden;border-top:none;border-radius:0 0 var(--radius) var(--radius);"><div id="team-dt-'+deptId+'"></div></div>')
    + '</div>';
}).join('');

var noTeams = (myDeptId ? (grouped[myDeptId]||[]) : allTeams).length === 0;
var emptyState = noTeams
  ? '<div class="empty-state" style="padding:60px 20px;text-align:center;"><h3>No teams yet</h3><p>Click &ldquo;+ New Team&rdquo; to create your first team.</p></div>'
  : '<div class="tabs" id="team-dept-tabs" style="margin-bottom:0;">'+tabs+'</div><div id="team-panels">'+panels+'</div>';

set('page-content',
'<div class="section-header">'
+ '<span class="section-title">Team Management</span>'
+ (canEdit ? '<button class="btn btn-primary" onclick="openCreateTeam()">+ New Team</button>' : '')
+ '</div>'
+ emptyState);
}).catch(function(err) {
  console.error('[Teams load] FAILED:', err && err.message ? err.message : err);
  var pc = document.getElementById('page-content');
  if (pc) pc.innerHTML = '<div class="empty-state"><h3>Failed to load Team Management</h3><p style="color:var(--text-muted);font-size:12px;">'+(err && err.message ? err.message : 'Unknown error.')+'</p></div>';
});
}

function switchTeamTab(deptId, btn) {
document.querySelectorAll('#team-dept-tabs .tab').forEach(function(t){ t.classList.remove('active'); });
btn.classList.add('active');
document.querySelectorAll('#team-panels > div').forEach(function(p){ p.classList.add('hidden'); });
var active = document.getElementById('ttab-'+deptId);
if (active) active.classList.remove('hidden');
}


function teamForm(team, isEdit) {
team = team || {};
var allDepts = window._teamsAllDepts || [];
var allUsers = window._teamsAllUsers || [];
var isManager = State.user.role === 'Manager';
var myDeptId  = isManager ? (State.user.department || '') : '';
var curDept   = team.DeptID || myDeptId || '';

// Dept options \u2014 locked for Managers
var deptOpts = '<option value="">\u2014 Select \u2014</option>'
  + allDepts.map(function(d){
      return '<option value="'+d.DeptID+'"'+(d.DeptID===curDept?' selected':'')+'>'+d.DeptName+'</option>';
    }).join('');
var deptDisabled = (isManager && myDeptId) ? ' disabled' : '';

// TL/Manager options \u2014 includes both Team Leader and Manager roles
var leaderPool = allUsers.filter(function(u){ return u.Role==='Team Leader' || u.Role==='Manager'; });
function tlOpts(selectedId) {
  return '<option value="">\u2014 None \u2014</option>'
    + leaderPool.map(function(u){
        return '<option value="'+u.UserID+'" data-dept="'+(u.Department||'')+'"'+(u.UserID===selectedId?' selected':'')+'>'+u.Name+' ('+u.Role+')</option>';
      }).join('');
}

// Name preview
var namePreview = isEdit
  ? '<div class="form-group"><label class="form-label">Team Name</label>'
    + '<input class="form-control" value="'+(team.TeamName||'')+'" disabled style="opacity:0.6;">'
    + '<div class="form-hint">Auto-assigned \u2014 cannot be changed.</div></div>'
  : '<div class="form-group"><label class="form-label">Team Name</label>'
    + '<div class="form-control" id="tf-name-preview" style="opacity:0.6;background:var(--bg-elevated);">Auto-assigned after selecting department</div>'
    + '<div class="form-hint">Format: Team 01, Team 02... per department.</div></div>';

return namePreview
  + '<div class="form-group"><label class="form-label">Department *</label>'
  + '<select class="form-control" id="tf-dept" onchange="filterTeamTL()"'+deptDisabled+' required>'+deptOpts+'</select>'
  + (isManager && myDeptId ? '<div class="form-hint">Fixed to your department.</div>' : '')
  + '</div>'
  + '<div class="form-group"><label class="form-label">Primary Leader <span style="font-weight:400;color:var(--text-muted);">(Team Leader or Manager)</span></label>'
  + '<select class="form-control" id="tf-tl">'+tlOpts(team.TeamLeaderUserID)+'</select>'
  + '<div class="form-hint">Main leader for this team.</div></div>'
  + '<div class="form-row">'
  + '<div class="form-group"><label class="form-label">Temp Leader 1 <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>'
  + '<select class="form-control" id="tf-tl1">'+tlOpts(team.TempLeader1UserID)+'</select></div>'
  + '<div class="form-group"><label class="form-label">Temp Leader 2 <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>'
  + '<select class="form-control" id="tf-tl2">'+tlOpts(team.TempLeader2UserID)+'</select></div>'
  + '</div>'
  + '<div class="form-hint" style="margin-bottom:12px;">Temp leaders cover when primary leader is unavailable.</div>'
  + '<div class="form-group"><label class="form-label">Description</label>'
  + '<textarea class="form-control" id="tf-desc" rows="2">'+(team.Description||'')+'</textarea></div>';
}

function filterTeamTL() {
var deptId = (document.getElementById('tf-dept')||{}).value || '';
['tf-tl','tf-tl1','tf-tl2'].forEach(function(id) {
  var sel = document.getElementById(id);
  if (!sel) return;
  Array.from(sel.options).forEach(function(opt) {
    if (!opt.value) { opt.hidden = false; return; }
    opt.hidden = !!(deptId && opt.dataset.dept && opt.dataset.dept !== deptId);
  });
  if (sel.value && (sel.options[sel.selectedIndex]||{}).hidden) sel.value = '';
});
var preview = document.getElementById('tf-name-preview');
if (preview && deptId) {
  preview.textContent = 'Calculating...';
  gsr('getTeams').then(function(res) {
    var teams = (res&&res.data)||[];
    var nums = teams.filter(function(t){ return t.DeptID===deptId; })
      .map(function(t){ var n=parseInt(String(t.TeamNumber||'0').replace(/\D/g,''),10); return isNaN(n)?0:n; });
    var next = nums.length ? Math.max.apply(null,nums)+1 : 1;
    preview.textContent = 'Team ' + (next < 10 ? '0'+next : next);
  });
}
}

function teamFormData() {
return {
deptId:           (document.getElementById('tf-dept')||{}).value,
teamLeaderUserId: (document.getElementById('tf-tl')||{}).value,
tempLeader1UserId:(document.getElementById('tf-tl1')||{}).value,
tempLeader2UserId:(document.getElementById('tf-tl2')||{}).value,
description:      (document.getElementById('tf-desc')||{}).value
};
}

function openCreateTeam() {
openModal('New Team', '<form onsubmit="submitCreateTeam(event)">'+teamForm(null,false)+'<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="tf-create-btn">Create Team</button></div></form>');
setTimeout(filterTeamTL, 50);
}

function submitCreateTeam(e) {
e.preventDefault(); e.stopPropagation();
var btn = document.getElementById('tf-create-btn');
if (btn && btn.disabled) return;
if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }
gsr('createTeam', teamFormData(), State.user.id).then(res => {
toast(res.success ? 'Team created.' : res.message, res.success ? 'success' : 'error');
if (res.success) { closeModal(); renderTeams(); }
else if (btn) { btn.disabled = false; btn.textContent = 'Create Team'; }
});
}

function openEditTeam(id, team) {
openModal('Edit Team', '<form onsubmit="submitEditTeam(event,\''+id+'\')">' + teamForm(team,true) + '<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="tf-save-btn">Save Changes</button></div></form>');
setTimeout(filterTeamTL, 50);
}

function submitEditTeam(e, id) {
e.preventDefault(); e.stopPropagation();
var btn = document.getElementById('tf-save-btn');
if (btn && btn.disabled) return;
if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
gsr('updateTeam', id, teamFormData(), State.user.id).then(res => {
toast(res.success ? 'Team updated.' : res.message, res.success ? 'success' : 'error');
if (res.success) { closeModal(); renderTeams(); }
else if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
});
}

function delTeam(id) {
  if (!confirm('Delete this team? This action cannot be undone and all members will be unassigned.')) return;
  var pwd = prompt('Enter your password to confirm deletion:');
  if (!pwd) { toast('Deletion cancelled.', 'info'); return; }
  gsr('verifyPassword', State.user.id, pwd).then(function(res) {
    if (!res || !res.success) { toast('Incorrect password. Deletion cancelled.', 'error'); return; }
    gsr('deleteTeam', id, State.user.id).then(function(r) {
      toast(r.success ? 'Team deleted.' : r.message, r.success ? 'success' : 'error');
      if (r.success) renderTeams();
    });
  });
}

function openTeamDetail(teamId) {
var box = document.getElementById('modal-box');
if (box) box.className = 'modal-box modal-xl';
openModal('Team Composition', '<div style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>');
var allUsers = window._teamsAllUsers || [];
var allDepts = window._teamsAllDepts || [];

gsr('getTeams').then(function(teamsRes) {
  allTeams = (teamsRes&&teamsRes.data)||[];
  var team = allTeams.find(function(t){ return t.TeamID===teamId; }) || {};
  var getDeptName = function(id){ return (allDepts.find(function(d){ return d.DeptID===id; })||{}).DeptName || id || '\u2014'; };

      + '<div class="conn-detail-info-item"><span class="conn-detail-info-label">Primary Leader</span><span class="conn-detail-info-val">'+getUserName(team.TeamLeaderUserID)+'</span></div>'
      + (team.TempLeader1UserID ? '<div class="conn-detail-info-item"><span class="conn-detail-info-label">Temp Leader 1</span><span class="conn-detail-info-val" style="color:var(--warning);">'+getUserName(team.TempLeader1UserID)+'</span></div>' : '')
      + (team.TempLeader2UserID ? '<div class="conn-detail-info-item"><span class="conn-detail-info-label">Temp Leader 2</span><span class="conn-detail-info-val" style="color:var(--warning);">'+getUserName(team.TempLeader2UserID)+'</span></div>' : '')

function openTeamMembers(teamId) {
var box = document.getElementById('modal-box');
if (box) box.className = 'modal-box modal-960';
openModal('Manage Team Members', '<div style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>');
window._currentTeamId = teamId;
Promise.all([gsr('getTeamMembers', teamId), gsr('getVAConnectionUsers'), gsr('getTeams'), gsr('getUsersWithActiveConnections')]).then(function(results) {
var members  = (results[0]||{}).data || [];
var allUsers = (results[1]||{}).data || [];
var allTeams = (results[2]||{}).data || [];
var usersWithConns = {};
((results[3]||{}).data || []).forEach(function(uid){ usersWithConns[String(uid)] = true; });
var team     = allTeams.find(function(t){ return t.TeamID === teamId; }) || {};
// Surface the team's leader(s) as members too if they personally carry VA
// connections — they're not derived from Users.TeamID, so getTeamMembers
// wouldn't otherwise include them. Tag them so they render read-only below.
var memberUidSet = {}; members.forEach(function(m){ memberUidSet[String(m.UserID)] = true; });
[team.TeamLeaderUserID, team.TempLeader1UserID, team.TempLeader2UserID].forEach(function(lid){
  var lidStr = String(lid||'');
  if (!lidStr || memberUidSet[lidStr] || !usersWithConns[lidStr]) return;
  var lu = allUsers.find(function(u){ return String(u.UserID)===lidStr; });
  if (!lu) return;
  members.push({ UserID: lu.UserID, Name: lu.Name, Email: lu.Email, Role: lu.Role, _isLeader: true });
  memberUidSet[lidStr] = true;
});
window._currentTeamMembers  = members;
window._allTeamsForTransfer = allTeams;
var canEdit  = ['Administrator','Manager'].includes(State.user.role);
var memberIds = members.map(function(m){ return m.UserID; });
// Determine department scope for eligible VA filtering
var teamDeptId = team.DeptID || '';
var deptScope  = State.user.role === 'Administrator'
  ? teamDeptId                                            // Admin \u2192 team's dept
  : (State.user.department || teamDeptId);               // Manager \u2192 own dept

var eligible = allUsers.filter(function(u) {
  if (memberIds.indexOf(u.UserID) >= 0) return false;   // already a member
  if (u.Role !== 'Virtual Assistant') return false;      // VAs only \u2014 no TLs, no CS
  if (u.TeamID && String(u.TeamID).trim() !== '' &&
      String(u.TeamID) !== 'undefined') return false;   // already on a team
  if (!(u.IsActive===true||u.IsActive==='TRUE')) return false; // active VAs only
  if (deptScope && u.Department && String(u.Department) !== String(deptScope)) return false;
  return true;
});
window._teamEligible = eligible;
var body = document.getElementById('modal-body');
if (!body) return;

// ── Current members table ──────────────────────────────────
var memberRows = members.length === 0
  ? '<tr><td colspan="2" class="table-empty">No members assigned yet.</td></tr>'
  : members.map(function(m) {
      return '<tr id="mrow-' + m.UserID + '">'
        + '<td><strong>' + m.Name + '</strong>'
        + (m._isLeader ? ' <span class="badge badge-info" style="font-size:9px;">Team Leader \u2014 has clients</span>' : '')
        + '<div style="font-size:11px;color:var(--text-muted);">' + (m.Email||'\u2014') + '</div></td>'
        + '<td style="text-align:right;">'
        + (canEdit && !m._isLeader
          ? '<div style="display:flex;gap:4px;justify-content:flex-end;">'
            + '<button class="btn btn-secondary btn-sm" style="font-size:11px;" onclick="tmTransferQuick(\'' + m.UserID + '\',\'' + teamId + '\')" title="Transfer">Transfer</button>'
            + '<button class="btn btn-danger btn-sm" style="font-size:11px;" onclick="tmRemove(\'' + m.UserID + '\',\'' + teamId + '\')" title="Remove">Remove</button>'
            + '</div>'
          : (m._isLeader ? '<span style="font-size:11px;color:var(--text-muted);">Leads this team</span>' : ''))
        + '</td>'
        + '</tr>';
    }).join('');

// ── Add members table ──────────────────────────────────────
var eligibleRows = eligible.length === 0
  ? '<tr><td colspan="2" class="table-empty">All eligible users are already on this team.</td></tr>'
  : eligible.map(function(u) {
      return '<tr class="tm-add-row">'
        + '<td style="width:36px;text-align:center;">'
        + '<input type="checkbox" class="tm-check" value="' + u.UserID + '"'
        + ' style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;"'
        + ' onchange="tmUpdateCount()">'
        + '</td>'
        + '<td><strong>' + u.Name + '</strong>'
        + '<div style="font-size:11px;color:var(--text-muted);">' + (u.Department||'') + '</div></td>'
        + '</tr>';
    }).join('');
body.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">'

  // Left: current members
  + '<div>'
  + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
  + '<span style="font-size:13px;font-weight:700;">Current Members <span style="font-weight:400;color:var(--text-muted);">(' + members.length + ')</span></span>'
  + '</div>'
  + '<input type="text" placeholder="Search members..." oninput="tmFilterMembers(this.value)"'
  + ' class="form-control" style="margin-bottom:10px;font-size:13px;">'
  + '<div class="table-wrap" style="max-height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);">'
  + '<table id="tm-members-table">'
  + '<thead><tr><th>Name / Email</th><th style=\'text-align:right;\'></th></tr></thead>'
  + '<tbody id="tm-members-body">' + memberRows + '</tbody>'
  + '</table></div>'
  + '</div>'

  // Right: add members
  + '<div>'
  + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
  + '<span style="font-size:13px;font-weight:700;">Add Members <span style="font-weight:400;color:var(--text-muted);">(' + eligible.length + ' available)</span></span>'
  + (canEdit && eligible.length
    ? '<button class="btn btn-primary btn-sm" id="tm-add-btn" onclick="tmAddSelected(\'' + teamId + '\')" disabled>'
      + 'Add Selected (<span id="tm-count">0</span>)'
      + '</button>'
    : '')
  + '</div>'
  + '<div style="display:flex;gap:8px;margin-bottom:10px;">'

function tmAddSelected(teamId) {
var checked = Array.from(document.querySelectorAll('#tm-eligible-body .tm-check:checked')).map(function(cb){ return cb.value; });
if (!checked.length) return;
var btn = document.getElementById('tm-add-btn');
if (btn) { btn.disabled = true; btn.innerHTML = '<div class="inline-spinner" style="width:13px;height:13px;"></div> Adding...'; }
var added = 0, failed = 0;
function next(i) {
  if (i >= checked.length) {
    toast(added + ' member' + (added !== 1 ? 's' : '') + ' added.' + (failed ? ' ' + failed + ' failed.' : ''), added > 0 ? 'success' : 'error');
    openTeamMembers(teamId);
    return;
  }
  gsr('assignUserToTeam', checked[i], teamId, State.user.id).then(function(res) {
    if (res && res.success) added++; else failed++;
    next(i + 1);
  });
}
next(0);
}

function tmTransferQuick(userId, teamId) {
  // Quick transfer: show same modal as tmRemove but pre-selected to transfer
  var allTeams = window._allTeamsForTransfer || [];
  var currentTeam = allTeams.find(function(t){ return String(t.TeamID)===String(teamId); }) || {};
  var currentDeptId = String(currentTeam.DeptID||'');

        && (t.IsActive===true||t.IsActive==='TRUE'||String(t.IsActive).toUpperCase()==='TRUE')

  window._tmRemoveUserId = userId;
  window._tmRemoveTeamId = teamId;
  var teamOpts = '<option value="">-- Select target team --</option>'
    + sameDeptTeams.map(function(t){ return '<option value="'+t.TeamID+'">Team '+String(t.TeamNumber||t.TeamName).padStart(2,'0')+' — '+t.TeamName+'</option>'; }).join('');

function _tmTransferConfirm() {
  var sel = document.getElementById('tm-transfer-sel');
  var targetTeam = sel ? sel.value : '';
  if (!targetTeam) { toast('Please select a target team.','warning'); return; }
  var userId = window._tmRemoveUserId;
  var teamId = window._tmRemoveTeamId;
  closeModal();
  gsr('transferTeamMember', userId, teamId, targetTeam, State.user.id).then(function(res){
    toast(res&&res.success ? 'Member transferred successfully.' : (res&&res.message||'Transfer failed.'),
          res&&res.success ? 'success' : 'error');
    if (res&&res.success) openTeamMembers(teamId);
  });

function tmRemove(userId, teamId) {
  window._tmRemoveUserId = userId;
  window._tmRemoveTeamId = teamId;
  var members = window._currentTeamMembers || [];
  var member  = members.find(function(m){ return String(m.UserID)===String(userId); });
  var name    = member ? ((member.FirstName||'')+' '+(member.LastName||'')).trim() || member.Name || 'this member' : 'this member';
  // Build team transfer options
  var allTeams = window._allTeamsForTransfer || [];
  var teamOpts = '<option value="">-- Remove only --</option>'
    + allTeams.filter(function(t){ return String(t.TeamID) !== String(teamId) && t.IsActive; })
        .map(function(t){ return '<option value="'+t.TeamID+'">'+t.TeamName+'</option>'; }).join('');
  openModal('Remove Team Member',
    '<div style="padding:4px 0 16px;">'
    +'<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Remove <strong>'+name+'</strong> from this team?</p>'
    +'<div class="form-group" style="margin-bottom:20px;">'
    +'<label class="form-label" style="font-size:12px;">Transfer to another team (optional)</label>'
    +'<select class="form-control" id="tm-transfer-sel" style="font-size:12px;">'
    +teamOpts+'</select>'
    +'<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Leave blank to simply unassign this VA from all teams.</div>'
    +'</div>'
    +'<div class="form-actions">'
    +'<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'

function _tmRemoveConfirm(userId, teamId) {
  var sel       = document.getElementById('tm-transfer-sel');
  var targetTeam = sel ? sel.value : '';
  closeModal();
  if (targetTeam) {
    // Transfer: remove from current team then add to target
    gsr('removeUserFromTeam', userId, State.user.id).then(function(res){
      if (!res||!res.success){ toast(res&&res.message||'Removal failed.','error'); return; }
      gsr('addUserToTeam', userId, targetTeam, State.user.id).then(function(r2){
        toast(r2&&r2.success ? 'Transferred successfully.' : (r2&&r2.message||'Transfer failed.'), r2&&r2.success?'success':'error');
        openTeamMembers(teamId);
      });
    });
  } else {
    gsr('removeUserFromTeam', userId, State.user.id).then(function(res){
      toast(res&&res.success ? 'Member removed.' : (res&&res.message||'Failed.'), res&&res.success?'success':'error');
      if (res&&res.success) openTeamMembers(teamId);
    });
  }
}

function addToTeam(teamId) { tmAddSelected(teamId); }
function removeFromTeam(userId, teamId) { tmRemove(userId, teamId); }





function gsr(fn, ...args) {
  var _t0 = Date.now();
  if (typeof VAA_LOG !== 'undefined') {
    VAA_LOG.debug('GAS', '\u2192 ' + fn);
  }
  return new Promise(function(resolve) {
    google.script.run
      .withSuccessHandler(function(res) {
        var dt = Date.now() - _t0;
        if (typeof VAA_LOG !== 'undefined') {
          if (res && res.success === false) {
            VAA_LOG.warn('GAS', '\u2190 ' + fn + ' FAIL (' + dt + 'ms): ' + (res.message || 'no msg'));
          } else {
            VAA_LOG.debug('GAS', '\u2190 ' + fn + ' OK (' + dt + 'ms)');
          }
        }
        resolve(res || { success: true });
      })
      .withFailureHandler(function(err) {
        var dt = Date.now() - _t0;
        if (typeof VAA_LOG !== 'undefined') VAA_LOG.error('GAS', '\u2190 ' + fn + ' EXCEPTION (' + dt + 'ms)', err);
        resolve({ success: false, message: err ? err.message : 'Unknown error' });
      })
      [fn](...args);
  });
}

// Shared period-key formatter for chart x-axis labels and tooltips.
// Backend period keys come in two shapes depending on mode:
//   Weekly:  "YYYY-MM-DD" (10 chars, Monday of the week)
//   Monthly: "YYYY-MM"    (7 chars)
// Detecting by shape (rather than trusting a separately-passed "period" flag)
// keeps this correct even if a chart mixes cached weekly + fresh monthly data mid-transition.
function _fmtTrendPeriodLabel(weekKey) {
  var wk = String(weekKey||'');
  var months = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (/^\d{4}-\d{2}$/.test(wk)) {
    // Monthly key: "YYYY-MM" -> "Jun '26"
    var mp = wk.split('-');
    return (months[parseInt(mp[1],10)]||wk) + " '" + mp[0].slice(2);
  }
  // Weekly key: "YYYY-MM-DD" -> "Jun 15"
  var raw = wk.slice(5); // MM-DD
  var parts = raw.split('-');
  return (parts.length===2) ? months[parseInt(parts[0],10)]+' '+parseInt(parts[1],10) : raw;
}

// Fuller version for tooltips: "June 2026" (monthly) or "Jun 15, 2026" (weekly)
function _fmtTrendTooltipLabel(weekKey) {
  var wk = String(weekKey||'');
  var months = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (/^\d{4}-\d{2}$/.test(wk)) {
    var mp = wk.split('-');
    var d = new Date(parseInt(mp[0],10), parseInt(mp[1],10)-1, 1);
    return d.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  }
  var wParts = wk.split('-');
  return wParts.length===3 ? months[parseInt(wParts[1],10)]+' '+parseInt(wParts[2],10)+', '+wParts[0] : wk;
}

function renderTrendChart(trend) {
  if (!trend || !trend.length) return '<div class="table-empty">No trend data available.</div>';
  trend = trend.map(function(t) {
    return {
      week:     t.week     || '',
      onTarget: isNaN(Number(t.onTarget)) ? 0 : (Number(t.onTarget)||0),
      atRisk:   isNaN(Number(t.atRisk))   ? 0 : (Number(t.atRisk)  ||0),
      critical: isNaN(Number(t.critical)) ? 0 : (Number(t.critical)||0),
      noData:   isNaN(Number(t.noData))   ? 0 : (Number(t.noData)  ||0),
      total:    isNaN(Number(t.total))    ? 0 : (Number(t.total)   ||0)
    };
  });
  // Guard against NaN values
  trend = trend.map(function(t) {
    return {
      week:     t.week     || '',
      onTarget: isNaN(t.onTarget) ? 0 : (t.onTarget||0),
      atRisk:   isNaN(t.atRisk)   ? 0 : (t.atRisk||0),
      critical: isNaN(t.critical) ? 0 : (t.critical||0),
      noData:   isNaN(t.noData)   ? 0 : (t.noData||0),
      total:    isNaN(t.total)    ? 0 : (t.total ||0) || (t.onTarget+t.atRisk+t.critical+t.noData)
    };
  });

  var uid = 'tc-' + Date.now();
  var W = 520, H = 200, PL = 38, PR = 20, PT = 16, PB = 32;
  var cW = W - PL - PR, cH = H - PT - PB;
  var n  = trend.length;

  // Compute max across all three series
  var maxVal = 1;
  trend.forEach(function(t){
    maxVal = Math.max(maxVal, (t.onTarget||0)+(t.atRisk||0)+(t.critical||0), t.onTarget||0, t.atRisk||0, t.critical||0);
  });
  maxVal = Math.ceil(maxVal * 1.12); // 12% headroom

  function cx(i) { return PL + (n > 1 ? (i / (n-1)) * cW : cW/2); }
  function cy(v) { return PT + cH - (v / maxVal) * cH; }

  // Smooth bezier path
  function smoothPath(key) {
    if (n === 1) return 'M '+cx(0)+' '+cy(trend[0][key]||0);
    var pts = trend.map(function(t,i){ return {x:cx(i), y:cy(t[key]||0)}; });
    var d = 'M '+pts[0].x+' '+pts[0].y;
    for (var i=1; i<pts.length; i++) {
      var cp1x = pts[i-1].x + (pts[i].x - pts[i-1].x)*0.4;
      var cp1y = pts[i-1].y;
      var cp2x = pts[i].x   - (pts[i].x - pts[i-1].x)*0.4;
      var cp2y = pts[i].y;
      d += ' C '+cp1x+' '+cp1y+','+cp2x+' '+cp2y+','+pts[i].x+' '+pts[i].y;
    }
    return d;
  }

  function filledArea(key, color, gradId) {
    var pathD = smoothPath(key);
    var baseline = cy(0);
    return '<defs><linearGradient id="'+gradId+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.18"/>'
      + '<stop offset="100%" stop-color="'+color+'" stop-opacity="0.01"/>'
      + '</linearGradient></defs>'
      + '<path d="'+pathD+' L '+cx(n-1)+' '+baseline+' L '+cx(0)+' '+baseline+' Z" fill="url(#'+gradId+')" stroke="none"/>'
      + '<path d="'+pathD+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  }

  // Grid
  var grid = '';
  var gridCount = 4;
  for (var g=0; g<=gridCount; g++) {
    var gy = PT + (g/gridCount)*cH;
    var gv = Math.round(maxVal*(1-g/gridCount));
    grid += '<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>'
          + '<text x="'+(PL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="#9ca3af">'+gv+'</text>';
  }

  // X labels (every week, or every month when period keys are "YYYY-MM")
  var xLabels = trend.map(function(t,i){
    var label = _fmtTrendPeriodLabel(t.week);
    return '<text x="'+cx(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="#9ca3af">'+label+'</text>';
  }).join('');

  // Invisible hover zones + data attributes for JS tooltip
  var hoverZones = trend.map(function(t,i){
    var zoneW = cW / Math.max(n-1,1);
    var zx = i===0 ? PL : cx(i) - zoneW/2;
    if (i===n-1) zx = cx(i) - zoneW/2;
    return '<rect x="'+zx+'" y="'+PT+'" width="'+(i===0||i===n-1?zoneW/2:zoneW)+'" height="'+cH+'"'
      + ' fill="transparent" data-idx="'+i+'"'
      + ' data-week="'+t.week+'" data-on="'+(t.onTarget||0)+'" data-risk="'+(t.atRisk||0)+'" data-crit="'+(t.critical||0)+'"'
      + ' data-nodata="'+(t.noData||0)+'" data-total="'+(t.total||0)+'"'
      + ' onmousemove="trendHover(event,\''+uid+'\')" onmouseleave="trendLeave(\''+uid+'\')" style="cursor:crosshair"/>';
  }).join('');

  // Crosshair elements (hidden initially)
  var crosshair = '<line id="'+uid+'-vline" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+cH)+'" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" opacity="0" pointer-events="none"/>';

  // Highlight dots (hidden initially)
  var hlDots = [
    {key:'on',  color:'#22c55e'},
    {key:'risk',color:'#f59e0b'},
    {key:'crit',color:'#ef4444'}
  ].map(function(s){
    return '<circle id="'+uid+'-dot-'+s.key+'" cx="0" cy="0" r="5" fill="'+s.color+'" stroke="white" stroke-width="2" opacity="0" pointer-events="none"/>';
  }).join('');

  var svg = '<svg id="'+uid+'" viewBox="0 0 '+W+' '+H+'" width="100%" style="overflow:visible;display:block;">'
    + grid
    + filledArea('onTarget', '#22c55e', uid+'-g1')
    + filledArea('atRisk',   '#f59e0b', uid+'-g2')
    + filledArea('critical', '#ef4444', uid+'-g3')
    + xLabels
    + crosshair
    + hlDots
    + hoverZones
    + '</svg>';

  // Tooltip div
  var tooltip = '<div id="'+uid+'-tip" style="display:none;position:absolute;background:white;border:1px solid #e5e7eb;border-radius:10px;padding:6px 10px;font-size:10px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;min-width:120px;z-index:9999;">'
    + '<div id="'+uid+'-tw" style="font-weight:700;color:#111;margin-bottom:8px;"></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="width:3px;height:16px;background:#22c55e;border-radius:2px;display:inline-block;"></span>'
    + '<span style="color:#374151;">On Target</span><span id="'+uid+'-v1" style="font-weight:700;margin-left:auto;color:#22c55e;"></span><span id="'+uid+'-p1" style="font-size:11px;color:#22c55e;margin-left:4px;"></span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="width:3px;height:16px;background:#f59e0b;border-radius:2px;display:inline-block;"></span>'
    + '<span style="color:#374151;">At Risk</span><span id="'+uid+'-v2" style="font-weight:700;margin-left:auto;color:#f59e0b;"></span><span id="'+uid+'-p2" style="font-size:11px;color:#f59e0b;margin-left:4px;"></span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;"><span style="width:3px;height:16px;background:#ef4444;border-radius:2px;display:inline-block;"></span>'
    + '<span style="color:#374151;">Critical</span><span id="'+uid+'-v3" style="font-weight:700;margin-left:auto;color:#ef4444;"></span><span id="'+uid+'-p3" style="font-size:11px;color:#ef4444;margin-left:4px;"></span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;"><span style="width:3px;height:16px;background:#9ca3af;border-radius:2px;display:inline-block;"></span>'
    + '<span style="color:#374151;">No Data</span><span id="'+uid+'-vnd" style="font-weight:700;margin-left:auto;color:#6b7280;"></span><span id="'+uid+'-pnd" style="font-size:11px;color:#6b7280;margin-left:4px;"></span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f6;">'
    + '<span style="color:#6b7280;font-size:11px;">Total</span>'
    + '<span id="'+uid+'-vtot" style="font-weight:700;margin-left:auto;font-size:11px;color:#374151;"></span>'
    + '</div>'
    + '</div>';

  var legend = '<div style="display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;">'
    + ['#22c55e:On Target','#f59e0b:At Risk','#ef4444:Critical'].map(function(s){
        var p=s.split(':');
        return '<span style="display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7280;">'
          + '<span style="width:24px;height:3px;background:'+p[0]+';border-radius:2px;display:inline-block;"></span>'+p[1]+'</span>';
      }).join('')
    + '</div>';

  return '<div class="trend-chart-outer" style="position:relative;padding:4px 0 0 0;overflow:visible;">' + svg + tooltip + legend + '</div>';
}

function trendHover(evt, uid) {
  var rect = evt.currentTarget.getBoundingClientRect();
  var svgEl = document.getElementById(uid);
  var tip   = document.getElementById(uid+'-tip');
  if (!svgEl || !tip) return;
  var d = evt.currentTarget;
  var idx  = parseInt(d.getAttribute('data-idx'));
  var week = d.getAttribute('data-week');
  var on   = d.getAttribute('data-on');
  var risk = d.getAttribute('data-risk');
  var crit = d.getAttribute('data-crit');
  var noData = d.getAttribute('data-nodata') || '0';
  // Format week/month label
  var wLabel = _fmtTrendTooltipLabel(week);
  var total = parseInt(d.getAttribute('data-total') || 0) || (parseInt(on)+parseInt(risk)+parseInt(crit)+parseInt(noData));
  var pct = function(v){ return total > 0 ? '(' + Math.round((parseInt(v)/total)*100) + '%)' : ''; };
  document.getElementById(uid+'-tw').textContent = wLabel;
  document.getElementById(uid+'-v1').textContent = on;
  document.getElementById(uid+'-v2').textContent = risk;
  document.getElementById(uid+'-v3').textContent = crit;
  var p1 = document.getElementById(uid+'-p1'); if (p1) p1.textContent = pct(on);
  var p2 = document.getElementById(uid+'-p2'); if (p2) p2.textContent = pct(risk);
  var p3 = document.getElementById(uid+'-p3'); if (p3) p3.textContent = pct(crit);
  var vnd = document.getElementById(uid+'-vnd'); if (vnd) vnd.textContent = noData;
  var pnd = document.getElementById(uid+'-pnd'); if (pnd) pnd.textContent = pct(noData);
  var vt = document.getElementById(uid+'-vtot'); if (vt) vt.textContent = total + ' connections';
  // Position tooltip relative to card
  var svgRect = svgEl.getBoundingClientRect();
  var relX = evt.clientX - svgRect.left;
  var relY = evt.clientY - svgRect.top;
  tip.style.display = 'block';
  // Position relative to the chart wrapper (position:absolute)
  // Use the SVG bounding rect to get mouse position inside the chart card
  var mouseX = evt.clientX - svgRect.left;
  var mouseY = evt.clientY - svgRect.top;
  var tipW   = 165;
  var svgW2  = svgRect.width || 520;
  // Flip to left side if near right edge of the SVG
  if (mouseX + tipW + 20 > svgW2) {
    tip.style.left = 'auto';
    tip.style.right = (svgW2 - mouseX + 8) + 'px';
  } else {
    tip.style.left  = (mouseX + 14) + 'px';
    tip.style.right = 'auto';
  }
  tip.style.top = Math.max(0, mouseY - 24) + 'px';
  // Crosshair + dots use SVG coordinate from data-idx
  // Re-derive cx/cy from the SVG viewBox
  var vb = (svgEl.getAttribute('viewBox')||'').split(' ');
  var VW = parseFloat(vb[2]||520), VH = parseFloat(vb[3]||200);
  var svgW = svgEl.clientWidth || 520;
  var scale = svgW / VW;
  // Count total hover zones to get n
  var zones = svgEl.querySelectorAll('rect[data-idx]');
  var n2 = zones.length;
  var PL2=38, PR2=20, PT2=16, PB2=32;
  var cW2 = VW-PL2-PR2, cH2 = VH-PT2-PB2;
  var xCoord = PL2 + (n2>1 ? idx/(n2-1)*cW2 : cW2/2);
  var vline = document.getElementById(uid+'-vline');
  if (vline) { vline.setAttribute('x1',xCoord); vline.setAttribute('x2',xCoord); vline.setAttribute('opacity','1'); }
  // Dots \u2014 need actual y values; stored in data attrs
  var maxV = 1;
  zones.forEach(function(z){ maxV = Math.max(maxV, parseInt(z.getAttribute('data-on')||0)+parseInt(z.getAttribute('data-risk')||0)+parseInt(z.getAttribute('data-crit')||0), parseInt(z.getAttribute('data-on')||0), parseInt(z.getAttribute('data-risk')||0), parseInt(z.getAttribute('data-crit')||0)); });
  maxV = Math.ceil(maxV*1.12);
  function cyC(v){ return PT2 + cH2 - (v/maxV)*cH2; }
  [['on','#22c55e'],['risk','#f59e0b'],['crit','#ef4444']].forEach(function(s){
    var dot = document.getElementById(uid+'-dot-'+s[0]);
    var key = 'data-'+s[0];
    var val = parseInt(d.getAttribute(key)||0);
    if (dot) { dot.setAttribute('cx',xCoord); dot.setAttribute('cy',cyC(val)); dot.setAttribute('fill',s[1]); dot.setAttribute('opacity','1'); }
  });
}
function trendLeave(uid) {
  var tip   = document.getElementById(uid+'-tip');
  var vline = document.getElementById(uid+'-vline');
  if (tip)   tip.style.display = 'none';
  if (vline) vline.setAttribute('opacity','0');
  ['on','risk','crit'].forEach(function(k){
    var dot = document.getElementById(uid+'-dot-'+k);
    if (dot) dot.setAttribute('opacity','0');
  });
}

function renderMiniDonut(p) {
var total = p.total || 0;
if (!total) return '<div class="empty-state"><h3>No data yet</h3></div>';
var onT = (p.onTarget||[]).length, atR = (p.atRisk||[]).length, crit = (p.critical||[]).length;
return `<div style="display:flex;align-items:center;gap:24px;padding:12px 0">
<div style="display:flex;flex-direction:column;gap:12px;flex:1">
${[['On Target',onT,'var(--on-target)'],['At Risk',atR,'var(--at-risk)'],['Critical',crit,'var(--critical)'],['No Data',(p.noData||[]).length,'var(--border)']].map(([l,v,c]) =>
`<div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--text-secondary)">${l}</span><strong style="color:${c}">${v}</strong></div>
<div class="perf-bar"><div style="width:${total?Math.round(v/total*100):0}%;height:100%;background:${c};border-radius:3px;transition:width 0.5s"></div></div></div>`
).join('')}
</div>
</div>`;
}

function _fmtDuration(days) {
  var d = days || 0;
  var yrs = Math.floor(d / 365);
  var mos = Math.floor((d % 365) / 30);
  if (yrs > 0 && mos > 0) return yrs + ' YR ' + mos + ' MO' + (mos !== 1 ? 's' : '');
  if (yrs > 0)             return yrs + ' YR' + (yrs !== 1 ? 's' : '');
  return mos + ' MO' + (mos !== 1 ? 's' : '');
}

function renderLongRunningTable(data, uMap, fullId) {
  var um = uMap || window._adminUMap || {};
  if (!data || !data.length) return '<div class="table-empty">No long-running connections found.</div>';
  var id = fullId ? ' id="lr-full-table"' : '';
  var rows = data.map(function(conn) {
    var va       = um[conn.VAUserID] || conn.VAName || conn.VAUserID || '\u2014';
    var duration = _fmtDuration(conn.daysActive);
    return '<tr>'
      + '<td><strong>'+(conn.ClientName||'\u2014')+'</strong>'
      + (conn.SecondaryName ? '<div style="font-size:11px;color:var(--text-muted);">'+conn.SecondaryName+'</div>' : '')
      + '</td>'
      + '<td style="font-size:12px;color:var(--text-secondary);">'+va+'</td>'
      + '<td><span class="badge badge-warning">'+duration+'</span></td>'
      + '</tr>';
  }).join('');
  return '<div class="table-wrap"><table'+id+'>'
    + '<thead><tr><th>Client</th><th>VA</th><th>Duration</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table></div>';
}

function renderPerfStatusTable(p, userMap, week, paginate) {
var uMap = userMap || window._perfUserMap || {};
var wk = week || window._analyticsWeek || '';
var all = [...(p.critical||[]),...(p.atRisk||[]),...(p.onTarget||[]),...(p.noData||[])];
if (!all.length) return '<div class="table-empty">No connection data this week.</div>';
var lim = paginate ? (window._statusLimit||10) : 100;
var rows = all.map(function(conn, idx){
  var status = (p.critical||[]).indexOf(conn)>=0?'Critical':(p.atRisk||[]).indexOf(conn)>=0?'At Risk':(p.onTarget||[]).indexOf(conn)>=0?'On Target':'No Data';
  var vaId = String(conn.VAUserID||'');
  var vaName = uMap[vaId] || vaId || '\u2014';
  var connId = conn.ConnectionID || '';
  return '<tr style="cursor:pointer;'+(paginate && idx>=lim?'display:none;':'')+'" onclick="openConnWeekDetail(\'' + connId.replace(/'/g,"") + '\',\'' + wk + '\')">'
    +'<td><strong>'+(conn.ClientName||'\u2014')+'</strong>'+(conn.SecondaryName?'<div style="font-size:11px;color:var(--text-muted);">'+conn.SecondaryName+'</div>':'')+'</td>'
    +'<td style="font-size:12px;color:var(--text-secondary);">'+vaName+'</td>'

}).join('');
var tbodyId = paginate ? ' id="status-breakdown-tbody"' : '';
return '<div class="table-wrap"><table>'
  +'<thead><tr><th>Client</th><th>VA</th><th>Status</th><th>Flag</th></tr></thead>'
  +'<tbody'+tbodyId+'>'+rows+'</tbody></table></div>';
}

function openConnWeekDetail(connId, weekStartDate) {

      +'    <div style="font-weight:800;font-size:18px;color:var(--text);">'+client+'</div>'
      +(secondary?'    <div style="font-size:12px;color:var(--text-muted);">'+secondary+'</div>':'')+
      '  </div>'

      +'    <span class="badge '+sBadgeCls+'" style="font-size:11px;">'+connStatus+'</span>'

      +'  </div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:16px;">'
      +_lbl('Connection ID', String(connId||'').slice(0,12))

      +'</div>'
      +'</div>';

    // ── KPI table ──

        + '<div class="table-wrap"><table>'
        + '<thead><tr><th>KPI</th><th>Unit</th><th>'+(isMonthly?'Monthly':'Weekly')+' Target</th><th>Actual</th><th>Status</th></tr></thead>'
        + '<tbody>'
        + (appKPIs.length
            ? appKPIs.map(function(k){
                return '<tr>'
                  +'<td><strong>'+(k.KPIName||'\u2014')+'</strong></td>'
                  +'<td><span class="pill">'+(k.Unit||'\u2014')+'</span></td>'
                  +'<td>'
                  +(k.WeeklyTarget ? '<span style="font-weight:600;">'+k.WeeklyTarget+'</span>'
                    +(k.DefaultWeeklyTarget && String(k.DefaultWeeklyTarget)!==String(k.WeeklyTarget)
                      ? '<div style="font-size:10px;color:var(--text-muted);">Benchmark: '+k.DefaultWeeklyTarget+'</div>'
                      : '')
                    : '\u2014')
                  +'</td>'
                  +'<td style="color:var(--text-muted);">\u2014</td>'
                  +'<td><span class="badge badge-muted">No Data</span></td>'

              }).join('')
            : '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No KPIs configured.</td></tr>')
        + '</tbody></table></div>';
    } else {
      var STATUS_ORDER = {'Critical':0,'At Risk':1,'On Target':2,'No Data':3,'':4};
      var sortedRows = rows.slice().sort(function(a,b){
        var sa = a.noData ? 3 : (STATUS_ORDER[a.status]!==undefined ? STATUS_ORDER[a.status] : 4);
        var sb = b.noData ? 3 : (STATUS_ORDER[b.status]!==undefined ? STATUS_ORDER[b.status] : 4);
        return sa - sb;
      });
      var kpiRowsHtml = sortedRows.map(function(r) {
        var sBadge = r.status==='Critical'?'badge-danger':r.status==='At Risk'?'badge-warning':r.status==='On Target'?'badge-success':'badge-muted';
        var _dir = String(r.direction||'').toLowerCase();
        var _dirArrow = _dir.indexOf('higher')>=0||_dir==='asc'||_dir==='up'

        }

        var cfgTgt  = r.configTarget || '';
        var mstTgt  = r.masterTarget || '';

        + '<tbody>'+kpiRowsHtml+'</tbody></table></div>';
    }

    // ── Side panel: Add Note / Log Intervention + existing interventions ──

    window._cwdRefreshConnId = connId;
    window._cwdRefreshWeek   = week;

      ? intvs.slice().reverse().map(function(iv){
          var _editBtn = (_cwdCanAct && iv.InterventionID)
            ? '<button class="btn btn-secondary btn-sm" style="font-size:10px;padding:1px 7px;" onclick="openEditIntervention(\''+iv.InterventionID+'\')">Edit</button>'

    body.innerHTML =
      '<div style="display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start;">'
      +'<div>'+infoBar+kpiSection+'</div>'
      +'<div>'+sidePanel+'</div>'

    var vcb = document.getElementById('view-conn-btn');
    if (vcb) { vcb.addEventListener('click', function(){
      var cid = connId;
      closeModal();
      setTimeout(function(){ if (typeof connOpenDetail==='function') connOpenDetail(cid); }, 80);
    }); }
  }).catch(function(err) {
    console.error('[openConnWeekDetail] FAILED:', err && err.message ? err.message : err, err && err.stack);

function _cwdSaveIntervention(connId) {
  var typeEl   = document.getElementById('cwd-intv-type');
  var descEl   = document.getElementById('cwd-intv-desc');
  var actionEl = document.getElementById('cwd-intv-action');
  var btn      = document.getElementById('cwd-intv-save-btn');
  var desc = descEl ? descEl.value.trim() : '';
  if (!desc) { toast('Please enter a description.','warning'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  var data = {
    connectionId: connId,
    type:         typeEl ? typeEl.value : 'Other',
    description:  desc,
    actionTaken:  actionEl ? actionEl.value.trim() : ''
  };
  gsr('createIntervention', data, State.user.id).then(function(res) {
    if (res && res.success) {
      toast('Intervention logged.','success');
      // Update intervention set + refresh modal in place
      window._connInterventionSet = window._connInterventionSet || {};
      window._connInterventionSet[connId] = true;
      openConnWeekDetail(connId, window._curIntvWeek || (window._analyticsWeek||getMondayStr(new Date())));
    } else {
      toast(res&&res.message||'Failed to save.','error');
      if (btn) { btn.disabled = false; btn.textContent = 'Save Intervention'; }
    }
  });
}

function statusBadge(status) {
var map = { 'On Target':'badge-success', 'Active':'badge-success', 'At Risk':'badge-warning', 'Critical':'badge-danger', 'Inactive':'badge-muted', 'Flagged':'badge-warning' };
return map[status] || 'badge-muted';
}

function formatDate(d) {
if (!d) return '\u2014';
try { return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
catch(e) { return String(d).slice(0,10); }
}

function getMondayStr(date) {
var d = new Date(date);
var day = d.getDay();
d.setDate(d.getDate() - day + (day===0?-6:1));
return d.toISOString().split('T')[0];
}

function openModal(title, body, sizeClass) {
document.getElementById('modal-title').textContent = title;
document.getElementById('modal-body').innerHTML = body;
var box = document.getElementById('modal-box');
box.className = 'modal-box ' + (sizeClass||'');
var overlay = document.getElementById('modal-overlay');
overlay.classList.remove('hidden');
overlay.style.display = 'flex';
}
function closeModal() {
var overlay = document.getElementById('modal-overlay');
overlay.style.display = 'none';
overlay.classList.add('hidden');
}

function toast(msg, type) {
type = type || 'info';
var cfg = {
success: { color:'var(--success)', icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>', label:'Success' },
error:   { color:'var(--danger)',  icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>', label:'Error' },
warning: { color:'var(--warning)', icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>', label:'Warning' },
info:    { color:'var(--info)',    icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>', label:'Info' }
};
var c = cfg[type] || cfg.info;
var el = document.createElement('div');
el.className = `toast ${type}`;
el.style.cssText = 'position:relative;overflow:hidden;';
el.innerHTML = `
<span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:${c.color}22;color:${c.color};flex-shrink:0;">${c.icon}</span>
<div style="flex:1;min-width:0;">
<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${c.color};margin-bottom:2px;">${c.label}</div>
<div style="font-size:13px;color:var(--text-primary);line-height:1.4;">${msg}</div>
</div>
<button onclick="this.closest('.toast').remove()" style="flex-shrink:0;color:var(--text-muted);padding:2px 4px;border-radius:4px;font-size:16px;line-height:1;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'">&times;</button>
<div style="position:absolute;bottom:0;left:0;height:2px;background:${c.color};opacity:0.4;animation:toast-bar 3.5s linear forwards;"></div>
`;
if (!document.getElementById('toast-bar-style')) {
var s = document.createElement('style'); s.id='toast-bar-style';
s.textContent = '@keyframes toast-bar{from{width:100%}to{width:0%}}';
document.head.appendChild(s);
}
document.getElementById('toast-container').appendChild(el);
setTimeout(() => { el.style.transition='opacity 0.3s,transform 0.3s'; el.style.opacity='0'; el.style.transform='translateX(12px)'; setTimeout(()=>el.remove(),300); }, 3500);
}
window.renderTeams         = renderTeams;
window.renderInterventions = renderInterventions;
window.renderAnalytics     = renderAnalytics;
window.renderSysSettings   = renderSysSettings;


// ── Wire global period listeners for Settings modules ─────────────────────
(function() {
  if (!window._gpListeners) window._gpListeners = {};

  // Performance Analytics
  window._gpListeners['analytics'] = function() {
    var gp = window._globalPeriod || {};
    if (gp.period)    window._perfPeriod    = gp.period;
    if (gp.periodKey) window._analyticsWeek = gp.periodKey;
    if (typeof renderAnalytics === 'function') renderAnalytics();
  };

  // Reports
  window._gpListeners['reports'] = function() {
    var gp = window._globalPeriod || {};
    if (gp.period)    window._rptPeriod = gp.period;
    if (gp.periodKey) window._analyticsWeek = gp.periodKey;
    if (typeof renderReports === 'function') renderReports();
  };

  // Lifetime Value
  window._gpListeners['lifetime'] = function() {
    var gp = window._globalPeriod || {};
    if (gp.period)    window._ltPeriod = gp.period;
    if (gp.periodKey) window._ltDate   = gp.periodKey;
    if (typeof renderLifetimeReport === 'function') renderLifetimeReport();
  };

  // Customer Overview
  window._gpListeners['customer-overview'] = function() {
    var gp = window._globalPeriod || {};
    if (gp.period)    window._coPeriod = gp.period;
    if (gp.periodKey) window._coDate   = gp.periodKey;
    if (typeof renderCustomerOverview === 'function') renderCustomerOverview();
  };
})();
</script>
