<script>
function renderDepartments() {
  VAA_LOG && VAA_LOG.info("KPI", "renderDepartments()");
Promise.all([gsr('getDepartments'), gsr('getServices', '')]).then(([depts, svcs]) => {
set('page-content', `
<div class="tabs" id="dept-tabs">
<button class="tab active" onclick="switchDeptTab('depts',this)">Departments (${(depts.data||[]).length})</button>
<button class="tab" onclick="switchDeptTab('svcs',this)">Services (${(svcs.data||[]).length})</button>
</div>
<div id="dept-tab-depts">
<div class="section-header">
<span class="section-title">Departments</span>
<button class="btn btn-primary" onclick="openCreateDept()">+ New Department</button>
</div>
<div class="card"><div class="table-wrap"><table>
<thead><tr><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
<tbody>${(depts.data||[]).map(d => `<tr>
<td><strong>${d.DeptName}</strong></td>
<td>${d.Description||'\u2014'}</td>
<td><div style="display:flex;gap:4px">
<button class="btn btn-icon" onclick="openEditDept('${d.DeptID}','${d.DeptName}','${d.Description||''}')">✏️</button>
<button class="btn btn-icon danger" onclick="delDept('${d.DeptID}')">🗑️</button>
</div></td>
</tr>`).join('')}</tbody>
</table></div></div>
</div>
<div id="dept-tab-svcs" class="hidden">
<div class="section-header">
<span class="section-title">Services</span>
<button class="btn btn-primary" onclick="openCreateService(${JSON.stringify(depts.data||[]).replace(/"/g,'&quot;')})">+ New Service</button>
</div>
<div class="card"><div class="table-wrap"><table>
<thead><tr><th>Service Name</th><th>Department</th><th>Description</th><th>Actions</th></tr></thead>
<tbody>${(svcs.data||[]).map(s => {
var dept = (depts.data||[]).find(d=>d.DeptID===s.DeptID)||{};
return `<tr>
<td><strong>${s.ServiceName}</strong></td>
<td>${dept.DeptName||s.DeptID||'\u2014'}</td>
<td>${s.Description||'\u2014'}</td>
<td><div style="display:flex;gap:4px">
<button class="btn btn-icon" onclick="openEditService('${s.ServiceID}',${JSON.stringify(s).replace(/"/g,'&quot;')},${JSON.stringify(depts.data||[]).replace(/"/g,'&quot;')})">✏️</button>
<button class="btn btn-icon danger" onclick="delService('${s.ServiceID}')">🗑️</button>
</div></td>
</tr>`;
}).join('')}</tbody>
</table></div></div>
</div>
`);
window._depts = depts.data || [];
});
}

function switchDeptTab(tab, btn) {
document.querySelectorAll('#dept-tabs .tab').forEach(t => t.classList.remove('active'));
btn.classList.add('active');
['depts','svcs'].forEach(t => { const el=document.getElementById('dept-tab-'+t); if(el) el.classList.toggle('hidden', t!==tab); });
}

function openCreateDept() {
openModal('New Department', `
<form onsubmit="submitCreateDept(event)">
<div class="form-group"><label class="form-label">Department Name</label><input class="form-control" id="nd-name" required autocomplete="off"></div>
<div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="nd-desc" rows="2"></textarea></div>
<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="nd-submit">Create</button></div>
</form>
`);
}
function submitCreateDept(e) {
e.preventDefault();
e.stopPropagation();
var btn = document.getElementById('nd-submit');
if (btn && btn.disabled) return;
if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }
gsr('createDepartment', { name:document.getElementById('nd-name').value, description:document.getElementById('nd-desc').value }, State.user.id).then(res => {
toast(res.success?'Department created.':res.message, res.success?'success':'error');
if (res.success) { closeModal(); renderDepartments(); }
else if (btn) { btn.disabled = false; btn.textContent = 'Create'; }
});
}
function openEditDept(id, name, desc) {
openModal('Edit Department', `
<form onsubmit="submitEditDept(event,'${id}')">
<div class="form-group"><label class="form-label">Name</label><input class="form-control" id="ed-name" value="${name}" required></div>
<div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="ed-desc" rows="2">${desc}</textarea></div>
<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
</form>
`);
}
function submitEditDept(e, id) {
e.preventDefault();
gsr('updateDepartment', id, { name:document.getElementById('ed-name').value, description:document.getElementById('ed-desc').value }, State.user.id).then(res => {
toast(res.success?'Updated.':res.message, res.success?'success':'error');
if (res.success) { closeModal(); renderDepartments(); }
});
}
function delDept(id) {
if (!confirm('Delete this department?')) return;
gsr('deleteDepartment', id, State.user.id).then(res => { toast(res.success?'Deleted.':res.message, res.success?'success':'error'); if(res.success) renderDepartments(); });
}
function openCreateService(depts) {
openModal('New Service', `
<form onsubmit="submitCreateService(event)">
<div class="form-group"><label class="form-label">Service Name</label><input class="form-control" id="ns-name" required></div>
<div class="form-group"><label class="form-label">Department</label>
<select class="form-control" id="ns-dept">${depts.map(d=>`<option value="${d.DeptID}">${d.DeptName}</option>`).join('')}</select></div>
<div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="ns-desc" rows="2"></textarea></div>
<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create</button></div>
</form>
`);
}
function submitCreateService(e) {
e.preventDefault();
gsr('createService', { name:document.getElementById('ns-name').value, deptId:document.getElementById('ns-dept').value, description:document.getElementById('ns-desc').value }, State.user.id).then(res => {
toast(res.success?'Service created.':res.message, res.success?'success':'error');
if (res.success) { closeModal(); renderDepartments(); }
});
}
function openEditService(id, svc, depts) {
openModal('Edit Service', `
<form onsubmit="submitEditService(event,'${id}')">
<div class="form-group"><label class="form-label">Name</label><input class="form-control" id="es-name" value="${svc.ServiceName||''}" required></div>
<div class="form-group"><label class="form-label">Department</label>
<select class="form-control" id="es-dept">${depts.map(d=>`<option value="${d.DeptID}" ${d.DeptID===svc.DeptID?'selected':''}>${d.DeptName}</option>`).join('')}</select></div>
<div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="es-desc" rows="2">${svc.Description||''}</textarea></div>
<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
</form>
`);
}
function submitEditService(e, id) {
e.preventDefault();
gsr('updateService', id, { name:document.getElementById('es-name').value, deptId:document.getElementById('es-dept').value, description:document.getElementById('es-desc').value }, State.user.id).then(res => {
toast(res.success?'Updated.':res.message, res.success?'success':'error');
if (res.success) { closeModal(); renderDepartments(); }
});
}
function delService(id) {
if (!confirm('Delete this service?')) return;
gsr('deleteService', id, State.user.id).then(res => { toast(res.success?'Deleted.':res.message, res.success?'success':'error'); if(res.success) renderDepartments(); });
}

window._kpiViewMode = window._kpiViewMode || 'list';

function renderKPIMaster() {
  VAA_LOG && VAA_LOG.info("KPI", "renderKPIMaster()");
Promise.all([gsr('getKPIMaster'), gsr('getDepartments'), gsr('getServices','')]).then(([res, depts, svcs]) => {
var kpis     = res.data   || [];
var allDepts = depts.data || [];
var allSvcs  = svcs.data  || [];
// Manager sees only their dept's KPIs and their dept only
if (State.user.role === 'Manager' && State.user.department) {
  kpis     = kpis.filter(function(k){ return k.DeptID === State.user.department; });
  allDepts = allDepts.filter(function(d){ return d.DeptID === State.user.department; });
  allSvcs  = allSvcs.filter(function(s){ return s.DeptID === State.user.department; });
}
window._kpiAllDepts = allDepts;
window._kpiAllSvcs  = allSvcs;
window._kpiAllData  = kpis;
var getDeptName = id => (allDepts.find(d => d.DeptID === id)||{}).DeptName || id || '\u2014';
var getSvcName  = id => (allSvcs.find(s => s.ServiceID === id)||{}).ServiceName || id || '\u2014';
var isListView  = window._kpiViewMode !== 'dept';
set('page-content', `
<div class="section-header">
<span class="section-title">KPI Library <span style="color:var(--text-muted);font-weight:400;font-size:13px;">(${kpis.length})</span></span>
<div style="display:flex;gap:8px;align-items:center;">
<!-- View toggle -->
<div class="kpi-view-toggle" role="group" aria-label="View mode">
<button class="kpi-vtoggle-btn ${isListView&&window._kpiViewMode!=='cluster'?'active':''}" onclick="switchKPIView('list')" title="List">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
List
</button>
<button class="kpi-vtoggle-btn ${!isListView&&window._kpiViewMode!=='cluster'?'active':''}" onclick="switchKPIView('dept')" title="Department">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
By Dept
</button>
<button class="kpi-vtoggle-btn ${window._kpiViewMode==='cluster'?'active':''}" onclick="switchKPIView('cluster')" title="Cluster">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="3"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><line x1="12" y1="11" x2="6" y2="16"/><line x1="12" y1="11" x2="18" y2="16"/></svg>
By Cluster
</button>
</div>
<button class="btn btn-primary" onclick="openCreateKPI()">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
New KPI
</button>
</div>
</div>
<!-- LIST VIEW: grouped by service -->
<div id="kpi-list-view" style="display:${isListView&&window._kpiViewMode!=='cluster'?'block':'none'};">
<div class="kpi-filter-row">
<select class="form-control" id="kpi-filter-dept" onchange="filterKPITable()">
<option value="">All Departments</option>
${allDepts.map(d=>`<option value="${d.DeptID}">${d.DeptName}</option>`).join('')}
</select>
<select class="form-control" id="kpi-filter-svc" onchange="filterKPITable()">
<option value="">All Services</option>
${allSvcs.map(s=>`<option value="${s.ServiceID}" data-dept="${s.DeptID}">${s.ServiceName}</option>`).join('')}
</select>
<input class="form-control" id="kpi-filter-search" oninput="filterKPITable()" placeholder="Search KPI name...">
</div>
<div id="kpi-service-groups">
${buildKPIServiceGroups(kpis, allDepts, allSvcs, getDeptName, getSvcName)}
</div>
</div>
<!-- DEPARTMENT CARD VIEW -->
<div id="kpi-dept-view" style="display:${window._kpiViewMode==='dept'?'block':'none'};">
${allDepts.length === 0 ? `<div class="empty-state"><p>No departments found.</p></div>` :
`<div class="kpi-dept-grid">
${allDepts.map(dept => {
var deptKPIs = kpis.filter(k => k.DeptID === dept.DeptID);
var deptSvcs = allSvcs.filter(s => s.DeptID === dept.DeptID);
var svcBreakdown = deptSvcs.map(s => {
var cnt = kpis.filter(k => k.ServiceID === s.ServiceID).length;
return `<div class="kpi-dept-svc-row">
<span class="kpi-dept-svc-name">${s.ServiceName}</span>
<span class="kpi-dept-svc-count">${cnt} KPI${cnt!==1?'s':''}</span>
</div>`;
}).join('');
return `<div class="kpi-dept-card">
<div class="kpi-dept-card-header">
<div>
<div class="kpi-dept-card-name">${dept.DeptName}</div>
<div class="kpi-dept-card-meta">${deptKPIs.length} KPI${deptKPIs.length!==1?'s':''} across ${deptSvcs.length} service${deptSvcs.length!==1?'s':''}</div>
</div>
<span class="kpi-dept-badge">${deptKPIs.length}</span>
</div>
<div class="kpi-dept-svc-list">
${deptSvcs.length ? svcBreakdown : '<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">No services yet</div>'}
</div>
<div class="kpi-dept-card-footer">
<button class="btn btn-secondary btn-sm" onclick="openDeptKPIView('${dept.DeptID}')">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
View &amp; Edit
</button>
<button class="btn btn-primary btn-sm" onclick="openCreateKPIForDept('${dept.DeptID}')">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
Add KPI
</button>
</div>
</div>`;
}).join('')}
</div>`
}
</div>
`);
});
}


function _buildClusterView() {
  var kpis     = window._kpiAllData   || [];
  var allDepts = window._kpiAllDepts  || [];
  var allSvcs  = window._kpiAllSvcs   || [];
  var canEdit  = ['Administrator','Manager'].includes(State.user.role);
  var getDeptName = function(id){ return (allDepts.find(function(d){ return d.DeptID===id; })||{}).DeptName || id || '\u2014'; };
  var getSvcName  = function(id){ return (allSvcs.find(function(s){ return s.ServiceID===id; })||{}).ServiceName || id || '\u2014'; };

  if (!kpis.length) {
    document.getElementById('kpi-cluster-groups').innerHTML =
      '<div class="table-empty" style="padding:48px;text-align:center;">'
      + '<p style="font-weight:600;">No KPIs found.</p>'
      + '<p style="font-size:12px;color:var(--text-muted);">Add KPIs and assign them a Cluster to see them here.</p>'
      + '</div>';
    return;
  }

  // Build: Cluster \u2192 [kpis]
  var clusterMap = {};
  kpis.forEach(function(k) {
    var cl = String(k.Cluster||'').trim() || 'Unclustered';
    if (!clusterMap[cl]) clusterMap[cl] = [];
    clusterMap[cl].push(k);
  });

  var clusters = Object.keys(clusterMap).sort(function(a,b){
    if (a === 'Unclustered') return 1;
    if (b === 'Unclustered') return -1;
    return a.localeCompare(b);
  });

  var html = clusters.map(function(cl) {
    var clKPIs  = clusterMap[cl];
    var clId    = 'cl-' + cl.replace(/[^a-zA-Z0-9]/g, '_');

    // Sub-group by Dept then Service within cluster
    var deptMap = {};
    clKPIs.forEach(function(k) {
      var dId = k.DeptID || '__none__';
      if (!deptMap[dId]) deptMap[dId] = {};
      var sId = k.ServiceID || '__none__';
      if (!deptMap[dId][sId]) deptMap[dId][sId] = [];
      deptMap[dId][sId].push(k);
    });

    var bodyHtml = Object.keys(deptMap).map(function(dId) {
      var deptName = getDeptName(dId);
      var svcSections = Object.keys(deptMap[dId]).map(function(sId) {
        var svcName = getSvcName(sId);
        var rows = deptMap[dId][sId].map(function(k) {
          return '<tr>'
            + '<td><strong>'+(k.KPIName||'\u2014')+'</strong></td>'
            + '<td><span class="pill">'+(k.Unit||'\u2014')+'</span></td>'
            + '<td style="text-align:right;">'+(k.WeeklyTarget||'\u2014')+'</td>'
            + '<td style="text-align:right;">'+(k.MonthlyTarget||'\u2014')+'</td>'
            + '<td><span class="badge '+(k.PerformanceDirection==='higher'?'badge-success':'badge-warning')+'">'+(k.PerformanceDirection||'\u2014')+'</span></td>'
            + (canEdit ? '<td><button class="btn btn-icon" title="Edit" onclick="openEditKPI(\''+k.KPIID+'\')">'
              + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
              + '</button></td>' : '<td></td>')
            + '</tr>';
        }).join('');
        return '<div style="margin-bottom:1px;">'
          + '<div style="padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);background:rgba(255,255,255,0.02);">'
          + deptName + ' &rsaquo; ' + svcName + '</div>'
          + '<div class="table-wrap" style="margin:0;border-radius:0;"><table style="border:none;">'
          + '<colgroup><col style="width:30%"><col style="width:7%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:8%"></colgroup>'
          + '<thead><tr><th>KPI Name</th><th>Unit</th><th>Wk Target</th><th>Mo Target</th><th>Direction</th><th></th></tr></thead>'
          + '<tbody>' + rows + '</tbody></table></div>'
          + '</div>';
      }).join('');
      return svcSections;
    }).join('');

    return '<div class="kpi-cluster-section">'
      + '<div class="kpi-cluster-header" onclick="toggleKPICluster(\''+clId+'\')">'
      + '<span class="kpi-cluster-name">'+cl+'</span>'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<span class="kpi-cluster-count">'+clKPIs.length+' KPI'+(clKPIs.length!==1?'s':'')+'</span>'
      + '<svg id="chev-'+clId+'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:transform .2s;color:var(--text-muted);"><polyline points="6 9 12 15 18 9"/></svg>'
      + '</div></div>'
      + '<div id="body-'+clId+'">' + bodyHtml + '</div>'
      + '</div>';
  }).join('');

  var wrap = document.getElementById('kpi-cluster-groups');
  if (wrap) wrap.innerHTML = html;
}

function toggleKPICluster(id) {
  var body  = document.getElementById('body-'+id);
  var chev  = document.getElementById('chev-'+id);
  if (!body) return;
  var hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (chev) chev.style.transform = hidden ? '' : 'rotate(-90deg)';
}

function switchKPIView(mode) {
window._kpiViewMode = mode;
var listView = document.getElementById('kpi-list-view');
var deptView = document.getElementById('kpi-dept-view');
var btns = document.querySelectorAll('.kpi-vtoggle-btn');
if (listView) listView.style.display = mode === 'list' ? 'block' : 'none';
if (deptView) deptView.style.display = mode === 'dept' ? 'block' : 'none';
btns.forEach(b => b.classList.toggle('active', (mode === 'list') === b.title.includes('List')));
}

function buildKPIServiceGroups(kpis, allDepts, allSvcs, getDeptName, getSvcName) {
getDeptName = getDeptName || (id => (( window._kpiAllDepts||[]).find(d=>d.DeptID===id)||{}).DeptName||id||'\u2014');
getSvcName  = getSvcName  || (id => ((window._kpiAllSvcs ||[]).find(s=>s.ServiceID===id)||{}).ServiceName||id||'\u2014');
allDepts    = allDepts    || window._kpiAllDepts || [];
allSvcs     = allSvcs     || window._kpiAllSvcs  || [];
kpis        = kpis        || window._kpiAllData  || [];
if (!kpis.length && !allSvcs.length) {
return `<div class="empty-state" style="padding:48px 20px;text-align:center;color:var(--text-muted);">No KPIs yet. Click "+ New KPI" to get started.</div>`;
}
return allDepts.map(dept => {
var deptSvcs = allSvcs.filter(s => s.DeptID === dept.DeptID);
if (!deptSvcs.length) return '';
var deptKPIs = kpis.filter(k => k.DeptID === dept.DeptID);
var svcSections = deptSvcs.map(svc => {
var svcKPIs = kpis.filter(k => k.ServiceID === svc.ServiceID);
var svcId   = svc.ServiceID;

// ── Group svcKPIs by Cluster ──
var clusterMap = {};
svcKPIs.forEach(function(k){
  var cl = String(k.Cluster||'').trim() || '\u2014 No Cluster \u2014';
  if (!clusterMap[cl]) clusterMap[cl] = [];
  clusterMap[cl].push(k);
});
var clusterKeys = Object.keys(clusterMap).sort(function(a,b){
  if (a==='\u2014 No Cluster \u2014') return 1;
  if (b==='\u2014 No Cluster \u2014') return -1;
  return a.localeCompare(b);
});

var clusterSections = clusterKeys.length > 1
  ? clusterKeys.map(function(cl){
      var clKPIs = clusterMap[cl];
      var clId   = 'cl_' + svcId + '_' + cl.replace(/[^a-zA-Z0-9]/g,'_');
      var clRows = clKPIs.map(k => kpiTableRow(k, getDeptName, getSvcName)).join('');
      return `<div class="kpi-cluster-inner">
<div class="kpi-cluster-inner-header" onclick="toggleKPIInnerCluster('${clId}')">
  <svg class="kpi-svc-chevron" id="ichev-${clId}" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  <span class="kpi-cluster-inner-name">${cl}</span>
  <span class="kpi-svc-count-badge" style="margin-left:6px;">${clKPIs.length}</span>
</div>
<div id="ibody-${clId}">
<div class="table-wrap"><table class="kpi-svc-table">
<colgroup><col style="width:28%"><col style="width:7%"><col style="width:10%"><col style="width:10%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:18%"></colgroup>

function addBulkKPIRow(deptId, svcId) {
var tbody = document.getElementById('bulk-kpi-rows');
if (!tbody) return;
var idx = tbody.rows.length + 1;
var unitOpts = window._bulkUnitOpts || '';
var dirOpts  = window._bulkDirOpts  || '';

var input = function(id, ph, type) { return '<input class="form-control" style="min-width:0;font-size:12px;padding:4px 8px;" id="'+id+'" placeholder="'+(ph||'')+'" type="'+(type||'text')+'">'; };
var select = function(id, opts) { return '<select class="form-control" style="font-size:12px;padding:4px 6px;" id="'+id+'">'+opts+'</select>'; };
var row = document.createElement('tr');
row.dataset.idx = idx;
row.innerHTML = td('<span style="font-size:12px;color:var(--text-muted);">'+idx+'</span>', '28px')
  + td(input('bkn-'+idx, 'KPI Name', 'text'))
  + td(select('bku-'+idx, unitOpts), '90px')
  + td(input('bkwt-'+idx, '0', 'number'), '90px')
  + td(input('bkmt-'+idx, '0', 'number'), '90px')
  + td(select('bkd-'+idx, dirOpts), '90px')
  + td('<div style="display:flex;flex-direction:column;gap:2px;">' + input('bkdev-'+idx, '0', 'number') + '<span id="bkdevp-'+idx+'" style="font-size:10px;color:var(--text-muted);"></span></div>', '90px')
  + td('<div style="display:flex;flex-direction:column;gap:2px;">' + input('bkrisk-'+idx, '0', 'number') + '<span id="bkriskp-'+idx+'" style="font-size:10px;color:var(--text-muted);"></span></div>', '90px')
  + td(input('bkdesc-'+idx, 'Optional description', 'text'))

tbody.appendChild(row);
// Wire pct compute
['bkwt-'+idx,'bkdev-'+idx,'bkrisk-'+idx,'bku-'+idx].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('input', function(){ bulkRowPct(idx); });
});
}

function renumberBulkRows() {
var rows = document.querySelectorAll('#bulk-kpi-rows tr');
rows.forEach(function(row, i) {
  var numCell = row.cells[0];
  if (numCell) numCell.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">'+(i+1)+'</span>';
});
}

function bulkRowPct(idx) {
var wt  = parseFloat((document.getElementById('bkwt-'+idx)||{}).value) || 0;
var dev = parseFloat((document.getElementById('bkdev-'+idx)||{}).value) || 0;
var rsk = parseFloat((document.getElementById('bkrisk-'+idx)||{}).value) || 0;
var unit = (document.getElementById('bku-'+idx)||{}).value || '';
var isPct = unit === '%';
var devEl  = document.getElementById('bkdevp-'+idx);
var rskEl  = document.getElementById('bkriskp-'+idx);
if (devEl)  devEl.textContent  = (!isPct && wt) ? (dev/wt*100).toFixed(1)+'% of target' : '';
if (rskEl)  rskEl.textContent  = (!isPct && wt) ? (rsk/wt*100).toFixed(1)+'% of target' : '';
}

function bulkRowUnitChange(idx) { bulkRowPct(idx); }

function submitBulkKPIs(deptId, svcId) {
var rows = document.querySelectorAll('#bulk-kpi-rows tr');
if (!rows.length) { toast('Add at least one row.', 'warning'); return; }
var kpis = [];
var hasError = false;
rows.forEach(function(row) {
  var idx = row.dataset.idx;
  var name = (document.getElementById('bkn-'+idx)||{}).value || '';
  if (!name.trim()) return; // skip blank rows silently
  kpis.push({
    name:              name.trim(),
    unit:              (document.getElementById('bku-'+idx)||{}).value || '',
    weeklyTarget:      (document.getElementById('bkwt-'+idx)||{}).value || '0',
    monthlyTarget:     (document.getElementById('bkmt-'+idx)||{}).value || '0',
    performanceDirection: (document.getElementById('bkd-'+idx)||{}).value || 'higher',
    deviationThreshold:   (document.getElementById('bkdev-'+idx)||{}).value || '0',
    atRiskThreshold:      (document.getElementById('bkrisk-'+idx)||{}).value || '0',
    description:       (document.getElementById('bkdesc-'+idx)||{}).value || '',
    deptId:            deptId,
    serviceId:         svcId,
    calculationLogic:  '',
    dataSource:        '',
    isActive:          true
  });
});
if (!kpis.length) { toast('No valid rows to save. Fill in at least one KPI Name.', 'warning'); return; }
var btn = event && event.target ? event.target.closest('button') : null;
if (btn) { btn.disabled = true; btn.textContent = 'Saving '+kpis.length+' KPIs...'; }
// Submit sequentially
var saved = 0, failed = 0;
function saveNext(i) {
  if (i >= kpis.length) {
    toast(saved + ' KPI' + (saved!==1?'s':'') + ' saved.' + (failed?' '+failed+' failed.':''), saved>0?'success':'error');
    if (saved > 0) { closeModal(); renderKPIMaster(); }
    else if (btn) { btn.disabled = false; btn.textContent = 'Save All KPIs'; }
    return;
  }
  gsr('createKPI', kpis[i], State.user.id).then(function(res) {
    if (res && res.success) saved++; else failed++;
    saveNext(i + 1);
  });
}
saveNext(0);
}

function kpiFormUnitChange() {

function kpiFormComputePct() {

}

var IMPORT_COLS = ['clientName','clientEmail','deptName','serviceName','vaName','tlName','startDate','status'];
var IMPORT_HEADERS = ['Client Name *','Client Email','Department *','Service *','VA Full Name','TL Full Name','Start Date (YYYY-MM-DD)','Status (Active/Inactive)'];
var IMPORT_EXAMPLE = [
['John Smith','john@example.com','Customer Service','Billing Support','Jane Doe','Mike Rivera','2025-01-15','Active'],
['Maria Garcia','maria@example.com','Technical Support','Tier 1','Alex Kim','Sam Lee','2025-02-01','Active']
];

function buildImportStep1(){toast("Feature coming soon","info");}

function importPasteChanged() {
var val = (document.getElementById('import-paste')||{}).value || '';
var btn = document.getElementById('import-next-btn');
if (btn) btn.disabled = !val.trim();
}

function handleImportFile(input) {
var file = input.files[0];
if (!file) return;
var reader = new FileReader();
reader.onload = function(e) {
var text = e.target.result;
var textarea = document.getElementById('import-paste');
if (textarea) {
var lines = text.trim().split('\n');
var firstCell = (lines[0]||'').split(/[,\t]/)[0].trim().toLowerCase();
var startsWithHeader = firstCell.includes('client') || firstCell.includes('name');
textarea.value = (startsWithHeader ? lines.slice(1) : lines).join('\n');
importPasteChanged();
}
};
reader.readAsText(file);
var zone = document.getElementById('import-upload-zone');
if (zone) { zone.classList.add('loaded'); zone.querySelector('.import-upload-text').textContent = '\u2713 ' + file.name; }
}

function parseImportText(raw) {
var lines = raw.trim().split('\n').filter(l => l.trim());
return lines.map(function(line) {
var delim = line.includes('\t') ? '\t' : ',';
var cols = line.split(delim).map(function(c){ return c.trim().replace(/^"|"$/g,'').trim(); });
var row = {};
IMPORT_COLS.forEach(function(key, i){ row[key] = cols[i] || ''; });
return row;
});
}

function downloadImportTemplate() {
var header = IMPORT_HEADERS.join(',');
var rows   = IMPORT_EXAMPLE.map(r => r.map(c => `"${c}"`).join(','));
var csv    = [header, ...rows].join('\n');
var blob   = new Blob([csv], { type: 'text/csv' });
var url    = URL.createObjectURL(blob);
var a      = document.createElement('a');
a.href = url; a.download = 'connections_import_template.csv';
document.body.appendChild(a); a.click();
document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importGoToPreview() {
var raw = (document.getElementById('import-paste')||{}).value || '';
if (!raw.trim()) return;
var rows;
try { rows = parseImportText(raw); } catch(e) { showImportError('Could not parse input: ' + e.message); return; }
if (!rows.length) { showImportError('No data rows found.'); return; }
Promise.all([gsr('getDepartments'), gsr('getServices',''), gsr('getVAConnectionUsers')]).then(([depts, svcs, users]) => {
var allDepts = depts.data||[];
var allSvcs  = svcs.data||[];
var allUsers = users.data||[];
var vas  = allUsers.filter(u => u.Role === 'Virtual Assistant');
var tls  = allUsers.filter(u => u.Role === 'Team Leader');
var validated = rows.map(function(row, i) {
var errors = [];
if (!row.clientName) errors.push('Client Name is required');
var dept = allDepts.find(d => d.DeptName.toLowerCase().trim() === row.deptName.toLowerCase().trim());
var svc  = allSvcs.find(s  => s.ServiceName.toLowerCase().trim() === row.serviceName.toLowerCase().trim());
var va   = row.vaName ? vas.find(u => (u.FirstName+' '+u.LastName).toLowerCase().trim() === row.vaName.toLowerCase().trim()) : true;
var tl   = row.tlName ? tls.find(u => (u.FirstName+' '+u.LastName).toLowerCase().trim() === row.tlName.toLowerCase().trim()) : true;
if (!dept) errors.push(`Department "${row.deptName}" not found`);
if (!svc)  errors.push(`Service "${row.serviceName}" not found`);
if (row.vaName && !va)   errors.push(`VA "${row.vaName}" not found`);
if (row.tlName && !tl)   errors.push(`TL "${row.tlName}" not found`);
if (row.startDate && !/^\d{4}-\d{2}-\d{2}$/.test(row.startDate)) errors.push('Start Date must be YYYY-MM-DD');
if (row.status && !['Active','Inactive'].includes(row.status)) errors.push('Status must be Active or Inactive');
return { ...row, _row: i+1, _valid: errors.length === 0, _errors: errors };
});
window._importRows = validated;
var box = document.getElementById('modal-box');
if (box) box.className = 'modal-box modal-xl';
openModal('Import Connections \u2014 Preview', buildImportStep2(validated));
});
}

function buildImportStep2(){toast("Feature coming soon","info");}

function showImportError(msg) {
var el = document.getElementById('import-parse-error');
if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}

function runImportConnections() {
var validRows = (window._importRows || []).filter(r => r._valid);
if (!validRows.length) return;
var body = document.getElementById('modal-body');
if (body) body.innerHTML = `
<div style="text-align:center;padding:48px 24px;">
<div class="spinner" style="margin:0 auto 20px;"></div>
<div style="font-size:15px;font-weight:600;margin-bottom:8px;">Importing ${validRows.length} connection${validRows.length!==1?'s':''}...</div>
<div style="font-size:13px;color:var(--text-muted);">This may take a moment. Please do not close this window.</div>
</div>`;
var payload = validRows.map(function(r) {
return { clientName:r.clientName, clientEmail:r.clientEmail, deptName:r.deptName,
serviceName:r.serviceName, vaName:r.vaName, tlName:r.tlName,
startDate:r.startDate, status:r.status||'Active' };
});
gsr('bulkCreateConnections', payload, State.user.id).then(function(res) {
window._importRows = null;

function openCreateConnection() {
Promise.all([gsr('getDepartments'), gsr('getServices',''), gsr('getVAConnectionUsers')]).then(([depts,svcs,users]) => {
var vas = (users.data||[]).filter(function(u){ return u.Role==='Virtual Assistant'; });
window._allDepts = depts.data||[]; window._allSvcs = svcs.data||[];
openModal('New Connection',
'<form onsubmit="submitCreateConn(event)">'
+ '<div class="form-row">'
+ '<div class="form-group"><label class="form-label">Client Name *</label><input class="form-control" id="nc-client" required autocomplete="off"></div>'
+ '<div class="form-group"><label class="form-label">Client Email</label><input class="form-control" id="nc-email" type="email" autocomplete="off"></div>'
+ '</div>'
+ '<div class="form-row">'
+ '<div class="form-group"><label class="form-label">Department *</label>'
+ '<select class="form-control" id="nc-dept" onchange="filterSvcsByDept(this.value)" required>'
+ '<option value="">\u2014 Select \u2014</option>'
+ (depts.data||[]).map(function(d){ return '<option value="'+d.DeptID+'">'+d.DeptName+'</option>'; }).join('')
+ '</select></div>'
+ '<div class="form-group"><label class="form-label">Service *</label>'
+ '<select class="form-control" id="nc-svc" required>'
+ '<option value="">\u2014 Select department first \u2014</option>'
+ (svcs.data||[]).map(function(s){ return '<option value="'+s.ServiceID+'" data-dept="'+s.DeptID+'">'+s.ServiceName+'</option>'; }).join('')
+ '</select></div>'
+ '</div>'
+ '<div class="form-row">'
+ '<div class="form-group"><label class="form-label">VA / Agent</label>'
+ '<select class="form-control" id="nc-va"><option value="">\u2014 Select VA \u2014</option>'
+ vas.map(function(v){ return '<option value="'+v.UserID+'">'+v.Name+'</option>'; }).join('')
+ '</select></div>'
+ '<div class="form-group"><label class="form-label">Start Date</label><input class="form-control" id="nc-start" type="date" value="'+new Date().toISOString().split('T')[0]+'" required></div>'
+ '</div>'
+ '<div class="form-group"><label class="form-label">Status</label>'
+ '<select class="form-control" id="nc-status"><option>Active</option><option>Inactive</option></select>'
+ '</div>'
+ '<div class="form-actions">'
+ '<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>'
+ '<button type="submit" class="btn btn-primary" id="nc-submit-btn">'
+ '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>'
+ 'Save Connection'
+ '</button>'
+ '</div>'
+ '</form>', 'modal-lg');
});
}
function filterSvcsByDept(deptId) {
var svcSel = document.getElementById('nc-svc');
if (!svcSel) return;
Array.from(svcSel.options).forEach(function(opt) {
if (!opt.value) return;
opt.hidden = !!(deptId && opt.dataset.dept !== deptId);
});
if (svcSel.value && (svcSel.options[svcSel.selectedIndex]||{}).hidden) svcSel.value = '';
}
function submitCreateConn(e) {
e.preventDefault();
e.stopPropagation();
var btn = document.getElementById('nc-submit-btn');
if (btn && btn.disabled) return;
if (btn) {
btn.disabled = true;
btn.innerHTML = '<div class="inline-spinner"></div> Saving...';
}
var data = {
clientName: document.getElementById('nc-client').value,
clientEmail: document.getElementById('nc-email').value,
deptId: document.getElementById('nc-dept').value,
serviceId: document.getElementById('nc-svc').value,
vaUserId: document.getElementById('nc-va').value,
teamLeaderUserId: '',
startDate: document.getElementById('nc-start').value,
status: document.getElementById('nc-status').value
};
gsr('createVAConnection', data, State.user.id).then(function(res) {
if (res && res.success) {
closeModal();
toast('Connection saved successfully.', 'success');
renderConnections();
} else {
toast((res && res.message) || 'Save failed. Please try again.', 'error');
if (btn) {
btn.disabled = false;
btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Connection';
}
}
});
}

function openKPIConfig(connId) { openConnectionDetail(connId); }

window.renderKPIMaster   = renderKPIMaster;

</script>
